let HL = HL_PRESETS[1].arr, HL_LABEL = HL_PRESETS[1].label; /* пороги подсветки */
let SLICES_N = 8;                                            /* сколько последних срезов показывать */
let PERIOD = {from: DATES[0].iso, to: DATES[DATES.length-1].iso};
let SAMPLING = 'all';                                        /* частота срезов: all/day/week/2week/month */
let VIS = new Set(DATES.map((_,i)=>i)), LASTV = DATES.length-1;

function isoWeekKey(iso, span){
  const d = new Date(iso+'T00:00:00');
  const onejan = new Date(d.getFullYear(),0,1);
  const week = Math.floor(((d-onejan)/86400000 + onejan.getDay())/7);
  return d.getFullYear()+'-'+Math.floor(week/span);
}
function visibleIdx(){
  let idx = DATES.map((_,i)=>i).filter(i=> DATES[i].iso>=PERIOD.from && DATES[i].iso<=PERIOD.to);
  if(SAMPLING!=='all'){
    const keyFn = SAMPLING==='month' ? i=>DATES[i].iso.slice(0,7)
      : SAMPLING==='2week' ? i=>isoWeekKey(DATES[i].iso,2)
      : SAMPLING==='week' ? i=>isoWeekKey(DATES[i].iso,1)
      : i=>DATES[i].iso; /* day: не более одного среза в день */
    const seen = new Set();
    idx = idx.filter(i=>{ const k2=keyFn(i); if(seen.has(k2)) return false; seen.add(k2); return true; });
  }
  if(idx.length>SLICES_N) idx = idx.slice(-SLICES_N);
  if(!idx.length) idx = [DATES.length-1];
  return new Set(idx);
}
function prevVis(i){ for(let j=i-1;j>=0;j--) if(VIS.has(j)) return j; return -1; }
const fmtRu = iso => iso.split('-').reverse().join('.');
function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).catch(()=>{}); return; }
  const ta = document.createElement('textarea');
  ta.value = t; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  ta.remove();
}

/* ================= HELPERS ================= */
const band = p => {
  if(p==null||p==='na') return null;
  const B=['t3','t10','t20','t50'];
  for(let i=0;i<HL.length;i++){ if(HL[i]!=null && p<=HL[i]) return B[i]; }
  return p<=100 ? 't100' : null;
};
const fmtWs = n => n>=1e6 ? (n/1e6).toFixed(1).replace('.',',').replace(',0','')+'M'
  : n>=1000 ? (n/1000).toFixed(1).replace('.',',').replace(',0','')+'k' : String(n);
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');

function spark(vals, w=110, h=26, color='var(--accent)'){
  const min=Math.min(...vals), max=Math.max(...vals), span=(max-min)||1;
  const pts = vals.map((v,i)=>[(i/(vals.length-1))*(w-4)+2, h-3-((v-min)/span)*(h-8)]);
  const line = pts.map(p=>p.join(',')).join(' ');
  const last = pts[pts.length-1];
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round" opacity=".85"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="${color}"/></svg>`;
}

function delta(vals,i){ /* к предыдущему ПОКАЗАННОМУ срезу */
  const j = prevVis(i);
  if(j<0) return 0;
  const cur=vals[i], prev=vals[j];
  if(typeof cur!=='number'||typeof prev!=='number') return 0;
  return cur-prev;
}
function posDelta(pos,i){ /* улучшение позиции = положительная дельта; сравнение с предыдущим видимым срезом */
  if(typeof pos[i]!=='number') return null;
  for(let j=i-1;j>=0;j--){
    if(!VIS.has(j)) continue;
    if(typeof pos[j]==='number') return pos[j]-pos[i];
  }
  return null;
}
/* категории ключа для вкладок видов: упал/вырос — относительно предыдущего показанного среза */
function keyCats(k){
  const last = k.pos[LASTV];
  const d = posDelta(k.pos, LASTV);
  const cats = [];
  if(d!=null && d<0) cats.push('fell');
  if(d!=null && d>0) cats.push('rose');
  if(typeof last==='number' && last<=10) cats.push('top10');
  if(last==null) cats.push('out');
  return cats;
}

function bindChrome(){
  document.querySelectorAll('.ts-btn').forEach(b=> b.onclick = ()=>{
    userTheme = b.dataset.mode==='system' ? null : b.dataset.mode;
    applyTheme();
  });
  const gsWrap = document.getElementById('searchWrap');
  if(gsWrap){
    const inp = gsWrap.querySelector('#gsInput');
    inp.onfocus = ()=>{ gsWrap.classList.add('open'); renderGsList(); };
    inp.oninput = renderGsList;
    gsWrap.querySelectorAll('.gs-tab').forEach(t=> t.onclick = e=>{
      e.stopPropagation();
      GS_TAB = t.dataset.t;
      gsWrap.querySelectorAll('.gs-tab').forEach(x=>x.classList.toggle('active', x===t));
      renderGsList();
    });
  }
  const logo = document.querySelector('.topbar .logo');
  if(logo) logo.onclick = goHome;
  document.querySelectorAll('.crumb-home').forEach(a=> a.onclick = e=>{ e.preventDefault(); goHome(); });
}
function goHome(){ PAGE='home'; renderHome(); }
function goMon(){ PAGE='mon'; show(cur); }

function statusCellHtml(m){
  return `<span class="hcal" data-tip="Открыт | ${m.sched}">${I.cal}</span><span class="hdot ${m.st}" data-tip="${ST_TIP[m.st]}"></span><span class="hdate">${m.next}</span>`;

function psBadge(ps){
  const worst = Math.min(ps[0], ps[1]);
  const cls = worst>=90 ? 'g' : worst>=50 ? 'm' : 'b';
  return `<span class="ps ${cls}" title="Google PageSpeed: desktop / mobile">${ps[0]} / ${ps[1]}</span>`;
}
function homeBandCell(n,d,bi){
  const sup = d ? `<sup class="${d>0?'up':'down'}">${d>0?'+':''}${d}</sup>` : '';
  return `<td class="bd ${bi!=null?('b'+bi):''}"><span class="bnum ${n===0?'z':''}">${n}</span>${sup}</td>`;
}

function applyHomeFilter(){
  const q = HOME_Q.toLowerCase();
  app.querySelectorAll('tr.h-m').forEach(r=>{
    const ok = (!HOME_FAV_ONLY || r.querySelector('.hm-star').classList.contains('on'))
      && (r.dataset.search||'').includes(q);
    r.classList.toggle('vh', !ok);
  });
  app.querySelectorAll('tr.h-p').forEach(p=>{
    const any = [...app.querySelectorAll(`tr.h-m[data-hpp="${p.dataset.hp}"]`)].some(r=>!r.classList.contains('vh'));
    p.classList.toggle('vh', !any);
  });
  app.querySelectorAll('tr.h-g').forEach(g=>{
    const any = [...app.querySelectorAll(`tr.h-p[data-hgp="${g.dataset.hg}"]`)].some(r=>!r.classList.contains('vh'));
    g.classList.toggle('vh', !any);
    const gap = g.previousElementSibling;
    if(gap && gap.classList.contains('group-gap')) gap.classList.toggle('vh', !any);
  });
}

function bindHome(){
  /* поиск и фильтр избранного */
  const q = document.getElementById('homeQ');
  if(q) q.oninput = ()=>{ HOME_Q = q.value; applyHomeFilter(); };
  const fav = document.getElementById('homeFav');
  if(fav) fav.onclick = ()=>{ HOME_FAV_ONLY = !HOME_FAV_ONLY; fav.classList.toggle('on', HOME_FAV_ONLY); applyHomeFilter(); };
  /* звёзды мониторингов */
  app.querySelectorAll('.hm-star').forEach(s=> s.onclick = e=>{
    e.stopPropagation();
    const [gi,pi,mi] = s.closest('tr').dataset.mi.split('-').map(Number);
    const m = HOME[gi].projects[pi].mons[mi];
    m.fav = !m.fav;
    s.classList.toggle('on', m.fav);
    s.textContent = m.fav ? '★' : '☆';
    applyHomeFilter();
  });
  /* сворачивание групп и проектов */
  app.querySelectorAll('tr.h-g').forEach(g=>{
    g.style.cursor='pointer';
    g.onclick = e=>{
      if(e.target.closest('.hg-btn')||e.target.closest('.hsel-box')) return;
      g.classList.toggle('collapsed');
      const on = g.classList.contains('collapsed');
      app.querySelectorAll(`tr[data-hgp="${g.dataset.hg}"]`).forEach(r=>r.classList.toggle('hh-hide', on));
    };
  });
  app.querySelectorAll('tr.h-p').forEach(p=>{
    p.style.cursor='pointer';
    p.onclick = e=>{
      if(e.target.closest('.hg-btn')||e.target.closest('.hsel-box')||e.target.closest('.p-link')) return;
      p.classList.toggle('collapsed');
      const on = p.classList.contains('collapsed');
      app.querySelectorAll(`tr.h-m[data-hpp="${p.dataset.hp}"]`).forEach(r=>r.classList.toggle('hh-hide', on));

  /* тумблеры свернуть всё */

    const collapse = !!app.querySelector('tr.h-g:not(.collapsed)');
    app.querySelectorAll('tr.h-g').forEach(g=>g.classList.toggle('collapsed', collapse));
    app.querySelectorAll('tr[data-hgp]').forEach(r=>r.classList.toggle('hh-hide', collapse));
  };
  const fp = document.getElementById('homeFoldP');
  if(fp) fp.onclick = ()=>{
    const collapse = !!app.querySelector('tr.h-p:not(.collapsed)');
    app.querySelectorAll('tr.h-p').forEach(p=>p.classList.toggle('collapsed', collapse));
    app.querySelectorAll('tr.h-m').forEach(r=>r.classList.toggle('hh-hide', collapse));
  };
  /* массовое выделение: все уровни, каскад вниз (группа → проекты+мониторинги, проект → мониторинги) */
  const updateBulk = ()=>{
    const g = app.querySelectorAll('.hsel-box.lvl-g.checked').length;
    const p = app.querySelectorAll('.hsel-box.lvl-p.checked').length;
    const m = app.querySelectorAll('.hsel-box.checked:not(.lvl-g):not(.lvl-p)').length;
    const chip = document.getElementById('bulkChip');
    if(!chip) return;
    const parts = [];
    if(g) parts.push(g+' гр.');
    if(p) parts.push(p+' пр.');
    if(m) parts.push(m+' мон.');
    chip.hidden = !parts.length;
    chip.querySelector('b').textContent = parts.join(' · ');
  };
  app.querySelectorAll('.hsel-box').forEach(cb=> cb.onclick = e=>{
    e.stopPropagation();
    const on = !cb.classList.contains('checked');
    cb.classList.toggle('checked', on);
    const sc = cb.dataset.sc || '';
    if(sc.startsWith('g:')){
      app.querySelectorAll(`tr[data-hgp="${sc.slice(2)}"] .hsel-box`).forEach(x=>x.classList.toggle('checked', on));
    } else if(sc.startsWith('p:')){
      app.querySelectorAll(`tr.h-m[data-hpp="${sc.slice(2)}"] .hsel-box`).forEach(x=>x.classList.toggle('checked', on));
    }
    updateBulk();
  });
  const bc = document.getElementById('bulkClear');
  if(bc) bc.onclick = ()=>{
    app.querySelectorAll('.hsel-box.checked').forEach(cb=>cb.classList.remove('checked'));
    updateBulk();
  };
  /* клик по мониторингу → страница позиций */
  app.querySelectorAll('tr.h-m').forEach(r=> r.onclick = e=>{
    if(e.target.closest('.hm-star')||e.target.closest('.hsel-box')||e.target.closest('.hg-btn')) return;
    goMon();
  });
}

function trendHtml(diff, invert=false){
  if(!diff) return '<span class="trend" style="color:var(--text-3)">— без изменений</span>';
  const good = invert ? diff<0 : diff>0;
  const cls = good?'up':'down';
  const arrow = diff>0?'▲':'▼';
  return `<span class="trend ${cls}">${arrow} ${Math.abs(diff)} к прошлому срезу</span>`;
}

function renderSummaryTable(){
  const head = DATES.map((d,i)=>`<td class="${i===DATES.length-1?'lastcol':''}" style="color:var(--text-3);font-size:10.5px;font-weight:650;text-transform:uppercase">${d.d} <span style="font-weight:500">${d.w}</span></td>`).join('');
  const rows = SUMMARY.map(r=>{
    const cells = DATES.map((_,i)=>{
      const df = delta(r.vals,i);
      const dh = i>0&&df!==0 ? `<span class="sum-delta ${df>0?'up':'down'}">${df>0?'▲':'▼'}${Math.abs(df)}</span>` : '';
      return `<td class="${i===DATES.length-1?'lastcol':''}"><span class="num">${r.vals[i]}</span><span class="pct">${r.pct[i]} %</span>${dh}</td>`;
    }).join('');
    const sw = r.band?`<span class="sw" style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--${r.band}-heat);margin-right:7px;vertical-align:1px"></span>`:'';
    return `<tr class="${r.hero?'hero':''}"><th>${sw}${r.label}</th>${cells}</tr>`;
  }).join('');
  const totals = DATES.map((_,i)=>`<td class="${i===DATES.length-1?'lastcol':''}" style="color:var(--text-3)">${TOTAL_KEYS[i]}</td>`).join('');
  return `<div class="summary-table"><table>
    <tr><th style="font-size:10.5px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em">Сводка · срезы</th>${head}</tr>
    ${rows}
    <tr><th style="color:var(--text-3)">Всего ключей</th>${totals}</tr>
  </table></div>`;
}

function renderSummaryStrip(){
  const items = SUMMARY.map(r=>{
    const last = r.vals.length-1;
    const df = delta(r.vals,last);
    const color = r.band?`var(--${r.band}-heat)`:'var(--accent)';
    return `<div class="strip-item">
      <span class="lbl">${r.label.replace('Ключей в ','')}</span>
      <span class="val">${r.vals[last]}<span class="pct">${r.pct[last]} %</span></span>
      ${trendHtml(df)}
      ${spark(r.vals,104,22,color)}
    </div>`;
  }).join('');
  return `<div class="summary-strip">${items}</div>`;
}

function renderSummaryCards(side=false){
  const cards = SUMMARY.map(r=>{
    const last = r.vals.length-1;
    const df = delta(r.vals,last);
    const color = r.band?`var(--${r.band}-heat)`:'var(--accent)';
    const sw = r.band?`<span class="sw" style="background:var(--${r.band}-heat)"></span>`:'';
    return `<div class="sum-card">
      <span class="lbl">${sw}${r.label}</span>
      <span class="val">${r.vals[last]}<span class="pct">${r.pct[last]} % от ядра</span></span>
      ${trendHtml(df)}
      ${spark(r.vals, side?150:150, 26, color)}
    </div>`;
  }).join('');
  return `<div class="${side?'summary-side':'summary-cards'}">${cards}</div>`;
}

function renderSummaryChart(){
  const vis = SUMMARY[0];
  const W=760, H=168, PL=38, PR=18, PT=20, PB=26;
  const vals = vis.vals;
  const min = Math.min(...vals), max = Math.max(...vals), span = (max-min)||1;
  const x = i => PL + i*((W-PL-PR)/(vals.length-1));
  const y = v => PT + (1-((v-min)/span))*(H-PT-PB);
  const pts = vals.map((v,i)=>[x(i),y(v)]);
  const line = pts.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ');
  const area = `M${pts[0][0]},${pts[0][1]} `+pts.slice(1).map(p=>`L${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ')+` L${pts[pts.length-1][0]},${H-PB+6} L${pts[0][0]},${H-PB+6} Z`;
  const grid = [min, Math.round((min+max)/2), max].map(v=>
    `<line x1="${PL}" y1="${y(v)}" x2="${W-PR}" y2="${y(v)}" stroke="var(--border)" stroke-width="1"/>
     <text x="${PL-6}" y="${y(v)+3}" text-anchor="end" font-size="9.5" fill="var(--text-3)">${v}</text>`).join('');
  const dots = pts.map((p,i)=>{
    const last = i===pts.length-1;
    return `<circle cx="${p[0]}" cy="${p[1]}" r="${last?4:2.6}" fill="${last?'var(--accent)':'var(--surface)'}" stroke="var(--accent)" stroke-width="1.6"/>
      <text x="${p[0]}" y="${p[1]-8}" text-anchor="middle" font-size="9.5" font-weight="${last?'700':'400'}" fill="${last?'var(--text)':'var(--text-3)'}">${vals[i]}</text>
      <text x="${p[0]}" y="${H-8}" text-anchor="middle" font-size="9.5" fill="var(--text-3)">${DATES[i].d}</text>`;
  }).join('');
  const side = SUMMARY.map(r=>{
    const lastI = r.vals.length-1, df = delta(r.vals,lastI);
    const dd = df===0?'<span class="dd flat">0</span>':`<span class="dd ${df>0?'up':'down'}">${df>0?'▲':'▼'}${Math.abs(df)}</span>`;
    const sw = r.band?`<span class="sw" style="background:var(--${r.band}-heat)"></span>`:`<span class="sw" style="background:var(--accent)"></span>`;
    return `<div class="cs-item">${sw}<span class="lbl">${r.label.replace('Ключей в ','')}</span><span class="val">${r.vals[lastI]}</span>${dd}</div>`;
  }).join('');
  return `<div class="summary-chart">
    <div class="chart-pane">
      <div class="chart-title">Общая видимость по срезам</div>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="График общей видимости">
        ${grid}
        <path d="${area}" fill="var(--accent-soft)"/>
        <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
        ${dots}
      </svg>
    </div>
    <div class="chart-side">${side}</div>
  </div>`;
}

function nowCellHtml(k){
  const nums = k.pos.filter(p=>typeof p==='number');
  if(!nums.length) return '<span style="color:var(--text-3)">—</span>';
  const last = nums[nums.length-1], first = nums[0];
  const d = first-last;
  const b = band(last);
  const dh = d===0 ? '<span class="nd flat">0</span>'
    : `<span class="nd ${d>0?'up':'down'}" title="Изменение за период">${d>0?'▲':'▼'}${Math.abs(d)}</span>`;
  return `<div class="now-cell" title="Текущая позиция, изменение и тренд за период">
    <span class="np" style="color:var(--${b}-fg)">${last}</span>${dh}${spark(nums.map(n=>-n),62,20,`var(--${b}-heat)`)}
  </div>`;
}

function typDots(typ){
  const st = curV && curV.typStyle;
  if(st==='chips'){
    return Object.entries(typ).map(([k,n])=>
      `<span class="typ-chip" style="background:color-mix(in srgb, ${TYP_META[k].color} 16%, transparent);color:${TYP_META[k].color}" title="${TYP_META[k].name}: ${n} в ТОП-10">${TYP_META[k].short} ${n}</span>`).join('');
  }
  if(st==='stack'){
    const total = Object.values(typ).reduce((a,b)=>a+b,0);
    const tip = Object.entries(typ).map(([k,n])=>`${TYP_META[k].name}: ${n}`).join(', ');
    return `<span class="typ-stack" title="${tip}">${Object.entries(typ).map(([k])=>
      `<span class="ts-dot" style="background:${TYP_META[k].color}"></span>`).join('')}<span class="ts-n">${total}</span></span>`;
  }
  return Object.entries(typ).map(([k,n])=>
    `<span class="typ-dot" style="background:${TYP_META[k].color}" title="${TYP_META[k].name}: ${n} в ТОП-10">${n}</span>`
  ).join('');
}
function serpIcons(serp){
  const map = {ads:{t:'Ad',lbl:'Реклама',tip:'Реклама в выдаче'},vid:{t:'▶',lbl:'Видео',tip:'Видео в выдаче'},map:{t:'⌖',lbl:'Карты',tip:'Карты в выдаче'}};
  if(!serp.length) return '<span style="color:var(--text-3)">—</span>';
  if(curV && curV.serpStyle==='chips')
    return serp.map(s=>`<span class="serp-chip" title="${map[s].tip}">${map[s].lbl}</span>`).join('');
  return serp.map(s=>`<span class="serp-ico" title="${map[s].tip}">${map[s].t}</span>`).join('');
}

function cellHtml(k, i, gi, ki){
  const p = k.pos[i];
  if(p==null) return `<span class="cell none" title="Не в ТОП-100">—</span>`;
  if(p==='na') return `<span class="cell na" title="Позиция не снята">н/д</span>`;
  const b = band(p);
  const d = posDelta(k.pos,i);
  const dh = d ? `<span class="d ${d>0?'up':'down'}">${d>0?'+':''}${d}</span>` : '';
  /* маркеры среза — рядом внизу ячейки, не наезжая друг на друга и на дельту */
  const marks = [];
  if((k.swap||[]).includes(i)) marks.push(`<span class="swap" data-swap="${gi}:${ki}:${i}" title="Сменилась релевантная страница — подробнее">⇅</span>`);
  if((k.adsAt||[]).includes(i)) marks.push(`<span class="admark" title="Реклама в выдаче · ${DATES[i].d}">${I.gads}</span>`);
  const mk = marks.length ? `<span class="marks">${marks.join('')}</span>` : '';
  return `<button class="cell ${b}" data-serp="${gi}:${ki}:${i}" title="${DATES[i].d}: позиция ${p}${d?` (${d>0?'+':''}${d})`:''} · открыть ТОП выдачи${(k.swap||[]).includes(i)?' · сменилась релевантная страница':''}">${mk}${p}${dh}</button>`;
}

function renderWorksheet(v){
  const nCols = (v.nowCol?5:4)+VIS.size;
  const dateHead = DATES.map((d,i)=> !VIS.has(i)?'':`<th class="date ${i===LASTV?'last':''}"><span class="d">${d.d}</span><span class="dw">${d.w}</span>${d.t?`<span class="dtm">${d.t}</span>`:''}</th>`).join('');
  const theadHtml = `<thead><tr>
      <th class="kw">Ключ</th><th title="Типизация сайтов в ТОП-10">Топ 10</th>
      <th title="Элементы выдачи">SERP</th><th class="freq-h" title="Частотность ${WS_MONTH} с динамикой к ${WS_PREV}"><span class="fh-l">Частотность</span>${ENGINE==='ya'?`<span class="ws-seg" role="group" aria-label="Вид частотности"><button data-m="base" class="${WS_MODE==='base'?'active':''}" title="Базовая частотность">базовая</button><button data-m="exact" class="${WS_MODE==='exact'?'active':''}" title="Точная частотность (оператор «!»)">!точная</button></span>`:''}</th>
      ${v.nowCol?'<th class="now" title="Текущая позиция, изменение за период, тренд">Сейчас · Δ</th>':''}
      ${dateHead}
    </tr></thead>`;

  const groupBlock = (g, cgi, si) => {
    const grow = `<tr class="group-gap" data-super="${si}" aria-hidden="true"><td colspan="${nCols}"></td></tr>
      <tr class="group-row" data-group="${cgi}" data-super="${si}"><td colspan="${nCols}">
      <div class="group-head">
        <span class="chev">${I.chev}</span>
        <span class="gname">${esc(g.name)}</span>
        <a class="gurl" href="#" onclick="return false" title="Целевая страница группы">${I.link}<span class="gurl-t">${g.url}</span></a>
        <button class="gact gedit" title="Редактировать URL группы">✎</button>
      </div><span class="gcount gcount-abs"><span class="gcal" title="Группа добавлена в проект: ${g.added||'—'}">${I.cal}</span>${g.keys.length} ключ${g.keys.length>4?'ей':'а'}</span></td></tr>`;
    const rows = g.keys.map((k,ki)=>{
      const cells = DATES.map((_,i)=> !VIS.has(i)?'':`<td class="pos ${i===LASTV?'last':''}">${cellHtml(k,i,cgi,ki)}</td>`).join('');
      const rel = k.relUrl ? (()=>{
        /* сайт в топе несколькими URL: чип-выпадашка рядом с релевантным URL, позиции — последний срез */
        const urls = ourUrlsFor(k, {mi:LASTV, seed:LASTV});
        const chip = urls.length>1 ? `<button class="ku-btn" data-ku="${cgi}:${ki}" title="Сайт найден по ${urls.length} URL — показать все с актуальными позициями">${urls.length} URL <span class="car">▾</span></button>` : '';
        return `<span class="rel-wrap"><a class="rel-url" href="#" onclick="return false" title="Релевантная страница отличается от целевой URL группы (${g.url})">≠ ${k.relUrl}</a>${chip}</span>`;
      })() : '';
      const cats = keyCats(k).join(' ');
      return `<tr class="kw-row" data-parent="${cgi}" data-super="${si}" data-key="${cgi}:${ki}" data-cats="${cats}">
        <td class="kw"><div class="kw-cell" data-kw="${esc(k.kw)}"><a class="eng ya" title="Открыть ключ в Яндексе" href="https://yandex.ru/search/?text=${encodeURIComponent(k.kw)}" target="_blank" rel="noopener">${I.ya}</a><span class="txt" title="Скопировать ключ">${esc(k.kw)}</span><button class="kw-copy" title="Скопировать ключ">${I.copy}</button></div>${rel}</td>
        <td class="typ">${typDots(k.typ)}</td>
        <td class="serp">${serpIcons(k.serp)}</td>
        ${(()=>{ /* показывается один вид частотности — выбирается переключателем в шапке */
          const ex = WS_MODE==='exact', wv = ex?k.wse:k.ws, wd = ex?k.wsed:k.wsd;
          const tip = ex?`Точная частотность («!») ${WS_MONTH}: ${wv.toLocaleString('ru-RU')}`:`Базовая частотность ${WS_MONTH}: ${wv.toLocaleString('ru-RU')}`;
          const dh2 = wd?`<span class="freq-d ${wd>0?'up':'down'}" title="Изменение к ${WS_PREV}: ${wd>0?'+':'−'}${Math.abs(wd).toLocaleString('ru-RU')}">${wd>0?'+':'−'}${fmtWs(Math.abs(wd))}</span>`:'';
          return `<td class="freq"><span class="freq-b" title="${tip}">${ex?'<b class="ex">!</b>':''}${fmtWs(wv)}</span>${dh2}</td>`;
        })()}
        ${v.nowCol?`<td class="now">${nowCellHtml(k)}</td>`:''}
        ${cells}</tr>`;
    }).join('');
    return grow+rows;
  };

  let gi = -1;
  if(v.modules){
    /* Zoho-стиль: супергруппа = отдельный модуль-карточка со своей таблицей */
    return WORKSHEET.map((sg,si)=>{
      const totalKeys = sg.groups.reduce((n,g)=>n+g.keys.length,0);
      const body = sg.groups.map(g=>{ gi++; return groupBlock(g,gi,si); }).join('');
      return `<section class="module">
        <div class="module-head" data-sid="${si}">
          <span class="chev">${I.chev}</span>
          <span class="sname">${esc(sg.name)}</span>
          ${sg.reg?`<span class="flag-ico" title="Регион: ${sg.reg.name}">${I.flags[sg.reg.f]}</span>`:''}
          <span class="scount">${sg.groups.length} групп${sg.groups.length===1?'а':'ы'} · ${totalKeys} ключей</span>
          <span class="gspacer"></span>
          <button class="gact" title="Снять позиции супергруппы">${I.play}</button>
          <button class="gact" title="Настройки супергруппы">⋯</button>
        </div>
        <div class="worksheet"><div class="table-wrap"><table class="grid">${theadHtml}<tbody>${body}</tbody></table></div></div>
      </section>`;
    }).join('');
  }
  const groups = WORKSHEET.map((sg,si)=>{
    const totalKeys = sg.groups.reduce((n,g)=>n+g.keys.length,0);
    const superRow = `<tr class="group-gap big" aria-hidden="true"><td colspan="${nCols}"></td></tr>
      <tr class="super-row" data-sid="${si}"><td colspan="${nCols}">
      <div class="super-head">
        <span class="chev">${I.chev}</span>
        <span class="sname">${esc(sg.name)}</span>
        ${sg.reg?`<span class="flag-ico" title="Регион: ${sg.reg.name}">${I.flags[sg.reg.f]}</span>`:''}
        <span class="scount">${sg.groups.length} групп${sg.groups.length===1?'а':'ы'} · ${totalKeys} ключей</span>
      </div></td></tr>`;
    const groupsHtml = sg.groups.map(g=>{ gi++; return groupBlock(g,gi,si); }).join('');
    return superRow+groupsHtml;
  }).join('');
  return `<div class="worksheet"><div class="table-wrap"><table class="grid">${theadHtml}
    <tbody class="sum-body">${renderSummaryRows(v.nowCol?5:4)}</tbody>
    <tbody>${groups}</tbody></table></div></div>`;
}

/* сводка как часть общей сетки: label занимает колонки ключа, даты совпадают с матрицей.
   Режимы отображения: абсолютные значения или проценты (переключатель у «Общей видимости») */
function renderSummaryRows(labelSpan){
  const rows = SUMMARY.map(r=>{
    const cells = DATES.map((_,i)=>{
      if(!VIS.has(i)) return '';
      const j = prevVis(i);
      const dfA = delta(r.vals,i);
      const dhA = j>=0&&dfA!==0 ? `<span class="sum-delta d-abs ${dfA>0?'up':'down'}">${dfA>0?'▲':'▼'}${Math.abs(dfA)}</span>` : '';
      const dfP = j>=0 ? r.pct[i]-r.pct[j] : 0;
      const dhP = j>=0&&dfP!==0 ? `<span class="sum-delta d-pct ${dfP>0?'up':'down'}">${dfP>0?'▲':'▼'}${Math.abs(dfP)}</span>` : '';
      return `<td class="sum ${i===LASTV?'lastcol':''}"><span class="num">${r.vals[i]}</span><span class="pct">${r.pct[i]} %</span>${dhA}${dhP}</td>`;
    }).join('');
    const sw = r.band?`<span class="sw" style="background:var(--${r.band}-heat)"></span>`:'';
    const seg = r.hero ? `<span class="sum-mode-seg" title="Вид сводки: абсолютные значения / проценты"><button class="sm-mode active" data-m="abs">123</button><button class="sm-mode" data-m="pct">%</button></span>` : '';
    return `<tr class="sum-row ${r.hero?'hero':''}"><td class="sum-label" colspan="${labelSpan}">${sw}${r.label}${seg}</td>${cells}</tr>`;
  }).join('');
  const totals = DATES.map((_,i)=> !VIS.has(i)?'':`<td class="sum ${i===LASTV?'lastcol':''}"><span class="num total">${TOTAL_KEYS[i]}</span></td>`).join('');
  return rows + `<tr class="sum-row total"><td class="sum-label" colspan="${labelSpan}">Всего ключей</td>${totals}</tr>`;
}

function renderLegend(){
  const bands = [['t3','ТОП 1–3'],['t10','4–10'],['t20','11–20'],['t50','21–50'],['t100','51–100']]
    .map(([b,l])=>`<span class="lg-chip"><span class="sw" style="background:var(--${b}-bg);border:1px solid var(--${b}-heat)"></span>${l}</span>`).join('');
  const typs = Object.values(TYP_META).map(t=>`<span class="lg-chip"><span class="dotsw" style="background:${t.color}"></span>${t.name}</span>`).join('');
  return `<div class="legend">
    <span class="lg-group"><span class="lg-label">Позиции</span>${bands}<span class="lg-chip" style="color:var(--text-3)">— вне ТОП-100</span><span class="lg-chip"><span class="swapsw">⇅</span>смена релевантной страницы</span></span>
    <span class="lg-group"><span class="lg-label">Типизация</span>${typs}</span>
  </div>`;
}

function renderDashboard(v){
  curV = v;
  VIS = visibleIdx(); LASTV = Math.max(...VIS);
  const hlSwatches = arr => arr.map((t,i)=> t==null?null:`<span class="hsw" style="background:var(--${['t3','t10','t20','t50'][i]}-heat)"></span>–${t}`).filter(Boolean).join(', '); /* тире перед числом: цвет ДО этой позиции */
  /* сводка живёт внутри общей колоночной сетки матрицы (renderWorksheet) — даты всегда выровнены.
     Легенды нет: пороги подсветки показаны в селекте «Подсветка», типизация и «⇅» — тултипами */
  const contentRaw = renderWorksheet(v);
  let tgi = -1;
  const tocListHtml = WORKSHEET.map(sg =>
    `<div class="toc-super">${esc(sg.name)}</div>` +
    sg.groups.map(g=>{ tgi++; return `<button class="toc-item" data-goto="${tgi}"><span>${esc(g.name)}</span><span class="tc">${g.keys.length}</span></button>`; }).join('')
  ).join('');
  const contentHtml = v.detail

/* ================= SERP MODAL ================= */
const serpModal = document.getElementById('serpModal');
const smBox = document.getElementById('smBox');
const drawerBack = document.getElementById('drawerBack');
let serpState = null; /* {gi, ki, dates:[индексы выбранных срезов]} */

/* наша позиция для колонки модалки: из матрицы (текущий период) или синтетическая (архив) */
function modalPos(k, md){
  if(md.mi!=null) return k.pos[md.mi];
  const base = k.pos.find(p=>typeof p==='number');
  if(base==null) return null;
  return Math.max(1, base + ((md.seed*3)%7) - 3);
}
/* выдача для конкретного среза: детерминированная перестановка + наш сайт на своей позиции */
/* все URL нашего сайта по ключу в этом срезе с их актуальными позициями:
   первый — лучший (он же в матрице), остальные могут быть глубже, в т.ч. за пределами топа */
function ourUrlsFor(k, md){
  const p = modalPos(k, md);
  if(typeof p!=='number') return [];
  const our = SERP_TOP.find(r=>r.our);
  const urls = [{path:our.path, title:our.title, pos:p}];
  if(k.relUrl) urls.push({path:k.relUrl, title:PAGE_TITLES[k.relUrl]||'Релевантная страница', pos:Math.min(99, p + 9 + (md.seed%6))});
  if(md.seed % 3 === 1){
    const used = urls.map(u=>u.path);
    const extra = Object.keys(PAGE_TITLES).find(pt=>!used.includes(pt) && pt!=='/');
    if(extra) urls.push({path:extra, title:PAGE_TITLES[extra], pos:Math.min(99, p + 35 + (md.seed%15))});
  }
  return urls;
}
function serpForDate(k, md){
  const base = [...SERP_TOP.filter(r=>!r.our), ...SERP_TOP2].map(r=>({...r}));
  for(let s=0;s<md.seed;s++){ const i=(s*3)%(base.length-1); const t=base[i]; base[i]=base[i+1]; base[i+1]=t; }
  const our = SERP_TOP.find(r=>r.our);
  const ours = ourUrlsFor(k, md);
  const p = modalPos(k, md);
  /* наша позиция 11–20 — показываем ТОП-20, иначе ТОП-10 */
  const N = (typeof p==='number' && p>10 && p<=20) ? 20 : 10;
  const list = base.slice(0,N);
  /* в выдачу встают только наши URL, реально попавшие в показанный топ */
  ours.filter(u=>u.pos<=N).sort((a,b)=>a.pos-b.pos).forEach(u=>{
    list.splice(u.pos-1, 0, {...our, path:u.path, title:u.title});
  });
  return {list: list.slice(0,N).map((r,i)=>({...r, pos:i+1})), ours};
}

/* разметка топов: категория сайта, назначенная правым кликом по позиции (домен → тип) */
const DOM_TYP = {};
function serpColRows(list){
  return list.map(r0=>{
    const r = DOM_TYP[r0.dom] ? {...r0, typ:DOM_TYP[r0.dom]} : r0;
    return `
    <div class="serp-row ${r.our?'our':''}" data-dom="${r.dom}" data-typ="${r.typ}">
      <span class="serp-pos" style="background:${TYP_META[r.typ].color}" title="${TYP_META[r.typ].name} · правый клик — изменить категорию">${r.pos}</span>
      <div class="serp-body">
        <div class="serp-title"><span class="fav" style="background:hsl(${hashStr(r.dom)%360} 42% 46%)"><i>${r.dom[0].toUpperCase()}</i><img src="https://www.google.com/s2/favicons?domain=${r.dom}&amp;sz=32" alt="" loading="lazy" onload="this.classList.add('ok')"></span>${esc(r.title)}</div>
        <div class="serp-url"><span class="su-text"><b>${r.dom}</b>${r.path}</span></div>
      </div>
    </div>`;
  }).join('');
}

/* доступные в модалке срезы: диапазон + частота (та же логика, что у периода страницы) */
function sampledModalDates(){
  const r = serpState.range;
  let list = MODAL_DATES.filter(md=> md.iso>=r.from && md.iso<=r.to);
  const s = serpState.sampling||'all';
  if(s!=='all'){
    const keyFn = s==='month' ? md=>md.iso.slice(0,7)
      : s==='2week' ? md=>isoWeekKey(md.iso,2)
      : s==='week' ? md=>isoWeekKey(md.iso,1)
      : md=>md.iso;
    const seen = new Set();
    list = list.filter(md=>{ const k2=keyFn(md); if(seen.has(k2)) return false; seen.add(k2); return true; });
  }
  return list;
}

function renderSerpModal(){
  const {gi,ki,dates,range} = serpState;
  const k = GROUPS[gi].keys[ki];
  /* «Последние N»: N последних доступных срезов (с учётом периода и частоты) одним кликом */
  const lastNIds = n => sampledModalDates().slice(-n).map(md=>md.id);
  const isLastN = n => { const ids = lastNIds(n); return ids.length===dates.length && ids.every(id=>dates.includes(id)); };
  const cols = MODAL_DATES.filter(md=>dates.includes(md.id)).map(md=>{
    const p = modalPos(k, md); const b = band(p);
    /* реклама в этом срезе: для срезов матрицы — из данных ключа, для архивных — детерминированно */
    const hasAds = md.mi!=null ? (k.adsAt||[]).includes(md.mi) : (hashStr('ads:'+k.kw+':'+md.id)%100) < 40;
    const adsN = 2 + (hashStr('adsn:'+k.kw+':'+md.id) % 3);
    /* полоса рекламы есть во всех колонках (одинаковая высота — строки не разъезжаются) */
    const adsStrip = hasAds
      ? `<div class="sm-ads" title="Рекламная выдача показывалась над органическими результатами"><span class="admark">${I.gads}</span>Реклама · ${adsN} объявлени${adsN===2?'я':adsN>4?'й':'я'} над результатами</div>`
      : `<div class="sm-ads none">Без рекламы в выдаче</div>`;
    return `<div class="sm-col">
      <div class="sm-col-h"><b>${md.d}</b>${md.t?`<span class="t">${md.t}</span>`:''}<span class="dw2">${md.w}</span>${md.arch?'<span class="t">архив</span>':''}
        <span class="ourpos ${b||'none'}" title="Наша позиция в этом срезе">${p==null?'—':(p==='na'?'н/д':p)}</span></div>
      ${adsStrip}
      <div class="sm-list">${serpColRows(serpForDate(k,md).list)}</div>
    </div>`;
  }).join('');
  smBox.innerHTML = `
    <div class="sm-head">
      <div class="sm-title">
        <span class="eng ya" title="Яндекс">${I.ya}</span>
        <h3>${esc(k.kw)}</h3>
        <button class="close" id="smClose" aria-label="Закрыть">✕</button>
      </div>
      <div class="sm-range">
        <span>Период:</span>
        <span class="dd-wrap" id="smCalWrap">
          <button class="period">${I.cal} ${fmtRu(range.from)} — ${fmtRu(range.to)}</button>
          <div class="dd-panel cal-pop" id="smCalPop"></div>
        </span>
        <span class="sm-sep"></span>
        ${[5,10].map(n=>`<button class="lastn ${isLastN(n)?'active':''}" data-n="${n}" title="Показать ${n} последних срезов">Последние ${n}</button>`).join('')}
      </div>
    </div>
    <div class="sm-cols">${cols}</div>`;
  document.getElementById('smClose').onclick = closeSerp;
  smBox.querySelectorAll('.lastn').forEach(b=> b.onclick = ()=>{
    serpState.dates = lastNIds(+b.dataset.n);
    renderSerpModal();
  });
  /* разметка топов: правый клик по позиции — меню категорий сайта */
  smBox.querySelectorAll('.serp-row[data-dom]').forEach(row=> row.oncontextmenu = e=>{
    e.preventDefault();
    showTypMenu(row.dataset.dom, row.dataset.typ, e.clientX, e.clientY);
  });
  /* кросс-подсветка: hover по сайту подсвечивает этот же домен в остальных колонках */
  smBox.querySelectorAll('.serp-row[data-dom]').forEach(row=>{
    row.onmouseenter = ()=> smBox.querySelectorAll(`.serp-row[data-dom="${row.dataset.dom}"]`).forEach(x=>x.classList.add('hl'));
    row.onmouseleave = ()=> smBox.querySelectorAll('.serp-row.hl').forEach(x=>x.classList.remove('hl'));
  });
  /* календарь диапазона — тот же компонент, что у периода страницы */
  const smCalWrap = document.getElementById('smCalWrap');

/* ================= КАЛЕНДАРЬ ПЕРИОДА ================= */
let CAL = null; /* target: 'page' — период страницы, 'modal' — диапазон в SERP-модалке */
function openCalFor(target, from, to, sampling){
  CAL = { target, y:+from.slice(0,4), m:+from.slice(5,7)-1,
          from, to, sampling, custom:false, pick:false };
  buildCal();
}
function openCal(){ openCalFor('page', PERIOD.from, PERIOD.to, SAMPLING); }
/* календарь — под кнопкой диапазона, правым краем к ней; прижим к краям окна */
function placeCalPop(wrap){
  const pop = wrap.querySelector('.cal-pop'), btn = wrap.querySelector('.period');
  if(!pop || !btn) return;
  const r = btn.getBoundingClientRect();
  const W = Math.min(680, innerWidth*.94);
  pop.style.left = Math.max(8, Math.min(r.right - W, innerWidth - W - 8)) + 'px';
  let top = r.bottom + 8;
  const H = pop.offsetHeight || 380;
  if(top + H > innerHeight - 8) top = Math.max(8, r.top - H - 8); /* снизу не влезает — вверх */
  pop.style.top = top + 'px';
}
function calMonthHtml(y,m){
  const MN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const startDow = (new Date(y,m,1).getDay()+6)%7;
  const dim = new Date(y,m+1,0).getDate();
  let cells='';
  for(let i=0;i<startDow;i++) cells += '<span class="cal-day other"></span>';
  for(let d=1;d<=dim;d++){
    const iso = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const has = MODAL_DATES.some(md=>md.iso===iso);
    const inr = iso>=CAL.from && iso<=CAL.to;
    const edge = iso===CAL.from || iso===CAL.to;
    cells += `<button class="cal-day ${inr?'inr':''} ${edge?'edge':''} ${has?'has':''}" data-iso="${iso}">${d}</button>`;
  }
  return `<div class="cal-month"><div class="cal-mt">${MN[m]} ${y}</div>
    <div class="cal-wd">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(w=>`<span>${w}</span>`).join('')}</div>
    <div class="cal-grid">${cells}</div></div>`;
}
function buildCal(){
  const pop = document.getElementById(CAL && CAL.target==='modal' ? 'smCalPop' : 'calPop');
  if(!pop || !CAL) return;
  const months = [0,1,2].map(off=>{
    let y=CAL.y, m=CAL.m+off; y+=Math.floor(m/12); m=((m%12)+12)%12;
    return calMonthHtml(y,m);
  }).join('');
  pop.innerHTML = `
    <div class="cal-months"><button class="cal-nav" data-nav="-1">‹</button>${months}<button class="cal-nav" data-nav="1">›</button></div>
    <div class="cal-foot">
      ${[['all','Все'],['day','1/день'],['week','1/неделю'],['2week','2/неделю'],['month','1/месяц']]
        .map(([v2,l])=>`<label class="cal-radio"><input type="radio" name="samp" value="${v2}" ${CAL.sampling===v2?'checked':''}>${l}</label>`).join('')}
      <label class="cal-toggle"><input type="checkbox" id="calCustom" ${CAL.custom?'checked':''}><span class="tgl"></span>Свой выбор дат</label>
      <button class="btn primary" id="calApply">Применить</button>
    </div>`;
  pop.querySelectorAll('.cal-nav').forEach(b=> b.onclick = e=>{ e.stopPropagation(); CAL.m += +b.dataset.nav; buildCal(); });
  pop.querySelectorAll('.cal-day:not(.other)').forEach(d=> d.onclick = e=>{
    e.stopPropagation();
    const iso = d.dataset.iso;
    if(!CAL.pick){ CAL.from = iso; CAL.to = iso; CAL.pick = true; }
    else { if(iso<CAL.from){ CAL.to = CAL.from; CAL.from = iso; } else CAL.to = iso; CAL.pick = false; }
    CAL.custom = true;
    buildCal();
  });
  pop.querySelectorAll('input[name="samp"]').forEach(r=> r.onchange = ()=>{ CAL.sampling = r.value; });
  const cc = document.getElementById('calCustom');
  if(cc) cc.onchange = ()=>{ CAL.custom = cc.checked; };
  document.getElementById('calApply').onclick = e=>{
    e.stopPropagation();
    if(CAL.target==='modal'){
      serpState.range = {from:CAL.from, to:CAL.to};
      serpState.sampling = CAL.sampling;
      /* чипов дат больше нет: диапазон+частота показывают все свои срезы */
      serpState.dates = sampledModalDates().map(md=>md.id);
      renderSerpModal();
    } else {
      PERIOD = {from:CAL.from, to:CAL.to};
      SAMPLING = CAL.sampling;
      show(cur);
    }
  };
}

/* ================= АДАПТИВНОСТЬ СРЕЗОВ ================= */
/* ширина колонки среза от доступного места: полная → компактная (дельты всегда читаемы)
   → гориз. скролл с компактными ячейками и фикс. левой частью */
function updateScrollShadows(w){
  w.classList.toggle('sc-left', w.scrollLeft > 2);
  w.classList.toggle('sc-right', w.scrollLeft < w.scrollWidth - w.clientWidth - 2);
}
function applySliceDensity(){
  /* только для страницы позиций: на главной своя CSS-адаптивность колонок,
     иначе resize ломает вёрстку (sl-mid/kw-clamp/скролл вправо не для home-grid) */
  if(PAGE !== 'mon'){
    app.classList.remove('sl-mid');
    app.querySelectorAll('.table-wrap').forEach(w=>w.classList.remove('h-scroll','kw-clamp'));
    if(HSB) HSB.classList.remove('on');
    return;
  }
  const wraps = [...app.querySelectorAll('.table-wrap')];
  if(!wraps.length) return;
  const FIXED = 492 + (curV && curV.nowCol ? 150 : 0); /* ключ+тип+serp+частотность с дельтой(+сейчас) */
  /* сброс ДО измерений: kw-clamp/h-scroll зажимают колонку ключа и искажают ширину таблицы */
  app.classList.remove('sl-mid');
  wraps.forEach(w=>w.classList.remove('h-scroll','kw-clamp'));
  const per = (wraps[0].clientWidth - FIXED) / (VIS.size || 1);
  if(per < 62) app.classList.add('sl-mid'); /* тесно: компактные колонки; не влезли — дальше сработает скролл */
  /* чтение scrollWidth после смены классов форсирует пересчёт лэйаута — rAF не нужен
     (и не срабатывает в фоновых вкладках) */
  wraps.forEach(w=>{
    let over = w.scrollWidth > w.clientWidth + 1;
    if(over){ /* шаг 1: зажать колонку ключа — часто этого достаточно */
      w.classList.add('kw-clamp');
      over = w.scrollWidth > w.clientWidth + 1;
    }
    w.classList.toggle('h-scroll', over); /* шаг 2: не помогло — скролл-режим */
    if(over){
      if(!w.__sl){ w.__sl = true; w.addEventListener('scroll', ()=>{ updateScrollShadows(w); if(HSB && HSB.__w===w) HSB.scrollLeft = w.scrollLeft; }, {passive:true}); }
      w.scrollLeft = w.scrollWidth; /* старт: последние срезы на виду */
      updateScrollShadows(w);
    }
  });
  /* фактическая высота thead (меняется в плотных режимах и при времени в датах) */
  const theadEl = app.querySelector('.grid thead');
  if(theadEl) app.style.setProperty('--thead-h', Math.round(theadEl.getBoundingClientRect().height)+'px');
  updateHsb();
}

/* плавающий горизонтальный скроллбар: прикреплён к низу окна, пока таблица на экране.
   Родной скроллбар .table-wrap скрыт — иначе он оказывается под всеми строками, в самом низу */
let HSB = null;
function updateHsb(){
  const w = app.querySelector('.table-wrap.h-scroll');
  if(!HSB){
    HSB = document.createElement('div');
    HSB.className = 'hsb';
    HSB.appendChild(document.createElement('div'));
    HSB.addEventListener('scroll', ()=>{ if(HSB.__w) HSB.__w.scrollLeft = HSB.scrollLeft; }, {passive:true});
    document.body.appendChild(HSB);
  }
  HSB.__w = w;
  if(!w || w.scrollWidth <= w.clientWidth + 1){ HSB.classList.remove('on'); return; }
  const r = w.getBoundingClientRect();
  const visible = r.top < innerHeight - 60 && r.bottom > 120;
  HSB.classList.toggle('on', visible);
  if(!visible) return;
  HSB.style.left = r.left + 'px';
  HSB.style.width = r.width + 'px';
  /* когда низ таблицы поднимается в окно — скроллбар «приземляется» на её нижнюю кромку */
  HSB.style.bottom = Math.max(0, innerHeight - r.bottom) + 'px';
  HSB.firstChild.style.width = w.scrollWidth + 'px';
  HSB.scrollLeft = w.scrollLeft;
}
window.addEventListener('scroll', updateHsb, {passive:true});
let __slT;
window.addEventListener('resize', ()=>{ clearTimeout(__slT); __slT = setTimeout(applySliceDensity, 120); });

      btn.__t = setTimeout(()=>{ btn.classList.remove('copied'); btn.innerHTML = I.copy; }, 1200);
    };
    cell.querySelector('.txt').onclick = doCopy;
    btn.onclick = doCopy;
  });
  /* «Позиции конкурента» — модалка с адресом сайта */
  const cb = app.querySelector('#compBtn');
  if(cb) cb.onclick = openComp;
  /* переключатель вида частотности в шапке колонки */
  app.querySelectorAll('.ws-seg button').forEach(b=> b.onclick = e=>{
    e.stopPropagation();
    if(WS_MODE!==b.dataset.m){ WS_MODE = b.dataset.m; show(cur); }
  });
  /* чип «N URL» у релевантного URL: попап со всеми URL и актуальными позициями */
  app.querySelectorAll('.ku-btn').forEach(b=> b.onclick = e=>{
    e.stopPropagation();
    const [gi,ki] = b.dataset.ku.split(':').map(Number);
    const was = kuPop && kuPop.classList.contains('open');
    closeKuPop();
    if(!was || kuPop.__src!==b){ showKuPop(gi, ki, b.getBoundingClientRect()); kuPop.__src = b; }
  });
  /* иконка ⇅ смены релевантной страницы: попап было/стало */
  app.querySelectorAll('.swap[data-swap]').forEach(s=> s.onclick = e=>{
    e.stopPropagation();
    const [gi,ki,di] = s.dataset.swap.split(':').map(Number);
    showSwapPop(gi, ki, di, s.getBoundingClientRect());
  });
  /* панель деталей: выбор ключа кликом по строке */
  if(v.detail){
    app.querySelectorAll('.kw-row').forEach(r=>{
      r.style.cursor='pointer';
      r.onclick = e=>{
        if(e.target.closest('.cell')||e.target.closest('.rel-url')) return;
        const [g,k] = r.dataset.key.split(':').map(Number);
        renderDetail(g,k,DATES.length-1);
      };
    });
    renderDetail(0,0,DATES.length-1);
  }
  closeSerp();
}

goHome(); /* вход — главная (список проектов); клик по мониторингу открывает страницу позиций */
</script>
</body>
</html>
