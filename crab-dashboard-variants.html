.ourpos.t20{background:var(--t20-bg);color:var(--t20-fg)}
.ourpos.t50{background:var(--t50-bg);color:var(--t50-fg)}
.ourpos.t100{background:var(--t100-bg);color:var(--t100-fg)}
.ourpos.none{background:var(--bg);color:var(--text-3)}
/* полоса «реклама в выдаче» — перед результатами; есть во всех колонках (фиксированная
   высота — строки соседних дат не разъезжаются), без рекламы — нейтральная заглушка */
.sm-ads{display:flex;align-items:center;gap:7px;flex:none;height:30px;padding:0 14px;font-size:10.5px;font-weight:650;color:var(--t20-fg);background:var(--t20-bg);border-bottom:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sm-ads.none{background:transparent;color:var(--text-3);font-weight:500}
.sm-ads .admark{display:inline-flex;width:11px;height:11px;flex:none}
/* контекстное меню разметки топов (правый клик по позиции) */
#typMenu{position:fixed;z-index:120;min-width:215px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);padding:6px;display:none}
#typMenu.open{display:block}
.tm-title{font-size:10px;color:var(--text-3);padding:5px 9px 6px;font-weight:600}
.tm-title b{color:var(--text-2)}
.tm-item{display:flex;align-items:center;gap:8px;width:100%;padding:7px 9px;border-radius:6px;font-size:12px;font-weight:550;color:var(--text-2);text-align:left}
.tm-item:hover{background:var(--bg);color:var(--text)}
.tm-item.active{font-weight:700;color:var(--text)}
.tm-item.active::after{content:"✓";margin-left:auto;color:var(--accent);font-size:11px}
.tm-dot{width:9px;height:9px;border-radius:50%;flex:none}
.tm-cfg{color:var(--text-3);font-size:11.5px}
.sm-list{min-height:0} /* скроллит общий контейнер .sm-cols */
/* фиксированная высота строки: позиции не «едут» при сравнении нескольких дат */
.sm-list .serp-row{height:74px;overflow:hidden}
.sm-list .serp-row{padding:8px 14px}
.sm-list .serp-row.our{padding-left:11px}

/* ============ СТОИМОСТЬ МОНИТОРИНГОВ (только админы) ============ */
/* тулбар: группировка 2 уровня + фильтры */
.c-grp{display:inline-flex;align-items:center;gap:6px;padding-right:12px;border-right:1px solid var(--border)}
.c-grp-l{font-size:10px;font-weight:750;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);margin-right:2px}
.c-grp-n{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:var(--text-2);color:var(--surface);font-size:9px;font-weight:800;margin-right:2px}
.c-grp-n.n2{background:var(--border-strong);color:var(--text-2)}
.c-arrow{color:var(--text-3);font-size:14px}
.c-reset{font-size:12px;font-weight:650;color:var(--accent);padding:4px 6px;border-radius:6px}
.c-reset:hover{background:var(--accent-soft)}
.dd-item.c-chk{font-weight:550}
.dd-item.c-chk .hsel-box{flex:none;margin-right:3px}
.dd-item.c-chk .c-sub{margin-left:auto;padding-left:14px}
.dd-panel.c-multi{max-height:340px;overflow-y:auto;min-width:220px}
.dd-sep{height:1px;background:var(--border);margin:4px 2px}

/* календарь периода: пресеты слева + два месяца */
.dd-panel.cc-pop{left:auto;right:0;width:620px;max-width:94vw;padding:14px}
.cc-body{display:flex;gap:14px}
.cc-presets{display:flex;flex-direction:column;gap:1px;min-width:150px;padding-right:12px;border-right:1px solid var(--border)}
.cc-months{flex:1;display:flex;gap:14px;align-items:flex-start;min-width:0}
.cal-day:disabled{opacity:.3;pointer-events:none}
.cc-foot{display:flex;align-items:center;gap:10px;border-top:1px solid var(--border);margin-top:12px;padding-top:12px}
.cc-foot .cc-sel{font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums}
.cc-foot .btn{margin-left:auto;padding:7px 16px}

/* таблица: команда/владелец/… → вложенная группа → отдельные сборы */
.cost-grid{table-layout:fixed;min-width:1340px}
.cost-grid thead th{text-align:right;padding:9px 12px}
.cost-grid thead th.c-name{text-align:left;padding-left:16px}
.cost-grid thead th.c-a{text-align:left}
.cost-grid th.c-eng{width:130px}.cost-grid th.c-typ{width:96px}.cost-grid th.c-depth{width:72px}
.cost-grid th.c-parser{width:100px}.cost-grid th.c-owner{width:128px}.cost-grid th.c-n{width:112px}
.cost-grid th.c-req{width:92px}.cost-grid th.c-ppk{width:78px}.cost-grid th.c-share{width:112px}.cost-grid th.c-cost{width:124px}
.c-head > .c-sub{flex:none;margin-left:0}
.c-head > .c-dom{flex:0 10 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.c-mon{flex:0 1 auto}
.c-sort{display:inline-flex;justify-content:flex-end;align-items:center;gap:4px;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit}
.c-sort:hover{color:var(--text)}
.c-sort.on{color:var(--text)}
.c-sort .ar{font-size:8px;color:var(--accent)}
.cost-grid td{padding:0 12px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cost-grid td.c-name{text-align:left}
.cost-grid td.c-a{text-align:left;color:var(--text-2);font-size:12px}
.cost-grid td.c-a .eng{display:inline-flex;vertical-align:-2px;margin-right:5px}
.cost-grid td.c-a .eng svg{width:12px;height:12px}
.c-num{font-weight:600}
.c-z{color:var(--text-3);font-weight:500}
.c-sub{font-size:11px;color:var(--text-3);font-weight:500;margin-left:8px}
.c-head{display:flex;align-items:center;gap:9px;min-width:0}
.c-head .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-head .chev{display:inline-flex;color:var(--text-3);transition:transform .15s;flex:none}
.ct-row:not(.open) .chev{transform:rotate(180deg)}
.c-head .eng{display:inline-flex;flex:none}
.c-head .eng svg{width:13px;height:13px}
.c-tava{display:inline-flex;width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,#3D5AFE,#00B0FF);color:#fff;font-size:10px;font-weight:700;align-items:center;justify-content:center;flex:none}
/* доля от итога — одна шкала */
.c-share{display:inline-flex;align-items:center;gap:8px;justify-content:flex-end;width:100%}
.c-sbar{flex:1;max-width:52px;height:4px;border-radius:2px;background:var(--border);overflow:hidden}
.c-sbar i{display:block;height:100%;background:var(--t3-heat);border-radius:2px}
.c-pct{min-width:42px;text-align:right}
/* 1-й уровень — светлая полоса группы: крупный жирный текст, разделитель сверху */
.cost-grid tr.ct-g1 td{height:46px;background:var(--surface-2);border-top:1px solid var(--border-strong);cursor:pointer}
.cost-grid tr.ct-g1 td.c-name{padding-left:16px;font-size:14.5px;font-weight:750}
.cost-grid tr.ct-g1 .c-num{font-weight:750}
.cost-grid tr.ct-g1:hover td{background:var(--bg)}
.cost-grid tr.ct-gap td{height:8px;padding:0;border:none;background:var(--surface)}
/* 2-й уровень — белая строка с серой кромкой слева */
.cost-grid tr.ct-g2 td{height:40px;background:var(--surface);cursor:pointer}
.cost-grid tr.ct-g2 td:first-child{box-shadow:inset 3px 0 0 var(--border-strong)}
.cost-grid tr.ct-g2 td.c-name{padding-left:36px;font-weight:650;font-size:13.5px}
.cost-grid tr.ct-g2:hover td{background:var(--surface-2)}
/* сборы */
.cost-grid tr.ct-run td{height:34px;font-size:12px}
.cost-grid tr.ct-run td:first-child{box-shadow:inset 3px 0 0 var(--border)}
.cost-grid tr.ct-run:hover td{background:var(--surface-2)}
.cost-grid tr.ct-run td.c-name{padding-left:58px}
.cost-grid tr.ct-run.l1 td.c-name{padding-left:40px}
.c-ts{color:var(--text-3);font-variant-numeric:tabular-nums;flex:none;font-size:11.5px}
.c-mon{display:inline-flex;align-items:center;gap:6px;color:var(--text);font-weight:550;min-width:0}
.c-mon .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-mon:hover .txt{color:var(--accent);text-decoration:underline}
.c-orig{display:block;font-size:10px;color:var(--text-3);line-height:1.15}
.cost-grid tr.ct-run td.c-cost{line-height:1.2}
.cost-grid tr.ct-more td{height:34px;text-align:left;padding-left:58px;background:var(--surface)}
.cost-grid tr.ct-more.l1 td{padding-left:40px}
.ct-more button{font-size:12px;font-weight:650;color:var(--t3-fg)}
.ct-more button:hover{text-decoration:underline}
.cost-grid td.ct-empty{height:120px;text-align:center;color:var(--text-3);font-size:13px}
/* итог */
.cost-grid tfoot td{height:44px;background:var(--surface);border-top:1px solid var(--border-strong);border-bottom:none;font-weight:750}
.cost-grid tfoot td.c-name{padding-left:16px;font-size:13.5px}

/* ============ АССИСТЕНТ: AI-чат в правом сайдбаре ============ */
/* Панель живёт вне #app (переживает перерисовки страниц). ≥900px — «толкает» контент:
   .shell получает padding-right = ширина панели + зазор рамы; таблица пересчитывает плотность срезов.
   <900px — на весь экран поверх. Ширины: 400px / развёрнутая — clamp(400px, 100vw − 624px, 640px). */
:root{--ai-w:400px;--ai-gap:6px}
body.ai-wide{--ai-w:clamp(400px, calc(100vw - 624px), 640px)}
@media (min-width:900px){
  body.ai-open #app .shell{padding-right:calc(var(--ai-w) + var(--ai-gap))}
  body.ai-open #app.chrome-darkframe .main{border-top-right-radius:14px}
}
.ai-panel{position:fixed;top:52px;right:0;bottom:0;width:var(--ai-w);z-index:35;display:flex;flex-direction:column;background:var(--surface);border-radius:14px 0 0 0;overflow:hidden;
  visibility:hidden;opacity:0;transform:translateX(24px);transition:opacity .16s ease,transform .2s ease,visibility 0s linear .2s}
body.ai-open .ai-panel{visibility:visible;opacity:1;transform:none;transition:opacity .16s ease,transform .2s ease}
@media (max-width:899.98px){
  /* размер — по экрану (vw/dvh), а не по layout viewport: если страница шире экрана, fixed-панель иначе растягивается вслед за ней */
  .ai-panel{top:0;left:0;right:auto;bottom:auto;width:100vw;height:100vh;height:100dvh;border-radius:0;z-index:90}
  body.ai-open{overflow:hidden}
  .ai-wide-btn{display:none!important}
  /* касание: кнопки ≥ 40–44px, поле ввода 16px — iOS не зумит страницу при фокусе */
  .ai-head{height:56px;padding-top:env(safe-area-inset-top)}
  .ai-head .ai-ib{width:44px;height:44px}
  .ai-bar .ai-ib,.ai-meta .ai-ib{width:40px;height:40px}
  .ai-model{height:40px}
  .ai-send{width:40px;height:40px}
  .ai-chip .x{width:28px;height:28px}
  .ai-ta{font-size:16px}
  .ai-q{height:36px;border-radius:18px}
  .ai-comp{padding-bottom:calc(10px + env(safe-area-inset-bottom))}
}
/* шапка панели */
.ai-head{display:flex;align-items:center;gap:2px;height:52px;padding:0 8px 0 10px;border-bottom:1px solid var(--border);flex:none} /* заголовок слева (выровнен с лентой), справа: история · новый чат · ширина · закрыть */
.ai-ib{width:32px;height:32px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;color:var(--text-2)}
.ai-ib:hover{background:var(--bg);color:var(--text)}
.ai-ib.on{background:var(--bg);color:var(--text)}
.ai-ib svg{width:16px;height:16px}
.ai-ib:disabled{opacity:.4;cursor:default;background:none}
.ai-ttl{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;padding:0 6px;line-height:1.3}
.ai-ttl b{font-size:13.5px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-ttl span{font-size:11.5px;color:var(--text-2);display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;min-width:0}
.ai-ttl span i{font-style:normal;overflow:hidden;text-overflow:ellipsis}
.ai-ttl .eng svg,.ai-chip .eng svg,.ai-mon .eng svg,.ai-hi .eng svg{width:11px;height:11px;display:block}
/* лента */
.ai-feed{flex:1;min-height:0;overflow-y:auto;padding:16px 16px 12px;display:flex;flex-direction:column;gap:18px;overscroll-behavior:contain}
.ai-feed[hidden],.ai-hist[hidden],.ai-comp[hidden]{display:none}
.ai-msg{min-width:0}
.ai-msg.user{align-self:flex-end;max-width:88%;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.ai-bubble{background:var(--bg);border:1px solid var(--border);border-radius:14px 14px 4px 14px;padding:8px 12px;font-size:13.5px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text)}
.ai-mctx{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px;max-width:100%}
.ai-mctx .ai-chip{background:var(--surface);padding-right:7px}
.ai-mimg{max-width:180px;max-height:120px;border-radius:8px;border:1px solid var(--border);display:block}
.ai-md{font-size:13.5px;line-height:1.55;color:var(--text);overflow-wrap:anywhere}
.ai-md p{margin:0 0 8px}
.ai-md > :last-child{margin-bottom:0}
.ai-md ul{margin:0 0 8px;padding-left:18px}
.ai-md li{margin:3px 0}
.ai-md b{font-weight:700}
.ai-md .ai-h{font-weight:700;margin:12px 0 4px}
.ai-md .ai-proto{font-size:12px;color:var(--text-2);border-left:2px solid var(--border-strong);padding-left:8px}
.ai-md.streaming::after{content:'';display:inline-block;width:7px;height:14px;margin-left:2px;vertical-align:-2px;background:var(--text-2);border-radius:1px;animation:aiblink 1s steps(2,start) infinite}
@keyframes aiblink{to{visibility:hidden}}
.ai-tbl{width:100%;border-collapse:collapse;margin:4px 0 10px;font-size:12.5px;font-variant-numeric:tabular-nums}
.ai-tbl th{font-size:11px;font-weight:600;color:var(--text-2);text-align:left;padding:4px 6px;border-bottom:1px solid var(--border-strong);white-space:nowrap}
.ai-tbl td{padding:4px 6px;border-bottom:1px solid var(--border);vertical-align:middle}
.ai-tbl th.n,.ai-tbl td.n{text-align:right;white-space:nowrap}
.ai-tbl td.w{max-width:0;width:100%}
.ai-tbl tr.our td{background:color-mix(in srgb, var(--accent) 6%, transparent)}
.ai-tbl .dom{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai-tbl .dom b{font-weight:650}
.ai-spark{margin:2px 0 10px;padding:8px 10px 6px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2)}
.ai-spark svg{display:block;width:100%;height:44px}
.ai-spark-l{display:flex;justify-content:space-between;font-size:11px;color:var(--text-2);margin-top:2px}
/* ссылки из ответа в данные: ключ → строка таблицы, позиция → ТОП выдачи, группа, мониторинг */
.ai-kw,.ai-grp,.ai-mon{display:inline-flex;align-items:center;gap:5px;max-width:100%;vertical-align:bottom;padding:0 6px;height:22px;border-radius:6px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font-size:12.5px;text-align:left}
.ai-kw span,.ai-grp span,.ai-mon span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ai-kw svg{width:11px;height:11px;flex:none;color:var(--text-2)}
.ai-kw:hover,.ai-grp:hover,.ai-mon:hover{border-color:var(--text-3);background:var(--surface-2)}
.ai-kw:hover svg{color:var(--accent)}
.ai-pos{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:20px;padding:0 5px;border-radius:5px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--t100-bg);color:var(--t100-fg);vertical-align:baseline}
.ai-pos.t3{background:var(--t3-bg);color:var(--t3-fg)}
.ai-pos.t10{background:var(--t10-bg);color:var(--t10-fg)}
.ai-pos.t20{background:var(--t20-bg);color:var(--t20-fg)}
.ai-pos.t50{background:var(--t50-bg);color:var(--t50-fg)}
button.ai-pos:hover{box-shadow:inset 0 0 0 1.5px currentColor}
.ai-pos.none{background:transparent;border:1px dashed var(--border-strong);color:var(--text-2);font-weight:600}
.ai-d{font-size:11px;font-weight:750;margin-left:4px;font-variant-numeric:tabular-nums}
.ai-d.up{color:var(--up)}.ai-d.down{color:var(--down)}
.ai-isugs{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
/* шаги: что ассистент посмотрел в данных (вызовы функций) */
.ai-steps{margin-bottom:8px;font-size:12px;color:var(--text-2)}
.ai-steps-t{display:inline-flex;align-items:center;gap:6px;padding:3px 7px 3px 4px;margin-left:-4px;border-radius:6px;color:var(--text-2);font-size:12px}
.ai-steps-t:hover{background:var(--bg);color:var(--text)}
.ai-steps-t .chv{display:inline-flex;transition:transform .15s}
.ai-steps-t .chv svg{width:10px;height:10px}
.ai-steps.open .ai-steps-t .chv{transform:rotate(90deg)}
.ai-steps-l{list-style:none;margin:4px 0 0 2px;padding:0 0 0 2px;border-left:2px solid var(--border);display:none}
.ai-steps.open .ai-steps-l,.ai-steps.live .ai-steps-l{display:block}
.ai-steps.live{margin-bottom:10px}
.ai-step{display:flex;align-items:center;gap:7px;padding:2px 0 2px 8px;line-height:1.4}
.ai-step .ic{width:14px;height:14px;flex:none;display:inline-flex;align-items:center;justify-content:center;color:var(--up)}
.ai-step .ic svg{width:12px;height:12px}
.ai-spin{width:12px;height:12px;flex:none;border-radius:50%;border:2px solid var(--border-strong);border-top-color:var(--text-2);animation:aispin .8s linear infinite}
@keyframes aispin{to{transform:rotate(360deg)}}
.ai-state{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-2)}
.ai-stopped{font-size:12px;color:var(--text-2);margin-top:6px}
.ai-err{border:1px solid color-mix(in srgb, var(--down) 35%, var(--border));background:color-mix(in srgb, var(--down) 7%, var(--surface));border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.45;color:var(--text)}
.ai-err b{display:block;color:var(--down);margin-bottom:2px}
.ai-err .ai-err-a{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ai-btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--border-strong);background:var(--surface);font-size:12px;font-weight:650;color:var(--text);white-space:nowrap}
.ai-btn:hover{border-color:var(--text-3)}
.ai-btn svg{width:13px;height:13px}
.ai-btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.ai-btn.pri:hover{background:var(--accent-hover)}
.ai-meta{display:flex;align-items:center;margin:8px 0 0 -6px;color:var(--text-2);font-size:11.5px;min-width:0}
.ai-meta .ai-ib{width:28px;height:28px}
.ai-meta .ai-ib svg{width:14px;height:14px}
.ai-meta .ai-ib.on{color:var(--accent)}
.ai-meta .sp{flex:1}
.ai-meta .mdl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:6px}
/* пустой чат: заголовок по контексту и что видит ассистент (без вопросов-подсказок) */
.ai-empty{margin:auto 0;display:flex;flex-direction:column;gap:12px;padding:4px 0}
.ai-empty .ic{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.ai-empty .ic svg{width:20px;height:20px}
.ai-empty h3{font-size:16px;font-weight:750;line-height:1.3;color:var(--text)}
.ai-empty p{font-size:12.5px;color:var(--text-2);line-height:1.5}
/* поле ввода */
.ai-comp{flex:none;padding:10px 12px;border-top:1px solid var(--border);background:var(--surface)}
.ai-switch{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 10px;margin-bottom:8px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);font-size:12px;line-height:1.4;color:var(--text-2)}
.ai-switch .t{flex:1 1 100%}
.ai-switch b{color:var(--text);font-weight:650}
.ai-banner{padding:9px 11px;margin-bottom:8px;border-radius:10px;font-size:12px;line-height:1.45;background:var(--t20-bg);color:var(--text)}
.ai-banner b{display:block;margin-bottom:1px}
.ai-qs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.ai-q{height:28px;padding:0 11px;border-radius:14px;border:1px solid var(--border);font-size:12px;color:var(--text);background:var(--surface)}
.ai-q:hover{border-color:var(--border-strong);background:var(--surface-2)}
.ai-box{border:1px solid var(--border-strong);border-radius:12px;padding:8px 8px 6px 10px;background:var(--surface);transition:border-color .12s}
.ai-box:focus-within{border-color:var(--text-3)}
.ai-box.off{background:var(--surface-2)}
.ai-pend{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.ai-pend:empty{display:none}
.ai-chip{display:inline-flex;align-items:center;gap:5px;max-width:100%;height:24px;padding:0 2px 0 7px;border-radius:6px;background:var(--bg);border:1px solid var(--border);font-size:12px;color:var(--text)}
.ai-chip .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ai-chip .k{color:var(--text-2)}
.ai-chip .x{width:20px;height:20px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-2);flex:none}
.ai-chip .x svg{width:10px;height:10px}
.ai-chip .x:hover{background:var(--border);color:var(--text)}
.ai-chip img{width:18px;height:18px;object-fit:cover;border-radius:3px;flex:none}
.ai-ta{display:block;width:100%;border:none;outline:none;resize:none;background:transparent;font:inherit;font-size:13.5px;line-height:1.45;color:var(--text);max-height:168px;min-height:40px;padding:2px 0}
.ai-ta::placeholder{color:var(--text-3)}
.ai-ta:disabled{cursor:not-allowed}
.ai-bar{display:flex;align-items:center;gap:2px;margin-top:4px}
.ai-bar .ai-ib{width:28px;height:28px}
.ai-model-w{position:relative;min-width:0}
.ai-model{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 8px;border-radius:7px;font-size:12px;font-weight:600;color:var(--text-2);white-space:nowrap;max-width:100%}
.ai-model:hover,.ai-model-w.open .ai-model{background:var(--bg);color:var(--text)}
.ai-model .car{font-size:9px}
.ai-send{margin-left:auto;width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;flex:none}
.ai-send:hover{background:var(--accent-hover)}
.ai-send:disabled{background:var(--bg);color:var(--text-3);box-shadow:inset 0 0 0 1px var(--border);cursor:default}
.ai-send.stop{background:var(--text);color:var(--surface)}
.ai-send svg{width:14px;height:14px}
.ai-note{margin-top:7px;font-size:11px;color:var(--text-2);text-align:center;line-height:1.35}
.ai-menu{position:absolute;left:0;bottom:calc(100% + 6px);width:290px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;display:none;z-index:5}
.ai-model-w.open .ai-menu{display:block}
.ai-mi{display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;padding:7px 9px;border-radius:7px}
.ai-mi:hover{background:var(--bg)}
.ai-mi .ck{width:14px;flex:none;color:var(--accent);padding-top:1px}
.ai-mi .ck svg{width:12px;height:12px}
.ai-mi .nm{display:block;font-size:12.5px;font-weight:650;color:var(--text)}
.ai-mi .nm i{font-style:normal;font-weight:500;color:var(--text-2)}
.ai-mi .ds{display:block;font-size:11.5px;color:var(--text-2);margin-top:1px}
.ai-menu-f{font-size:11px;line-height:1.4;color:var(--text-2);padding:8px 9px 4px;border-top:1px solid var(--border);margin-top:4px}
/* история чатов */
.ai-hist{flex:1;min-height:0;overflow-y:auto;padding:10px 8px 16px;overscroll-behavior:contain}
.ai-hs{display:flex;align-items:center;gap:8px;margin:0 4px 6px;padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text-2)}
.ai-hs svg{width:13px;height:13px;flex:none}
.ai-hs input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:12.5px;color:var(--text)}
.ai-hg{font-size:11px;font-weight:700;color:var(--text-2);padding:12px 10px 4px}
.ai-hi{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;padding:8px 10px;border-radius:8px}
.ai-hi:hover{background:var(--bg)}
.ai-hi.active{background:var(--accent-soft)}
.ai-hi .t{font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-hi .s{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-2);min-width:0}
.ai-hi .s .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ai-hi .s .tm{margin-left:auto;flex:none;padding-left:8px}
.ai-hi .s .er{color:var(--down);flex:none}
.ai-hempty{padding:24px 10px;text-align:center;font-size:12.5px;color:var(--text-2)}
.ai-demo{margin:18px 4px 0;padding:10px 12px;border:1px dashed var(--border-strong);border-radius:10px;font-size:11.5px;color:var(--text-2);line-height:1.4}
.ai-demo b{color:var(--text);font-weight:650}
.ai-demo label{display:flex;align-items:center;gap:7px;margin-top:6px;cursor:pointer;color:var(--text)}
.ai-demo input{accent-color:var(--accent)}
/* кнопка в топбаре */
.tb-ai{position:relative;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);font-size:12.5px;font-weight:650;flex:none}
.tb-ai svg{width:15px;height:15px}
.tb-ai:hover{color:var(--text);border-color:var(--border-strong)}
.tb-ai.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.tb-ai .dot{position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--brand);border:2px solid var(--surface);display:none}
.tb-ai.has-new .dot{display:block}
.chrome-darkframe .tb-ai{background:#2E3745;border-color:#3B4655;color:#C9D1DD}
.chrome-darkframe .tb-ai:hover{color:#fff;border-color:#4A5668}
.chrome-darkframe .tb-ai.on{background:rgba(253,33,44,.18);border-color:transparent;color:#FF9AA0}
.chrome-darkframe .tb-ai .dot{border-color:#252D39}
@media (max-width:1100px){.tb-ai .lbl{display:none}.tb-ai{padding:0 8px}}
/* «Спросить ассистента» в строке ключа (появляется на hover, как копирование) */
.kw-ask{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:5px;color:var(--text-3);flex:none;opacity:0;transition:opacity .12s,color .12s;margin-left:-5px}
tr.kw-row:hover .kw-ask,.kw-ask:focus-visible{opacity:1}
.kw-ask:hover{color:var(--accent);background:var(--accent-soft)}
.kw-ask svg{width:12px;height:12px}
/* контекстное меню ячейки позиции (правый клик) */
#aiCellMenu{position:fixed;z-index:120;min-width:240px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);padding:6px;display:none}
#aiCellMenu.open{display:block}
#aiCellMenu .tm-item svg{width:14px;height:14px;flex:none;color:var(--text-3)}
#aiCellMenu .tm-item:hover svg{color:var(--text-2)}

/* ============ ДАШБОРД ПРОЕКТА (/projects/<id>) ============
   Модули: мониторинги · Метрика · GA4 · GSC · Вебмастер · лог проекта · команда.
   Цвета серий графиков — проверенная категориальная палитра (dataviz, 6 слотов, светлая и тёмная ступени);
   смысл цвета един для страницы: слот 1 — весь трафик / выбранная метрика, слот 2 — поисковый трафик. */
:root{--ch-1:#2a78d6;--ch-2:#eb6834;--ch-3:#1baf7a;--ch-4:#eda100;--ch-5:#e87ba4;--ch-6:#008300;
  --st-crit:#d03b3b;--st-warn:#c98500;--st-info:#5B6675}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--ch-1:#3987e5;--ch-2:#d95926;--ch-3:#199e70;--ch-4:#c98500;--ch-5:#d55181;--ch-6:#0ca30c;
    --st-crit:#F08B80;--st-warn:#E3B341;--st-info:#98A2B3}
}
:root[data-theme="dark"]{--ch-1:#3987e5;--ch-2:#d95926;--ch-3:#199e70;--ch-4:#c98500;--ch-5:#d55181;--ch-6:#0ca30c;
  --st-crit:#F08B80;--st-warn:#E3B341;--st-info:#98A2B3}

.proj-page .main{padding-bottom:64px}
.pj-wrap{container-type:inline-size;display:flex;flex-direction:column;gap:14px}
/* шапка: фавиконка + переключатель проекта + ссылка на сайт */
.pj-fav{width:26px;height:26px;border-radius:7px}
.pj-fav i{font-size:13px}
.pj-h1{display:inline-flex;align-items:center;gap:6px;font-size:19px;font-weight:750;letter-spacing:-.01em;padding:2px 6px;margin-left:-6px;border-radius:7px}
.pj-h1:hover{background:var(--surface)}
.pj-h1 .car{font-size:10px;color:var(--text-2)}
.pj-ext{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:7px;color:var(--text-2)}
.pj-ext:hover{background:var(--surface);color:var(--text)}
.pj-ext svg{width:14px;height:14px}
.pj-sw-pop{width:300px;max-height:420px;overflow:auto;padding:6px}
.pj-sw-pop .dd-item{gap:9px;font-weight:550}
.pj-sw-pop .dd-item .pfav{width:16px;height:16px}
.pj-sw-pop .sw-g{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2);padding:8px 10px 3px}
.pj-meta{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--text-2)}
.pj-meta b{color:var(--text);font-weight:650}
.pj-meta .dr{font-size:12px}
/* карточка модуля */
.pj-card{container-type:inline-size;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column}
.pj-ch{display:flex;align-items:center;gap:10px;padding:14px 16px 0;min-height:44px;flex-wrap:wrap}
.pj-ch h2{font-size:14.5px;font-weight:700;letter-spacing:-.005em;line-height:1.25}
.pj-ct{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.pj-ct .pj-tl{display:flex;align-items:center;gap:8px}
.pj-sub{font-size:11.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pj-cnt{font-size:11.5px;font-weight:650;color:var(--text-2);background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:0 7px;line-height:18px;font-variant-numeric:tabular-nums}
.pj-open{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--text-2);padding:6px 8px;border-radius:6px;min-height:28px;white-space:nowrap}
.pj-open:hover{background:var(--bg);color:var(--text)}
.pj-open svg{width:11px;height:11px}
.src-ico{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;flex:none}
.src-ico svg{width:17px;height:17px;display:block}
.pj-badge{font-size:11px;font-weight:650;padding:2px 8px;border-radius:20px;background:var(--bg);border:1px solid var(--border);color:var(--text-2);white-space:nowrap}
.pj-badge.err{color:var(--down);border-color:color-mix(in srgb, var(--down) 35%, var(--border))}
/* секции страницы */
.pj-sec{display:flex;align-items:center;gap:6px 14px;margin-top:8px;flex-wrap:wrap}
.pj-sec h2{font-size:16px;font-weight:750;letter-spacing:-.01em}
.pj-sec .pj-sec-sub{font-size:12px;color:var(--text-2)}
.pj-sec .spacer{flex:1}
.pj-seg{display:inline-flex;gap:2px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:2px}
.pj-sec .pj-seg{background:var(--surface)}
.pj-seg button{min-height:28px;padding:4px 11px;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--text-2);white-space:nowrap}
.pj-seg button:hover{color:var(--text)}
.pj-seg button.active{background:var(--text);color:var(--surface)}
.pj-grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.pj-grid-tl{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start}
@container (max-width: 1060px){ .pj-grid2,.pj-grid-tl{grid-template-columns:minmax(0,1fr)} }
/* KPI-плитки модуля (в GSC и Вебмастере — переключатели метрики графика) */
.pj-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:12px 16px 0;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.pj-kpi{display:flex;flex-direction:column;gap:1px;padding:9px 12px 10px;text-align:left;border-left:1px solid var(--border);min-width:0;position:relative}
.pj-kpi:first-child{border-left:none}
.pj-kpi .k-l{font-size:11.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pj-kpi .k-v{font-size:20px;font-weight:700;letter-spacing:-.015em;line-height:1.25;font-variant-numeric:tabular-nums;white-space:nowrap}
.pj-kpi .k-v small{font-size:12px;font-weight:600;color:var(--text-2);margin-left:3px;letter-spacing:0}
.k-d{font-size:11.5px;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.k-d.up{color:var(--up)} .k-d.down{color:var(--down)} .k-d.flat{color:var(--text-2);font-weight:550}
button.pj-kpi:hover{background:var(--surface-2)}
button.pj-kpi.sel{background:color-mix(in srgb, var(--ch-1) 7%, var(--surface))}
button.pj-kpi.sel::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--ch-1)}
@container (max-width: 520px){
  .pj-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pj-kpi:nth-child(3){border-left:none}
  .pj-kpi:nth-child(n+3){border-top:1px solid var(--border)}
}
/* легенда-переключатели серий */
.pj-legend{display:flex;align-items:center;gap:4px 16px;margin:10px 16px 0;flex-wrap:wrap}

{

  const olds = DATES.splice(0, DATES.length);

}

/* общие обработчики шапки: тема, поиск, переход на главную по лого */
function bindChrome(){
  document.querySelectorAll('.ts-btn').forEach(b=> b.onclick = ()=>{
    userTheme = b.dataset.mode==='system' ? null : b.dataset.mode;
    applyTheme();
  });
  const gsWrap = document.getElementById('searchWrap');
  if(gsWrap){
    const inp = gsWrap.querySelector('#gsInput');
    inp.onfocus = ()=>{ gsWrap.classList.add('open'); renderGsList(); };
    inp.oninput = renderGsList;
    gsWrap.querySelectorAll('.gs-tab').forEach(t=> t.onclick = e=>{
      e.stopPropagation();
      GS_TAB = t.dataset.t;
      gsWrap.querySelectorAll('.gs-tab').forEach(x=>x.classList.toggle('active', x===t));
      renderGsList();
    });
  }
  const logo = document.querySelector('.topbar .logo');
  if(logo) logo.onclick = goHome;
  document.querySelectorAll('[data-go="costs"]').forEach(b=> b.onclick = goCosts);
  document.querySelectorAll('.crumb-home').forEach(a=> a.onclick = e=>{ e.preventDefault(); goHome(); });
  aiBindChrome(); /* кнопка ассистента в шапке + контекст страницы для чата */
}
/* ================= РОУТИНГ =================
   главная            → <base>/
   страница позиций   → <base>/projects/<ID_PROJECT>/monitoring-list/<ID_MONITORING>
   стоимость (админ)  → <base>/costs
   На GitHub Pages глубокие пути отдаёт 404.html (копия index.html) — URL сохраняется,
   роутер читает location.pathname. В standalone-файле (file://) history недоступен —
   навигация работает в памяти. */
let CUR_MON = null; /* {p, m} открытого мониторинга */
const CAN_ROUTE = location.protocol === 'http:' || location.protocol === 'https:';
const BASE = (()=>{
  const p = location.pathname;
  let i = p.indexOf('/projects/');
  if(i < 0) i = p.search(/\/costs\/?$/);
  if(i >= 0) return p.slice(0, i + 1);
  return p.endsWith('/') ? p : p.replace(/[^/]*$/, '');
})();
const monPath = (pid,mid) => `${BASE}projects/${pid}/monitoring-list/${mid}`;
function parseRoute(){
  const m = location.pathname.match(/\/projects\/([^/]+)\/monitoring-list\/([^/]+)\/?$/);
  return m ? {pid:m[1], mid:m[2]} : null;
}
function findMon(pid, mid){
  for(const p of ALL_PROJECTS){
    if(String(p.id) !== String(pid)) continue;
    const m = p.mons.find(x=>String(x.id) === String(mid));
    if(m) return {p, m};
  }
  return null;
}
function goHome(){
  CUR_MON = null; PAGE = 'home';
  if(CAN_ROUTE && location.pathname !== BASE) history.pushState({}, '', BASE);
  renderHome();
}
function goMon(pid, mid){
  const f = (pid!=null) ? findMon(pid, mid) : null;
  CUR_MON = f; PAGE = 'mon';
  if(CAN_ROUTE && f) history.pushState({}, '', monPath(f.p.id, f.m.id));
  show(cur);
}
/* дашборд проекта → <base>/projects/<ID_PROJECT> */
let CUR_PROJ = null;
const projPath = pid => `${BASE}projects/${pid}`;
function findProj(pid){ return ALL_PROJECTS.find(p=>String(p.id)===String(pid)) || null; }
function goProj(pid){
  const p = findProj(pid);
  if(!p){ goHome(); return; }
  CUR_MON = null; CUR_PROJ = p; PAGE = 'proj';
  if(CAN_ROUTE && location.pathname !== projPath(p.id)) history.pushState({}, '', projPath(p.id));
  renderProject();
  window.scrollTo(0,0);
}
function route(){
  if(/\/costs\/?$/.test(location.pathname)){ CUR_MON = null; renderCosts(); return; }
  const pm = location.pathname.match(/\/projects\/([^/]+)\/?$/);
  if(pm && findProj(pm[1])){ CUR_MON = null; CUR_PROJ = findProj(pm[1]); PAGE = 'proj'; renderProject(); return; }
  const r = parseRoute();
  const f = r ? findMon(r.pid, r.mid) : null;
  if(f){ CUR_MON = f; PAGE = 'mon'; show(cur); }
  else { CUR_MON = null; PAGE = 'home'; renderHome(); }
}
window.addEventListener('popstate', route);

function domExpSvg(t){
  if(t === 'exp') return `<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="${DOMEXP_DEAD}"/></svg>`;
  return `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${DOMEXP_GLOBE}<path class="badge" fill="currentColor" stroke="none" fill-rule="evenodd" d="${DOMEXP_DISC} ${DOMEXP_MARK[t]}"/><path class="mark" fill="none" stroke="none" d="${DOMEXP_MARK[t]}"/></svg>`;
}
function domExpHtml(p){
  if(!p.exp) return '';
  const day = s => new Date(s+'T12:00:00');
  const days = Math.round((day(p.exp) - day(PJ_TODAY)) / 864e5);
  if(days > 7) return '';
  const d = p.exp.split('-').reverse().join('.');
  const n = Math.abs(days), w = (n%10===1 && n%100!==11) ? 'день' : (n%10>=2 && n%10<=4 && (n%100<12 || n%100>14)) ? 'дня' : 'дней';
  const head = days > 0 ? `Через ${n} ${w} истечёт срок регистрации домена`
             : days === 0 ? 'Сегодня истекает срок регистрации домена'
             : `Срок регистрации домена истёк ${n} ${w} назад`;
  const reg = p.reg || 'нет данных';
  const t = days > 0 ? 'warn' : days === 0 ? 'crit' : 'exp';
  return `<span class="dom-exp ${t}" data-head="${esc(head)}" data-date="${d}" data-reg="${esc(reg)}" role="img" aria-label="${esc(head)}. Дата окончания ${d}. Регистратор ${esc(reg)}" tabindex="0">${domExpSvg(t)}</span>`;
}
/* плавающая подсказка WHOIS: под иконкой, у нижнего края окна — над ней; прижимается к краям */
let dexpTipEl = null;
function dexpHide(){ if(dexpTipEl){ dexpTipEl.remove(); dexpTipEl = null; } }
function dexpShow(el){
  if(dexpTipEl && dexpTipEl._for === el) return;
  dexpHide();
  const t = document.createElement('div');
  t.className = 'dexp-tip'; t.setAttribute('role', 'tooltip'); t._for = el;
  t.innerHTML = `<b>${esc(el.dataset.head)}</b><span class="k">Дата окончания</span><span>${esc(el.dataset.date)}</span><span class="k">Регистратор</span><span>${esc(el.dataset.reg)}</span>`;
  document.body.appendChild(t);
  const r = el.getBoundingClientRect(), w = t.offsetWidth, h = t.offsetHeight;
  const x = Math.max(8, Math.min(r.left + r.width/2 - w/2, innerWidth - w - 8));
  let y = r.bottom + 8; if(y + h > innerHeight - 8) y = r.top - h - 8;
  t.style.left = x + 'px'; t.style.top = y + 'px';
  dexpTipEl = t;
}
document.addEventListener('mouseover', e => { const el = e.target.closest && e.target.closest('.dom-exp'); el ? dexpShow(el) : dexpHide(); });
document.addEventListener('focusin', e => { const el = e.target.closest && e.target.closest('.dom-exp'); el ? dexpShow(el) : dexpHide(); });
document.addEventListener('focusout', e => { if(e.target.closest && e.target.closest('.dom-exp')) dexpHide(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') dexpHide(); });

function applyHomeFilter(){

      && (r.dataset.search||'').includes(q);
    r.classList.toggle('vh', !ok);
  });
  app.querySelectorAll('tr.h-p').forEach(p=>{
    const any = [...app.querySelectorAll(`tr.h-m[data-hpp="${p.dataset.hp}"]`)].some(r=>!r.classList.contains('vh'));
    p.classList.toggle('vh', !any);
  });
  app.querySelectorAll('tr.h-g').forEach(g=>{
    const any = [...app.querySelectorAll(`tr.h-p[data-hgp="${g.dataset.hg}"]`)].some(r=>!r.classList.contains('vh'));
    g.classList.toggle('vh', !any);
  });
}

  const updateBulk = ()=>{
    const g = app.querySelectorAll('.hsel-box.lvl-g.checked').length;

    const chip = document.getElementById('bulkChip');

      app.querySelectorAll(`tr[data-hgp="${sc.slice(2)}"] .hsel-box`).forEach(x=>x.classList.toggle('checked', on));
    } else if(sc.startsWith('p:')){
      app.querySelectorAll(`tr.h-m[data-hpp="${sc.slice(2)}"] .hsel-box`).forEach(x=>x.classList.toggle('checked', on));
    }
    updateBulk();
  });
  const bc = document.getElementById('bulkClear');
  if(bc) bc.onclick = ()=>{
    app.querySelectorAll('.hsel-box.checked').forEach(cb=>cb.classList.remove('checked'));
    updateBulk();
  };
  /* клик по мониторингу → страница позиций */
  app.querySelectorAll('tr.h-m').forEach(r=> r.onclick = e=>{
    if(e.target.closest('.hm-star')||e.target.closest('.hsel-box')||e.target.closest('.hg-btn')) return;
    goMon(r.dataset.pid, r.dataset.mid);
  });
}

function trendHtml(diff, invert=false){
  if(!diff) return '<span class="trend" style="color:var(--text-3)">— без изменений</span>';
  const good = invert ? diff<0 : diff>0;
  const cls = good?'up':'down';
  const arrow = diff>0?'▲':'▼';
  return `<span class="trend ${cls}">${arrow} ${Math.abs(diff)} к прошлому срезу</span>`;
}

function renderSummaryTable(){
  const head = DATES.map((d,i)=>`<td class="${i===DATES.length-1?'lastcol':''}" style="color:var(--text-3);font-size:10.5px;font-weight:650;text-transform:uppercase">${d.d} <span style="font-weight:500">${d.w}</span></td>`).join('');
  const rows = SUMMARY.map(r=>{
    const cells = DATES.map((_,i)=>{
      const df = delta(r.vals,i);
      const dh = i>0&&df!==0 ? `<span class="sum-delta ${df>0?'up':'down'}">${df>0?'▲':'▼'}${Math.abs(df)}</span>` : '';
      return `<td class="${i===DATES.length-1?'lastcol':''}"><span class="num">${r.vals[i]}</span><span class="pct">${r.pct[i]} %</span>${dh}</td>`;
    }).join('');
    const sw = r.band?`<span class="sw" style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--${r.band}-heat);margin-right:7px;vertical-align:1px"></span>`:'';
    return `<tr class="${r.hero?'hero':''}"><th>${sw}${r.label}</th>${cells}</tr>`;
  }).join('');
  const totals = DATES.map((_,i)=>`<td class="${i===DATES.length-1?'lastcol':''}" style="color:var(--text-3)">${TOTAL_KEYS[i]}</td>`).join('');
  return `<div class="summary-table"><table>
    <tr><th style="font-size:10.5px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em">Сводка · срезы</th>${head}</tr>
    ${rows}
    <tr><th style="color:var(--text-3)">Всего ключей</th>${totals}</tr>
  </table></div>`;
}

function renderSummaryStrip(){
  const items = SUMMARY.map(r=>{
    const last = r.vals.length-1;
    const df = delta(r.vals,last);
    const color = r.band?`var(--${r.band}-heat)`:'var(--accent)';
    return `<div class="strip-item">
      <span class="lbl">${r.label.replace('Ключей в ','')}</span>
      <span class="val">${r.vals[last]}<span class="pct">${r.pct[last]} %</span></span>
      ${trendHtml(df)}
      ${spark(r.vals,104,22,color)}
    </div>`;
  }).join('');
  return `<div class="summary-strip">${items}</div>`;
}

function renderSummaryCards(side=false){
  const cards = SUMMARY.map(r=>{
    const last = r.vals.length-1;
    const df = delta(r.vals,last);
    const color = r.band?`var(--${r.band}-heat)`:'var(--accent)';
    const sw = r.band?`<span class="sw" style="background:var(--${r.band}-heat)"></span>`:'';
    return `<div class="sum-card">
      <span class="lbl">${sw}${r.label}</span>
      <span class="val">${r.vals[last]}<span class="pct">${r.pct[last]} % от ядра</span></span>
      ${trendHtml(df)}
      ${spark(r.vals, side?150:150, 26, color)}
    </div>`;
  }).join('');
  return `<div class="${side?'summary-side':'summary-cards'}">${cards}</div>`;
}

function renderSummaryChart(){
  const vis = SUMMARY[0];
  const W=760, H=168, PL=38, PR=18, PT=20, PB=26;
  const vals = vis.vals;
  const min = Math.min(...vals), max = Math.max(...vals), span = (max-min)||1;
  const x = i => PL + i*((W-PL-PR)/(vals.length-1));
  const y = v => PT + (1-((v-min)/span))*(H-PT-PB);
  const pts = vals.map((v,i)=>[x(i),y(v)]);
  const line = pts.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ');
  const area = `M${pts[0][0]},${pts[0][1]} `+pts.slice(1).map(p=>`L${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ')+` L${pts[pts.length-1][0]},${H-PB+6} L${pts[0][0]},${H-PB+6} Z`;
  const grid = [min, Math.round((min+max)/2), max].map(v=>
    `<line x1="${PL}" y1="${y(v)}" x2="${W-PR}" y2="${y(v)}" stroke="var(--border)" stroke-width="1"/>
     <text x="${PL-6}" y="${y(v)+3}" text-anchor="end" font-size="9.5" fill="var(--text-3)">${v}</text>`).join('');
  const dots = pts.map((p,i)=>{
    const last = i===pts.length-1;
    return `<circle cx="${p[0]}" cy="${p[1]}" r="${last?4:2.6}" fill="${last?'var(--accent)':'var(--surface)'}" stroke="var(--accent)" stroke-width="1.6"/>
      <text x="${p[0]}" y="${p[1]-8}" text-anchor="middle" font-size="9.5" font-weight="${last?'700':'400'}" fill="${last?'var(--text)':'var(--text-3)'}">${vals[i]}</text>
      <text x="${p[0]}" y="${H-8}" text-anchor="middle" font-size="9.5" fill="var(--text-3)">${DATES[i].d}</text>`;
  }).join('');
  const side = SUMMARY.map(r=>{
    const lastI = r.vals.length-1, df = delta(r.vals,lastI);
    const dd = df===0?'<span class="dd flat">0</span>':`<span class="dd ${df>0?'up':'down'}">${df>0?'▲':'▼'}${Math.abs(df)}</span>`;
    const sw = r.band?`<span class="sw" style="background:var(--${r.band}-heat)"></span>`:`<span class="sw" style="background:var(--accent)"></span>`;
    return `<div class="cs-item">${sw}<span class="lbl">${r.label.replace('Ключей в ','')}</span><span class="val">${r.vals[lastI]}</span>${dd}</div>`;
  }).join('');
  return `<div class="summary-chart">
    <div class="chart-pane">
      <div class="chart-title">Общая видимость по срезам</div>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="График общей видимости">
        ${grid}
        <path d="${area}" fill="var(--accent-soft)"/>
        <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
        ${dots}
      </svg>
    </div>
    <div class="chart-side">${side}</div>
  </div>`;
}

function nowCellHtml(k){
  const nums = k.pos.filter(p=>typeof p==='number');
  if(!nums.length) return '<span style="color:var(--text-3)">—</span>';
  const last = nums[nums.length-1], first = nums[0];
  const d = first-last;
  const b = band(last);
  const dh = d===0 ? '<span class="nd flat">0</span>'
    : `<span class="nd ${d>0?'up':'down'}" title="Изменение за период">${d>0?'▲':'▼'}${Math.abs(d)}</span>`;
  return `<div class="now-cell" title="Текущая позиция, изменение и тренд за период">
    <span class="np" style="color:var(--${b}-fg)">${last}</span>${dh}${spark(nums.map(n=>-n),62,20,`var(--${b}-heat)`)}
  </div>`;
}

function typDots(typ){
  const st = curV && curV.typStyle;
  if(st==='chips'){
    return Object.entries(typ).map(([k,n])=>
      `<span class="typ-chip" style="background:color-mix(in srgb, ${TYP_META[k].color} 16%, transparent);color:${TYP_META[k].color}" title="${TYP_META[k].name}: ${n} в ТОП-10">${TYP_META[k].short} ${n}</span>`).join('');
  }
  if(st==='stack'){
    const total = Object.values(typ).reduce((a,b)=>a+b,0);
    const tip = Object.entries(typ).map(([k,n])=>`${TYP_META[k].name}: ${n}`).join(', ');
    return `<span class="typ-stack" title="${tip}">${Object.entries(typ).map(([k])=>
      `<span class="ts-dot" style="background:${TYP_META[k].color}"></span>`).join('')}<span class="ts-n">${total}</span></span>`;
  }
  return Object.entries(typ).map(([k,n])=>
    `<span class="typ-dot" style="background:${TYP_META[k].color}" title="${TYP_META[k].name}: ${n} в ТОП-10">${n}</span>`
  ).join('');
}
function serpIcons(serp){
  const map = {ads:{t:'Ad',lbl:'Реклама',tip:'Реклама в выдаче'},vid:{t:'▶',lbl:'Видео',tip:'Видео в выдаче'},map:{t:'⌖',lbl:'Карты',tip:'Карты в выдаче'}};
  if(!serp.length) return '<span style="color:var(--text-3)">—</span>';
  if(curV && curV.serpStyle==='chips')
    return serp.map(s=>`<span class="serp-chip" title="${map[s].tip}">${map[s].lbl}</span>`).join('');
  return serp.map(s=>`<span class="serp-ico" title="${map[s].tip}">${map[s].t}</span>`).join('');
}

function cellHtml(k, i, gi, ki){
  const p = k.pos[i];
  if(p==null) return `<span class="cell none" title="Не в ТОП-100">—</span>`;
  if(p==='na') return `<span class="cell na" title="Позиция не снята">н/д</span>`;
  const b = band(p);
  const d = posDelta(k.pos,i);
  const dh = d ? `<span class="d ${d>0?'up':'down'}">${d>0?'+':''}${d}</span>` : '';
  /* маркеры среза — рядом внизу ячейки, не наезжая друг на друга и на дельту */
  const marks = [];
  if((k.swap||[]).includes(i)) marks.push(`<span class="swap" data-swap="${gi}:${ki}:${i}" title="Сменилась релевантная страница — подробнее">⇅</span>`);
  if((k.adsAt||[]).includes(i)) marks.push(`<span class="admark" title="Реклама в выдаче · ${DATES[i].d}">${I.gads}</span>`);
  const mk = marks.length ? `<span class="marks">${marks.join('')}</span>` : '';
  return `<button class="cell ${b}" data-serp="${gi}:${ki}:${i}" title="${DATES[i].d}: позиция ${p}${d?` (${d>0?'+':''}${d})`:''} · открыть ТОП выдачи${(k.swap||[]).includes(i)?' · сменилась релевантная страница':''}">${mk}${p}${dh}</button>`;
}

function renderWorksheet(v){
  const nCols = (v.nowCol?5:4)+VIS.size;
  const dateHead = DATES.map((d,i)=> !VIS.has(i)?'':`<th class="date ${i===LASTV?'last':''}"><span class="d">${d.d}</span><span class="dw">${d.w}</span>${d.t?`<span class="dtm">${d.t}</span>`:''}</th>`).join('');
  const theadHtml = `<thead><tr>
      <th class="kw">Ключ</th><th title="Типизация сайтов в ТОП-10">Топ 10</th>
      <th title="Элементы выдачи">SERP</th><th class="freq-h" title="Частотность ${WS_MONTH} с динамикой к ${WS_PREV}"><span class="fh-l">Частотность</span>${ENGINE==='ya'?`<span class="ws-seg" role="group" aria-label="Вид частотности"><button data-m="base" class="${WS_MODE==='base'?'active':''}" title="Базовая частотность">базовая</button><button data-m="exact" class="${WS_MODE==='exact'?'active':''}" title="Точная частотность (оператор «!»)">!точная</button></span>`:''}</th>
      ${v.nowCol?'<th class="now" title="Текущая позиция, изменение за период, тренд">Сейчас · Δ</th>':''}
      ${dateHead}
    </tr></thead>`;

  const groupBlock = (g, cgi, si) => {
    const grow = `<tr class="group-gap" data-super="${si}" aria-hidden="true"><td colspan="${nCols}"></td></tr>
      <tr class="group-row" data-group="${cgi}" data-super="${si}"><td colspan="${nCols}">
      <div class="group-head">
        <span class="chev">${I.chev}</span>
        <span class="gname">${esc(g.name)}</span>
        <a class="gurl" href="#" onclick="return false" title="Целевая страница группы">${I.link}<span class="gurl-t">${g.url}</span></a>
        <button class="gact gedit" title="Редактировать URL группы">✎</button>
      </div><span class="gcount gcount-abs"><span class="gcal" title="Группа добавлена в проект: ${g.added||'—'}">${I.cal}</span>${g.keys.length} ключ${g.keys.length>4?'ей':'а'}</span></td></tr>`;
    const rows = g.keys.map((k,ki)=>{
      const cells = DATES.map((_,i)=> !VIS.has(i)?'':`<td class="pos ${i===LASTV?'last':''}">${cellHtml(k,i,cgi,ki)}</td>`).join('');
      const rel = k.relUrl ? (()=>{
        /* сайт в топе несколькими URL: чип-выпадашка рядом с релевантным URL, позиции — последний срез */
        const urls = ourUrlsFor(k, {mi:LASTV, seed:LASTV});
        const chip = urls.length>1 ? `<button class="ku-btn" data-ku="${cgi}:${ki}" title="Сайт найден по ${urls.length} URL — показать все с актуальными позициями">${urls.length} URL <span class="car">▾</span></button>` : '';
        return `<span class="rel-wrap"><a class="rel-url" href="#" onclick="return false" title="Релевантная страница отличается от целевой URL группы (${g.url})">≠ ${k.relUrl}</a>${chip}</span>`;
      })() : '';
      const cats = keyCats(k).join(' ');
      return `<tr class="kw-row" data-parent="${cgi}" data-super="${si}" data-key="${cgi}:${ki}" data-cats="${cats}">
        <td class="kw"><div class="kw-cell" data-kw="${esc(k.kw)}"><a class="eng ya" title="Открыть ключ в Яндексе" href="https://yandex.ru/search/?text=${encodeURIComponent(k.kw)}" target="_blank" rel="noopener">${I.ya}</a><span class="txt" title="Скопировать ключ">${esc(k.kw)}</span><button class="kw-copy" title="Скопировать ключ">${I.copy}</button><button class="kw-ask" data-ask="${cgi}:${ki}" title="Спросить ассистента о ключе" aria-label="Спросить ассистента о ключе">${AI_I.spark}</button></div>${rel}</td>
        <td class="typ">${typDots(k.typ)}</td>
        <td class="serp">${serpIcons(k.serp)}</td>
        ${(()=>{ /* показывается один вид частотности — выбирается переключателем в шапке */
          const ex = WS_MODE==='exact', wv = ex?k.wse:k.ws, wd = ex?k.wsed:k.wsd;
          const tip = ex?`Точная частотность («!») ${WS_MONTH}: ${wv.toLocaleString('ru-RU')}`:`Базовая частотность ${WS_MONTH}: ${wv.toLocaleString('ru-RU')}`;
          const dh2 = wd?`<span class="freq-d ${wd>0?'up':'down'}" title="Изменение к ${WS_PREV}: ${wd>0?'+':'−'}${Math.abs(wd).toLocaleString('ru-RU')}">${wd>0?'+':'−'}${fmtWs(Math.abs(wd))}</span>`:'';
          return `<td class="freq"><span class="freq-b" title="${tip}">${ex?'<b class="ex">!</b>':''}${fmtWs(wv)}</span>${dh2}</td>`;
        })()}
        ${v.nowCol?`<td class="now">${nowCellHtml(k)}</td>`:''}
        ${cells}</tr>`;
    }).join('');
    return grow+rows;
  };

  let gi = -1;
  if(v.modules){
    /* Zoho-стиль: супергруппа = отдельный модуль-карточка со своей таблицей */
    return WORKSHEET.map((sg,si)=>{
      const totalKeys = sg.groups.reduce((n,g)=>n+g.keys.length,0);
      const body = sg.groups.map(g=>{ gi++; return groupBlock(g,gi,si); }).join('');
      return `<section class="module">
        <div class="module-head" data-sid="${si}">
          <span class="chev">${I.chev}</span>
          <span class="sname">${esc(sg.name)}</span>
          ${sg.reg?`<span class="flag-ico" title="Регион: ${sg.reg.name}">${I.flags[sg.reg.f]}</span>`:''}
          <span class="scount">${sg.groups.length} групп${sg.groups.length===1?'а':'ы'} · ${totalKeys} ключей</span>
          <span class="gspacer"></span>
          <button class="gact" title="Снять позиции супергруппы">${I.play}</button>
          <button class="gact" title="Настройки супергруппы">⋯</button>
        </div>
        <div class="worksheet"><div class="table-wrap"><table class="grid">${theadHtml}<tbody>${body}</tbody></table></div></div>
      </section>`;
    }).join('');
  }
  const groups = WORKSHEET.map((sg,si)=>{
    const totalKeys = sg.groups.reduce((n,g)=>n+g.keys.length,0);
    const superRow = `<tr class="group-gap big" aria-hidden="true"><td colspan="${nCols}"></td></tr>
      <tr class="super-row" data-sid="${si}"><td colspan="${nCols}">
      <div class="super-head">
        <span class="chev">${I.chev}</span>
        <span class="sname">${esc(sg.name)}</span>
        ${sg.reg?`<span class="flag-ico" title="Регион: ${sg.reg.name}">${I.flags[sg.reg.f]}</span>`:''}
        <span class="scount">${sg.groups.length} групп${sg.groups.length===1?'а':'ы'} · ${totalKeys} ключей</span>
      </div></td></tr>`;
    const groupsHtml = sg.groups.map(g=>{ gi++; return groupBlock(g,gi,si); }).join('');
    return superRow+groupsHtml;
  }).join('');
  return `<div class="worksheet"><div class="table-wrap"><table class="grid">${theadHtml}
    <tbody class="sum-body">${renderSummaryRows(v.nowCol?5:4)}</tbody>
    <tbody>${groups}</tbody></table></div></div>`;
}

/* сводка как часть общей сетки: label занимает колонки ключа, даты совпадают с матрицей.
   Режимы отображения: абсолютные значения или проценты (переключатель у «Общей видимости») */
function renderSummaryRows(labelSpan){
  const rows = SUMMARY.map(r=>{
    const cells = DATES.map((_,i)=>{
      if(!VIS.has(i)) return '';
      const j = prevVis(i);
      const dfA = delta(r.vals,i);
      const dhA = j>=0&&dfA!==0 ? `<span class="sum-delta d-abs ${dfA>0?'up':'down'}">${dfA>0?'▲':'▼'}${Math.abs(dfA)}</span>` : '';
      const dfP = j>=0 ? r.pct[i]-r.pct[j] : 0;
      const dhP = j>=0&&dfP!==0 ? `<span class="sum-delta d-pct ${dfP>0?'up':'down'}">${dfP>0?'▲':'▼'}${Math.abs(dfP)}</span>` : '';
      return `<td class="sum ${i===LASTV?'lastcol':''}"><span class="num">${r.vals[i]}</span><span class="pct">${r.pct[i]} %</span>${dhA}${dhP}</td>`;
    }).join('');
    const sw = r.band?`<span class="sw" style="background:var(--${r.band}-heat)"></span>`:'';
    const seg = r.hero ? `<span class="sum-mode-seg" title="Вид сводки: абсолютные значения / проценты"><button class="sm-mode active" data-m="abs">123</button><button class="sm-mode" data-m="pct">%</button></span>` : '';
    return `<tr class="sum-row ${r.hero?'hero':''}"><td class="sum-label" colspan="${labelSpan}">${sw}${r.label}${seg}</td>${cells}</tr>`;
  }).join('');
  const totals = DATES.map((_,i)=> !VIS.has(i)?'':`<td class="sum ${i===LASTV?'lastcol':''}"><span class="num total">${TOTAL_KEYS[i]}</span></td>`).join('');
  return rows + `<tr class="sum-row total"><td class="sum-label" colspan="${labelSpan}">Всего ключей</td>${totals}</tr>`;
}

function renderLegend(){
  const bands = [['t3','ТОП 1–3'],['t10','4–10'],['t20','11–20'],['t50','21–50'],['t100','51–100']]
    .map(([b,l])=>`<span class="lg-chip"><span class="sw" style="background:var(--${b}-bg);border:1px solid var(--${b}-heat)"></span>${l}</span>`).join('');
  const typs = Object.values(TYP_META).map(t=>`<span class="lg-chip"><span class="dotsw" style="background:${t.color}"></span>${t.name}</span>`).join('');
  return `<div class="legend">
    <span class="lg-group"><span class="lg-label">Позиции</span>${bands}<span class="lg-chip" style="color:var(--text-3)">— вне ТОП-100</span><span class="lg-chip"><span class="swapsw">⇅</span>смена релевантной страницы</span></span>
    <span class="lg-group"><span class="lg-label">Типизация</span>${typs}</span>
  </div>`;
}

function renderDashboard(v){
  curV = v;
  VIS = visibleIdx(); LASTV = Math.max(...VIS);
  const hlSwatches = arr => arr.map((t,i)=> t==null?null:`<span class="hsw" style="background:var(--${['t3','t10','t20','t50'][i]}-heat)"></span>–${t}`).filter(Boolean).join(', '); /* тире перед числом: цвет ДО этой позиции */
  /* сводка живёт внутри общей колоночной сетки матрицы (renderWorksheet) — даты всегда выровнены.
     Легенды нет: пороги подсветки показаны в селекте «Подсветка», типизация и «⇅» — тултипами */
  const contentRaw = renderWorksheet(v);
  let tgi = -1;
  const tocListHtml = WORKSHEET.map(sg =>
    `<div class="toc-super">${esc(sg.name)}</div>` +
    sg.groups.map(g=>{ tgi++; return `<button class="toc-item" data-goto="${tgi}"><span>${esc(g.name)}</span><span class="tc">${g.keys.length}</span></button>`; }).join('')
  ).join('');
  const contentHtml = v.detail
    ? `<div class="detail-grid"><div class="detail-main">${contentRaw}</div><aside class="detail-rail" id="detailRail"></aside></div>`
    : contentRaw;
  /* вкладки авто-видов: счётчики из данных, клик фильтрует ключи */
  const allKeys = GROUPS.flatMap(g=>g.keys);
  const cnt = view => view==='all' ? allKeys.length : allKeys.filter(k=>keyCats(k).includes(view)).length;

/* ================= SERP MODAL ================= */
const serpModal = document.getElementById('serpModal');
const smBox = document.getElementById('smBox');
const drawerBack = document.getElementById('drawerBack');
let serpState = null; /* {gi, ki, dates:[индексы выбранных срезов]} */

/* наша позиция для колонки модалки: из матрицы (текущий период) или синтетическая (архив) */
function modalPos(k, md){
  if(md.mi!=null) return k.pos[md.mi];
  const base = k.pos.find(p=>typeof p==='number');
  if(base==null) return null;
  return Math.max(1, base + ((md.seed*3)%7) - 3);
}
/* выдача для конкретного среза: детерминированная перестановка + наш сайт на своей позиции */
/* все URL нашего сайта по ключу в этом срезе с их актуальными позициями:
   первый — лучший (он же в матрице), остальные могут быть глубже, в т.ч. за пределами топа */
function ourUrlsFor(k, md){
  const p = modalPos(k, md);
  if(typeof p!=='number') return [];
  const our = SERP_TOP.find(r=>r.our);
  const urls = [{path:our.path, title:our.title, pos:p}];
  if(k.relUrl) urls.push({path:k.relUrl, title:PAGE_TITLES[k.relUrl]||'Релевантная страница', pos:Math.min(99, p + 9 + (md.seed%6))});
  if(md.seed % 3 === 1){
    const used = urls.map(u=>u.path);
    const extra = Object.keys(PAGE_TITLES).find(pt=>!used.includes(pt) && pt!=='/');
    if(extra) urls.push({path:extra, title:PAGE_TITLES[extra], pos:Math.min(99, p + 35 + (md.seed%15))});
  }
  return urls;
}
function serpForDate(k, md){
  const base = [...SERP_TOP.filter(r=>!r.our), ...SERP_TOP2].map(r=>({...r}));
  for(let s=0;s<md.seed;s++){ const i=(s*3)%(base.length-1); const t=base[i]; base[i]=base[i+1]; base[i+1]=t; }
  const our = SERP_TOP.find(r=>r.our);
  const ours = ourUrlsFor(k, md);
  const p = modalPos(k, md);
  /* наша позиция 11–20 — показываем ТОП-20, иначе ТОП-10 */
  const N = (typeof p==='number' && p>10 && p<=20) ? 20 : 10;
  const list = base.slice(0,N);
  /* в выдачу встают только наши URL, реально попавшие в показанный топ */
  ours.filter(u=>u.pos<=N).sort((a,b)=>a.pos-b.pos).forEach(u=>{
    list.splice(u.pos-1, 0, {...our, path:u.path, title:u.title});
  });
  return {list: list.slice(0,N).map((r,i)=>({...r, pos:i+1})), ours};
}

/* разметка топов: категория сайта, назначенная правым кликом по позиции (домен → тип) */
const DOM_TYP = {};
function serpColRows(list){
  return list.map(r0=>{
    const r = DOM_TYP[r0.dom] ? {...r0, typ:DOM_TYP[r0.dom]} : r0;
    return `
    <div class="serp-row ${r.our?'our':''}" data-dom="${r.dom}" data-typ="${r.typ}">
      <span class="serp-pos" style="background:${TYP_META[r.typ].color}" title="${TYP_META[r.typ].name} · правый клик — изменить категорию">${r.pos}</span>
      <div class="serp-body">
        <div class="serp-title"><span class="fav" style="background:hsl(${hashStr(r.dom)%360} 42% 46%)"><i>${r.dom[0].toUpperCase()}</i><img src="https://www.google.com/s2/favicons?domain=${r.dom}&amp;sz=32" alt="" loading="lazy" onload="this.classList.add('ok')"></span>${esc(r.title)}</div>
        <div class="serp-url"><span class="su-text"><b>${r.dom}</b>${r.path}</span></div>
      </div>
    </div>`;
  }).join('');
}

/* доступные в модалке срезы: диапазон + частота (та же логика, что у периода страницы) */
function sampledModalDates(){
  const r = serpState.range;
  let list = MODAL_DATES.filter(md=> md.iso>=r.from && md.iso<=r.to);
  const s = serpState.sampling||'all';
  if(s!=='all'){
    const keyFn = s==='month' ? md=>md.iso.slice(0,7)
      : s==='2week' ? md=>isoWeekKey(md.iso,2)
      : s==='week' ? md=>isoWeekKey(md.iso,1)
      : md=>md.iso;
    const seen = new Set();
    list = list.filter(md=>{ const k2=keyFn(md); if(seen.has(k2)) return false; seen.add(k2); return true; });
  }
  return list;
}

function renderSerpModal(){
  const {gi,ki,dates,range} = serpState;
  const k = GROUPS[gi].keys[ki];
  /* «Последние N»: N последних доступных срезов (с учётом периода и частоты) одним кликом */
  const lastNIds = n => sampledModalDates().slice(-n).map(md=>md.id);
  const isLastN = n => { const ids = lastNIds(n); return ids.length===dates.length && ids.every(id=>dates.includes(id)); };
  const cols = MODAL_DATES.filter(md=>dates.includes(md.id)).map(md=>{
    const p = modalPos(k, md); const b = band(p);
    /* реклама в этом срезе: для срезов матрицы — из данных ключа, для архивных — детерминированно */
    const hasAds = md.mi!=null ? (k.adsAt||[]).includes(md.mi) : (hashStr('ads:'+k.kw+':'+md.id)%100) < 40;
    const adsN = 2 + (hashStr('adsn:'+k.kw+':'+md.id) % 3);
    /* полоса рекламы есть во всех колонках (одинаковая высота — строки не разъезжаются) */
    const adsStrip = hasAds
      ? `<div class="sm-ads" title="Рекламная выдача показывалась над органическими результатами"><span class="admark">${I.gads}</span>Реклама · ${adsN} объявлени${adsN===2?'я':adsN>4?'й':'я'} над результатами</div>`
      : `<div class="sm-ads none">Без рекламы в выдаче</div>`;
    return `<div class="sm-col">
      <div class="sm-col-h"><b>${md.d}</b>${md.t?`<span class="t">${md.t}</span>`:''}<span class="dw2">${md.w}</span>${md.arch?'<span class="t">архив</span>':''}
        <span class="ourpos ${b||'none'}" title="Наша позиция в этом срезе">${p==null?'—':(p==='na'?'н/д':p)}</span></div>
      ${adsStrip}
      <div class="sm-list">${serpColRows(serpForDate(k,md).list)}</div>
    </div>`;
  }).join('');
  smBox.innerHTML = `
    <div class="sm-head">
      <div class="sm-title">
        <span class="eng ya" title="Яндекс">${I.ya}</span>
        <h3>${esc(k.kw)}</h3>
        <button class="close" id="smClose" aria-label="Закрыть">✕</button>
      </div>
      <div class="sm-range">
        <span>Период:</span>
        <span class="dd-wrap" id="smCalWrap">
          <button class="period">${I.cal} ${fmtRu(range.from)} — ${fmtRu(range.to)}</button>
          <div class="dd-panel cal-pop" id="smCalPop"></div>
        </span>
        <span class="sm-sep"></span>
        ${[5,10].map(n=>`<button class="lastn ${isLastN(n)?'active':''}" data-n="${n}" title="Показать ${n} последних срезов">Последние ${n}</button>`).join('')}
      </div>
    </div>
    <div class="sm-cols">${cols}</div>`;
  document.getElementById('smClose').onclick = closeSerp;
  smBox.querySelectorAll('.lastn').forEach(b=> b.onclick = ()=>{
    serpState.dates = lastNIds(+b.dataset.n);
    renderSerpModal();
  });
  /* разметка топов: правый клик по позиции — меню категорий сайта */
  smBox.querySelectorAll('.serp-row[data-dom]').forEach(row=> row.oncontextmenu = e=>{
    e.preventDefault();
    showTypMenu(row.dataset.dom, row.dataset.typ, e.clientX, e.clientY);
  });
  /* кросс-подсветка: hover по сайту подсвечивает этот же домен в остальных колонках */
  smBox.querySelectorAll('.serp-row[data-dom]').forEach(row=>{
    row.onmouseenter = ()=> smBox.querySelectorAll(`.serp-row[data-dom="${row.dataset.dom}"]`).forEach(x=>x.classList.add('hl'));

let CAL = null; /* target: 'page' — период страницы, 'modal' — диапазон в SERP-модалке */
function openCalFor(target, from, to, sampling){
  CAL = { target, y:+from.slice(0,4), m:+from.slice(5,7)-1,
          from, to, sampling, custom:false, pick:false };
  buildCal();
}
function openCal(){ openCalFor('page', PERIOD.from, PERIOD.to, SAMPLING); }
/* календарь — под кнопкой диапазона, правым краем к ней; прижим к краям окна */
function placeCalPop(wrap){
  const pop = wrap.querySelector('.cal-pop'), btn = wrap.querySelector('.period');
  if(!pop || !btn) return;
  const r = btn.getBoundingClientRect();
  const W = Math.min(680, innerWidth*.94);
  pop.style.left = Math.max(8, Math.min(r.right - W, innerWidth - W - 8)) + 'px';
  let top = r.bottom + 8;
  const H = pop.offsetHeight || 380;
  if(top + H > innerHeight - 8) top = Math.max(8, r.top - H - 8); /* снизу не влезает — вверх */
  pop.style.top = top + 'px';
}
function calMonthHtml(y,m){
  const MN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const startDow = (new Date(y,m,1).getDay()+6)%7;
  const dim = new Date(y,m+1,0).getDate();
  let cells='';
  for(let i=0;i<startDow;i++) cells += '<span class="cal-day other"></span>';
  for(let d=1;d<=dim;d++){
    const iso = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const has = MODAL_DATES.some(md=>md.iso===iso);
    const inr = iso>=CAL.from && iso<=CAL.to;
    const edge = iso===CAL.from || iso===CAL.to;
    cells += `<button class="cal-day ${inr?'inr':''} ${edge?'edge':''} ${has?'has':''}" data-iso="${iso}">${d}</button>`;
  }
  return `<div class="cal-month"><div class="cal-mt">${MN[m]} ${y}</div>
    <div class="cal-wd">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(w=>`<span>${w}</span>`).join('')}</div>
    <div class="cal-grid">${cells}</div></div>`;
}
function buildCal(){
  const pop = document.getElementById(CAL && CAL.target==='modal' ? 'smCalPop' : 'calPop');
  if(!pop || !CAL) return;
  const months = [0,1,2].map(off=>{
    let y=CAL.y, m=CAL.m+off; y+=Math.floor(m/12); m=((m%12)+12)%12;
    return calMonthHtml(y,m);
  }).join('');
  pop.innerHTML = `
    <div class="cal-months"><button class="cal-nav" data-nav="-1">‹</button>${months}<button class="cal-nav" data-nav="1">›</button></div>
    <div class="cal-foot">
      ${[['all','Все'],['day','1/день'],['week','1/неделю'],['2week','2/неделю'],['month','1/месяц']]
        .map(([v2,l])=>`<label class="cal-radio"><input type="radio" name="samp" value="${v2}" ${CAL.sampling===v2?'checked':''}>${l}</label>`).join('')}
      <label class="cal-toggle"><input type="checkbox" id="calCustom" ${CAL.custom?'checked':''}><span class="tgl"></span>Свой выбор дат</label>
      <button class="btn primary" id="calApply">Применить</button>
    </div>`;
  pop.querySelectorAll('.cal-nav').forEach(b=> b.onclick = e=>{ e.stopPropagation(); CAL.m += +b.dataset.nav; buildCal(); });
  pop.querySelectorAll('.cal-day:not(.other)').forEach(d=> d.onclick = e=>{
    e.stopPropagation();
    const iso = d.dataset.iso;
    if(!CAL.pick){ CAL.from = iso; CAL.to = iso; CAL.pick = true; }
    else { if(iso<CAL.from){ CAL.to = CAL.from; CAL.from = iso; } else CAL.to = iso; CAL.pick = false; }
    CAL.custom = true;
    buildCal();
  });
  pop.querySelectorAll('input[name="samp"]').forEach(r=> r.onchange = ()=>{ CAL.sampling = r.value; });
  const cc = document.getElementById('calCustom');
  if(cc) cc.onchange = ()=>{ CAL.custom = cc.checked; };
  document.getElementById('calApply').onclick = e=>{
    e.stopPropagation();
    if(CAL.target==='modal'){
      serpState.range = {from:CAL.from, to:CAL.to};
      serpState.sampling = CAL.sampling;
      /* чипов дат больше нет: диапазон+частота показывают все свои срезы */
      serpState.dates = sampledModalDates().map(md=>md.id);
      renderSerpModal();
    } else {
      PERIOD = {from:CAL.from, to:CAL.to};
      SAMPLING = CAL.sampling;
      show(cur);
    }
  };
}

/* ================= АДАПТИВНОСТЬ СРЕЗОВ ================= */
/* ширина колонки среза от доступного места: полная → компактная (дельты всегда читаемы)
   → гориз. скролл с компактными ячейками и фикс. левой частью */
function updateScrollShadows(w){
  w.classList.toggle('sc-left', w.scrollLeft > 2);
  w.classList.toggle('sc-right', w.scrollLeft < w.scrollWidth - w.clientWidth - 2);
}
function applySliceDensity(){
  /* только для страницы позиций: на главной своя CSS-адаптивность колонок,
     иначе resize ломает вёрстку (sl-mid/kw-clamp/скролл вправо не для home-grid) */
  if(PAGE !== 'mon'){
    app.classList.remove('sl-mid');
    app.querySelectorAll('.table-wrap').forEach(w=>w.classList.remove('h-scroll','kw-clamp'));
    if(HSB) HSB.classList.remove('on');
    return;
  }
  const wraps = [...app.querySelectorAll('.table-wrap')];
  if(!wraps.length) return;
  const FIXED = 492 + (curV && curV.nowCol ? 150 : 0); /* ключ+тип+serp+частотность с дельтой(+сейчас) */
  /* сброс ДО измерений: kw-clamp/h-scroll зажимают колонку ключа и искажают ширину таблицы */
  app.classList.remove('sl-mid');
  wraps.forEach(w=>w.classList.remove('h-scroll','kw-clamp'));
  const per = (wraps[0].clientWidth - FIXED) / (VIS.size || 1);
  if(per < 62) app.classList.add('sl-mid'); /* тесно: компактные колонки; не влезли — дальше сработает скролл */
  /* чтение scrollWidth после смены классов форсирует пересчёт лэйаута — rAF не нужен
     (и не срабатывает в фоновых вкладках) */
  wraps.forEach(w=>{
    let over = w.scrollWidth > w.clientWidth + 1;
    if(over){ /* шаг 1: зажать колонку ключа — часто этого достаточно */
      w.classList.add('kw-clamp');
      over = w.scrollWidth > w.clientWidth + 1;
    }
    w.classList.toggle('h-scroll', over); /* шаг 2: не помогло — скролл-режим */
    if(over){
      if(!w.__sl){ w.__sl = true; w.addEventListener('scroll', ()=>{ updateScrollShadows(w); if(HSB && HSB.__w===w) HSB.scrollLeft = w.scrollLeft; }, {passive:true}); }
      w.scrollLeft = w.scrollWidth; /* старт: последние срезы на виду */
      updateScrollShadows(w);
    }
  });
  /* фактическая высота thead (меняется в плотных режимах и при времени в датах) */
  const theadEl = app.querySelector('.grid thead');
  if(theadEl) app.style.setProperty('--thead-h', Math.round(theadEl.getBoundingClientRect().height)+'px');
  updateHsb();
}

/* плавающий горизонтальный скроллбар: прикреплён к низу окна, пока таблица на экране.
   Родной скроллбар .table-wrap скрыт — иначе он оказывается под всеми строками, в самом низу */
let HSB = null;
function updateHsb(){
  const w = app.querySelector('.table-wrap.h-scroll');
  if(!HSB){
    HSB = document.createElement('div');
    HSB.className = 'hsb';
    HSB.appendChild(document.createElement('div'));
    HSB.addEventListener('scroll', ()=>{ if(HSB.__w) HSB.__w.scrollLeft = HSB.scrollLeft; }, {passive:true});
    document.body.appendChild(HSB);
  }
  HSB.__w = w;
  if(!w || w.scrollWidth <= w.clientWidth + 1){ HSB.classList.remove('on'); return; }
  const r = w.getBoundingClientRect();
  const visible = r.top < innerHeight - 60 && r.bottom > 120;
  HSB.classList.toggle('on', visible);
  if(!visible) return;
  HSB.style.left = r.left + 'px';
  HSB.style.width = r.width + 'px';
  /* когда низ таблицы поднимается в окно — скроллбар «приземляется» на её нижнюю кромку */
  HSB.style.bottom = Math.max(0, innerHeight - r.bottom) + 'px';
  HSB.firstChild.style.width = w.scrollWidth + 'px';
  HSB.scrollLeft = w.scrollLeft;
}
window.addEventListener('scroll', updateHsb, {passive:true});
let __slT;
window.addEventListener('resize', ()=>{ clearTimeout(__slT); __slT = setTimeout(applySliceDensity, 120); });

/* ================= СТОИМОСТЬ МОНИТОРИНГОВ (только админы) =================

const C_START = '2026-07-01', C_TODAY = '2026-10-09';

/* тарифы за 1 ключ (демо; в продакшене — из «Настроить цены») */
const C_PRICE = {
  'Arsenkin|Позиции':      {cur:'RUB', per:r=> r.ya ? (r.depth>50?0.084:0.042) : 0.021*r.depth/10},
  'Scrapingdog|Позиции':   {cur:'USD', per:r=> r.depth>50?0.0028:0.0014},

};
const usdRate = iso => { const d=(Date.parse(iso)-Date.parse(C_START))/864e5; return Math.round((81.4+Math.sin(d/9)*1.1+d*0.012)*100)/100; };
const p2 = n => String(n).padStart(2,'0');

const COST_RUNS = (()=>{
  const runs = [];
  ALL_PROJECTS.forEach((p,pi)=>{
    const owner = C_PROJ_OWNER[pi] || 'Мария Орлова';
    p.mons.forEach(m=>{
      const h = hashStr('mon'+m.id), ya = m.eng==='ya';

      const eng = (ya?'Yandex':'Google')+' '+(mobile?'Mobile':'Desktop');
      const depth = ya ? 50 : [10,30,50,50,100][h%5];
      const serpParser = ya || h%4===0 ? 'Arsenkin' : 'Scrapingdog';
      const push = (iso, typ, parser)=>{
        const s = hashStr(m.id+iso+typ);
        const keys = Math.max(1, Math.round(m.keys*(1+((s%7)-3)/200)));
        const r = {ya, depth};
        const pr = C_PRICE[parser+'|'+typ];
        const orig = keys*pr.per(r), rate = usdRate(iso);
        const hh = iso===C_TODAY ? 1+s%9 : s%12;
        runs.push({iso, ts:`${iso} ${p2(hh)}:${p2((s>>>4)%60)}:${p2((s>>>10)%60)}`, p, m, owner, team:C_OWNERS[owner],
          eng, ya, typ, depth: typ==='Позиции'?depth:null, keys, parser, cur:pr.cur, orig, rate,
          rub: pr.cur==='USD' ? orig*rate : orig});
      };
      for(let t=Date.parse(C_START); t<=Date.parse(C_TODAY); t+=864e5){
        const dt = new Date(t), iso = dt.toISOString().slice(0,10), dom = dt.getUTCDate(), dow = dt.getUTCDay();

        if(dom===2 && m.keys>=40) push(iso, 'Частотность', ya?'Arsenkin':'DataForSEO');

  return runs.sort((a,b)=> a.ts<b.ts ? 1 : -1);
