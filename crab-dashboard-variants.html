function costRuns(){
  const q = COST.q.trim().toLowerCase();
  return COST_RUNS.filter(r=> r.iso>=COST.from && r.iso<=COST.to
    && C_FILTERS.every(([f])=> !COST.f[f].size || COST.f[f].has(C_FVAL[f](r)))
    && (!q || (r.m.name+' '+r.p.name).toLowerCase().includes(q)));
}
function costGroups(rs, dim){
  const D = C_DIMS[dim], map = new Map();
  rs.forEach(r=>{ const k = String(D.k(r)); if(!map.has(k)) map.set(k, {key:k, first:r, runs:[]}); map.get(k).runs.push(r); });
  const s = COST.sort;
  return [...map.values()].map(g=>Object.assign(g, cAgg(g.runs))).sort((a,b)=>{
    if(s.k==='name'){ const x=D.t(a.first), y=D.t(b.first); return (x<y?-1:x>y?1:0)*-s.dir; }
    return (a[s.k]-b[s.k])*s.dir;
  });
}
function costRunsSorted(rs){
  const s = COST.sort;
  if(s.k==='name') return rs; /* хронология: новые сверху */
  const v = r => s.k==='cost' ? r.rub : s.k==='ppk' ? r.rub/r.keys : s.k==='n' ? 0 : r.keys;
  return [...rs].sort((a,b)=>(v(a)-v(b))*s.dir);
}
/* атрибут группы показываем, только если он одинаков у всех её сборов */
function cUniform(rs, f){ const v = f(rs[0]); return rs.every(r=>f(r)===v) ? v : null; }
const cShort = n => { const [f,l] = n.split(' '); return f[0]+'. '+l; };
function cAttrCells(rs){
  const eng = cUniform(rs, r=>r.eng), typ = cUniform(rs, r=>r.typ), dep = cUniform(rs, r=>r.depth),
        par = cUniform(rs, r=>r.parser), own = cUniform(rs, r=>r.owner);
  return `<td class="c-a">${eng?`<span class="eng">${rs[0].ya?I.ya:I.go}</span>${eng}`:''}</td>
    <td class="c-a">${typ||''}</td><td class="c-a">${dep===null && rs.some(r=>r.depth!=null) ? '' : (dep??'—')}</td>
    <td class="c-a">${par||''}</td><td class="c-a" title="${own?esc(own):''}">${own?esc(cShort(own)):''}</td>`;
}
const cShare = (x)=> `<span class="c-share"><span class="c-sbar"><i style="width:${Math.min(100,x*100).toFixed(1)}%"></i></span><span class="c-pct">${fPct(x)}</span></span>`;
function cNumCells(a, total, run){
  return `<td>${run?'':`<span class="c-num">${fInt(a.n)}</span>`}</td>
    <td>${fInt(a.req)}</td>
    <td class="${a.req?'':'c-z'}">${a.ppk.toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})}</td>
    <td>${cShare(total ? a.cost/total : 0)}</td>`;
}
function costRunRow(r, total, lvl, hidden){
  const a = {n:1, cost:r.rub, req:r.keys, ppk:r.rub/r.keys*1000};
  const orig = r.cur==='USD' ? `<span class="c-orig" title="Курс на ${fmtRu(r.iso)}: ${r.rate.toLocaleString('ru-RU')} ₽">${r.orig.toLocaleString('ru-RU',{minimumFractionDigits:4,maximumFractionDigits:4})} $ × ${r.rate.toLocaleString('ru-RU')}</span>` : '';
  return `<tr class="ct-run ${lvl===1?'l1':''}">
    <td class="c-name"><span class="c-head"><span class="c-ts">${fTs(r.ts)}</span>
      <a class="c-mon" href="${monPath(r.p.id, r.m.id)}" data-pid="${r.p.id}" data-mid="${r.m.id}" title="${esc(r.p.name)} · ${esc(r.m.name)}"><span class="txt">${esc(r.m.name)}</span></a><span class="c-sub c-dom">${esc(r.p.dom)}</span></span></td>
    <td class="c-a"><span class="eng">${r.ya?I.ya:I.go}</span>${r.eng}</td><td class="c-a">${r.typ}</td><td class="c-a">${r.depth??'—'}</td>
    <td class="c-a">${r.parser}</td><td class="c-a" title="${esc(r.owner)} · ${esc(r.team)}">${esc(cShort(r.owner))}</td>
    ${cNumCells(a, total, true)}
    <td class="c-cost"><span class="c-num">${fRub(r.rub)}</span>${orig}</td></tr>`;
}
function costRunsHtml(rs, key, total, lvl){
  const lim = COST.more[key] || 25, list = costRunsSorted(rs);
  let h = list.slice(0, lim).map(r=>costRunRow(r, total, lvl)).join('');
  if(list.length > lim) h += `<tr class="ct-more ${lvl===1?'l1':''}"><td colspan="11"><button data-more="${esc(key)}">Показать ещё ${Math.min(25, list.length-lim)} · всего ${fInt(list.length)} сборов</button></td></tr>`;
  return h;
}
function cGroupRow(cls, key, g, dim, total, open){
  return `<tr class="ct-row ${cls} ${open?'open':''}" data-k="${esc(key)}">
    <td class="c-name"><span class="c-head"><span class="chev">${I.chev}</span>${C_DIMS[dim].h(g.first)}</span></td>
    ${cAttrCells(g.runs)}${cNumCells(g, total)}
    <td class="c-cost"><span class="c-num">${fRub(g.cost)}</span></td></tr>`;
}

function costTableBody(rs, total){
  if(!rs.length) return `<tr><td class="ct-empty" colspan="11">Нет сборов за выбранный период с такими фильтрами</td></tr>`;
  let h = '', prev = null;
  costGroups(rs, COST.g1).forEach((g1,i)=>{
    const k1 = g1.key, o1 = COST.open.has(k1);
    if(i && COST.open.has(prev)) h += `<tr class="ct-gap" aria-hidden="true"><td colspan="11"></td></tr>`;
    prev = k1;
    h += cGroupRow('ct-g1', k1, g1, COST.g1, total, o1);
    if(!o1) return;
    if(!COST.g2){ h += costRunsHtml(g1.runs, k1, total, 1); return; }
    costGroups(g1.runs, COST.g2).forEach(g2=>{
      const k2 = k1+'›'+g2.key, o2 = COST.open.has(k2);
      h += cGroupRow('ct-g2', k2, g2, COST.g2, total, o2);
      if(o2) h += costRunsHtml(g2.runs, k2, total, 2);
    });
  });
  return h;
}
function costHeadHtml(){
  const s = COST.sort;
  const th = (cls, k, l, tip) => `<th class="${cls}"${tip?` title="${tip}"`:''}>${k ? `<button class="c-sort ${s.k===k?'on':''}" data-sort="${k}">${l}${s.k===k?`<span class="ar">${s.dir<0?'▼':'▲'}</span>`:''}</button>` : l}</th>`;
  return `<tr>${th('c-name','name', C_DIMS[COST.g1].l + (COST.g2?' › '+C_DIMS[COST.g2].l:'') + ' › сбор')}
    ${th('c-eng c-a','', 'ПС')}${th('c-typ c-a','', 'Тип')}${th('c-depth c-a','', 'Глубина')}${th('c-parser c-a','', 'Парсер')}${th('c-owner c-a','', 'Владелец')}
    ${th('c-n','n','Мониторингов','Сколько раз мониторинги запускались за выбранный период')}${th('c-req','req','Запросов','Ключи × запуски')}${th('c-ppk','ppk','₽/1000','Стоимость 1000 запросов')}
    ${th('c-share','cost','Доля','Доля от итога за период')}${th('c-cost','cost','Стоимость, ₽')}</tr>`;
}
function updateCostsDyn(){
  const rs = costRuns(), all = cAgg(rs);
  document.getElementById('costHead').innerHTML = costHeadHtml();
  document.getElementById('costBody').innerHTML = costTableBody(rs, all.cost);
  document.getElementById('costFoot').innerHTML = rs.length ? `<tr><td class="c-name">Итого</td><td colspan="5"></td>${cNumCells(all, all.cost)}<td class="c-cost">${fRub(all.cost)}</td></tr>` : '';
  bindCostsTable();
}
function bindCostsTable(){
  app.querySelectorAll('.c-sort').forEach(b=> b.onclick = ()=>{
    const k = b.dataset.sort;
    COST.sort = COST.sort.k===k ? {k, dir:-COST.sort.dir} : {k, dir: k==='name'?1:-1};
    updateCostsDyn();
  });
  app.querySelectorAll('tr.ct-row').forEach(tr=> tr.onclick = ()=>{
    const k = tr.dataset.k;
    COST.open.has(k) ? COST.open.delete(k) : COST.open.add(k);
    updateCostsDyn();
  });
  app.querySelectorAll('[data-more]').forEach(b=> b.onclick = ()=>{ COST.more[b.dataset.more] = (COST.more[b.dataset.more]||25) + 25; updateCostsDyn(); });
  app.querySelectorAll('.c-mon').forEach(a=> a.onclick = e=>{ e.preventDefault(); goMon(a.dataset.pid, a.dataset.mid); window.scrollTo(0,0); });
}

/* выпадашки тулбара */
function cGroupDd(id, n, val, allowNone){
  const opts = Object.entries(C_DIMS).filter(([k])=> !(n===2 && k===COST.g1));
  return `<span class="dd-wrap" id="${id}">
    <button class="f-select"><span class="c-grp-n ${n===2?'n2':''}">${n}</span><b>${val ? C_DIMS[val].l : 'нет'}</b> <span class="car">▼</span></button>
    <div class="dd-panel">
      ${opts.map(([k,d])=>`<button class="dd-item ${k===val?'active':''}" data-g="${k}">${d.l}</button>`).join('')}
      ${allowNone ? `<div class="dd-sep"></div><button class="dd-item ${!val?'active':''}" data-g="">Без 2-го уровня</button>` : ''}
    </div></span>`;
}
function cFilterDd(f, label){
  const vals = f==='team' ? C_TEAMS : [...new Set(COST_RUNS.map(C_FVAL[f]))].sort();
  const set = COST.f[f];
  const cur = !set.size ? 'все' : set.size===1 ? esc([...set][0]) : `${set.size} из ${vals.length}`;
  return `<span class="dd-wrap" id="cf-${f}">
    <button class="f-select">${label}: <b>${cur}</b> <span class="car">▼</span></button>
    <div class="dd-panel c-multi">
      <button class="dd-item c-chk" data-f="${f}" data-v=""><span class="hsel-box ${set.size?'':'checked'}"></span>Все</button>
      <div class="dd-sep"></div>
      ${vals.map(v=>`<button class="dd-item c-chk" data-f="${f}" data-v="${esc(v)}"><span class="hsel-box ${set.has(v)?'checked':''}"></span>${esc(v)}${f==='owner'?`<span class="c-sub">${C_OWNERS[v].replace('Команда ','')}</span>`:''}</button>`).join('')}
    </div></span>`;
}
/* календарь периода: пресеты + 2 месяца */
const C_ISO = d => `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
function cPresets(){
  const t = new Date(C_TODAY+'T12:00'), d = n => { const x = new Date(t); x.setDate(x.getDate()-n); return C_ISO(x); };
  const mStart = C_TODAY.slice(0,8)+'01';
  const pm = new Date(t.getFullYear(), t.getMonth()-1, 1), pmEnd = new Date(t.getFullYear(), t.getMonth(), 0);
  return [['Сегодня', C_TODAY, C_TODAY], ['Вчера', d(1), d(1)], ['Последние 7 дней', d(6), C_TODAY], ['Последние 30 дней', d(29), C_TODAY],
    ['Этот месяц', mStart, C_TODAY], ['Прошлый месяц', C_ISO(pm), C_ISO(pmEnd)], ['3 квартал', '2026-07-01', '2026-09-30'], ['Всё время', C_START, C_TODAY]];
}
function cMonthHtml(y, m){
  const MN = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const c = COST.cal, startDow = (new Date(y,m,1).getDay()+6)%7, dim = new Date(y,m+1,0).getDate();
  let cells = '';
  for(let i=0;i<startDow;i++) cells += '<span class="cal-day other"></span>';
  for(let dd=1; dd<=dim; dd++){
    const iso = `${y}-${p2(m+1)}-${p2(dd)}`;
    const inr = iso>=c.from && iso<=c.to, edge = iso===c.from || iso===c.to;
    cells += `<button class="cal-day ${inr?'inr':''} ${edge?'edge':''}" data-iso="${iso}" ${iso<C_START||iso>C_TODAY?'disabled':''}>${dd}</button>`;
  }
  return `<div class="cal-month"><div class="cal-mt">${MN[m]} ${y}</div>
    <div class="cal-wd">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(w=>`<span>${w}</span>`).join('')}</div>
    <div class="cal-grid">${cells}</div></div>`;
}
function buildCostCal(){
  const pop = document.getElementById('ccPop'), c = COST.cal;
  if(!pop || !c) return;
  const months = [0,1].map(off=>{ let y=c.y, m=c.m+off; y+=Math.floor(m/12); m=((m%12)+12)%12; return cMonthHtml(y,m); }).join('');
  pop.innerHTML = `<div class="cc-body">
      <div class="cc-presets">${cPresets().map(([l,f,t])=>`<button class="dd-item ${c.from===f&&c.to===t?'active':''}" data-f="${f}" data-t="${t}">${l}</button>`).join('')}</div>
      <div class="cc-months"><button class="cal-nav" data-nav="-1">‹</button>${months}<button class="cal-nav" data-nav="1">›</button></div>
    </div>
    <div class="cc-foot"><span class="cc-sel">${fmtRu(c.from)} — ${fmtRu(c.to)}${c.pick?' · выберите конец периода':''}</span><button class="btn primary" id="ccApply">Применить</button></div>`;
  pop.querySelectorAll('.cal-nav').forEach(b=> b.onclick = e=>{ e.stopPropagation(); c.m += +b.dataset.nav; buildCostCal(); });
  pop.querySelectorAll('.cc-presets .dd-item').forEach(b=> b.onclick = e=>{ e.stopPropagation(); c.from = b.dataset.f; c.to = b.dataset.t; c.pick = false;
    const t = new Date(c.to+'T12:00'); c.y = t.getFullYear(); c.m = t.getMonth()-1; /* показать месяц конца периода */
    buildCostCal(); });
  pop.querySelectorAll('.cal-day[data-iso]').forEach(d=> d.onclick = e=>{
    e.stopPropagation();
    const iso = d.dataset.iso;
    if(!c.pick){ c.from = c.to = iso; c.pick = true; }
    else { if(iso<c.from){ c.to = c.from; c.from = iso; } else c.to = iso; c.pick = false; }
    buildCostCal();
  });
  document.getElementById('ccApply').onclick = e=>{
    e.stopPropagation();
    COST.from = c.from; COST.to = c.to; COST.more = {};
    renderCosts();
  };
}
function costCsv(){
  const rows = [['Завершён','Мониторинг','Проект','Команда','Владелец','Поисковая система','Тип','Глубина','Ключи','Парсер','Стоимость по тарифу','Валюта','Курс','Стоимость, ₽']];
  costRuns().forEach(r=> rows.push([r.ts, r.m.name, r.p.name, r.team, r.owner, r.eng, r.typ, r.depth??'', r.keys, r.parser,
    r.orig.toFixed(r.cur==='USD'?4:2).replace('.',','), r.cur, r.cur==='USD'?String(r.rate).replace('.',','):'', r.rub.toFixed(2).replace('.',',')]));
  const csv = '﻿' + rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  a.download = `crab-costs_${COST.from}_${COST.to}.csv`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

function goCosts(){
  CUR_MON = null; PAGE = 'costs';
  if(CAN_ROUTE && location.pathname !== BASE+'costs') history.pushState({}, '', BASE+'costs');
  renderCosts();
  window.scrollTo(0,0);
}

        <span class="f-input">${I.search}<input id="costQ" placeholder="Мониторинг или проект" aria-label="Поиск по мониторингу или проекту" value="${esc(COST.q)}"></span>
        ${C_FILTERS.map(([f,l])=>cFilterDd(f,l)).join('')}

  /* дропдауны: открытие/закрытие */
  app.querySelectorAll('.dd-wrap > .f-select, .dd-wrap > .period').forEach(btn=> btn.onclick = e=>{
    e.stopPropagation();

    if(tops.some(k=>COST.open.has(k))) COST.open.clear(); else tops.forEach(k=>COST.open.add(k));
    updateCostsDyn();

/* ================= ДАШБОРД ПРОЕКТА =================
   <base>/projects/<ID_PROJECT> — обзор проекта: мониторинги, трафик (Яндекс Метрика, GA4),
   поиск (Яндекс Вебмастер, Google Search Console), лог проекта и команда.
   Прототип: ряды трафика генерируются детерминированно от домена (pjRng/pjSeries), «сегодня» — PJ_TODAY.
   Подключение источников (демо): Яндекс в мониторингах → Метрика + Вебмастер (Метрика ещё у доменов .ru),
   Google → GA4 + GSC; у sandbox-test.site — отозванный доступ к GSC. В продакшене — OAuth-интеграции
   проекта и данные с бэка; GSC отдаёт данные с задержкой ~2 дня, Вебмастер ~3 дня. */
const PJ_TODAY = '2026-07-19';
const PJ_DAYS = 735; /* текущий период + предыдущий для сравнения даже при «12 месяцев» и задержке данных */
const PJ_PERIODS = [[7,'7 дней'],[30,'30 дней'],[90,'90 дней'],[364,'12 месяцев']];
const PJ = {period:30, gsc:'clicks', wm:'clicks', off:{metrika:new Set(), ga:new Set()}, qtab:{gsc:'q', wm:'q'}, logF:'all', logAll:false};

const fN = n => Math.round(n).toLocaleString('ru-RU');
const fD = (n, k=1) => n.toLocaleString('ru-RU', {minimumFractionDigits:k, maximumFractionDigits:k});
const fAx = n => { const a = Math.abs(n);
  if(a>=1e6) return fD(n/1e6, a>=1e7?0:1).replace(',0','')+'M';
  if(a>=1e4) return Math.round(n/1e3)+'k';
  if(a>=1e3) return fD(n/1e3, 1).replace(',0','')+'k';
  return String(Math.round(n*10)/10).replace('.',','); };
const fDur = s => { s = Math.round(s); return `${Math.floor(s/60)}:${p2(s%60)}`; };
const sumA = a => a.reduce((s,v)=>s+v, 0);
const wAvg = (a, w) => { let s=0, t=0; for(let i=0;i<a.length;i++){ s+=a[i]*w[i]; t+=w[i]; } return t ? s/t : 0; };
const PJ_DATES = (()=>{ const end = new Date(PJ_TODAY+'T12:00:00'), out = [];
  for(let i=PJ_DAYS-1;i>=0;i--){ const d = new Date(end); d.setDate(end.getDate()-i); out.push(d); } return out; })();
const pjAgo = n => { const d = new Date(PJ_TODAY+'T12:00:00'); d.setDate(d.getDate()-n); return d; };

/* ---------- детерминированные демо-ряды ---------- */
function pjRng(seed){ let a = seed>>>0; return ()=>{ a = (a + 0x6D2B79F5)|0; let t = Math.imul(a ^ a>>>15, 1|a); t = (t + Math.imul(t ^ t>>>7, 61|t)) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; }; }
/* дневной ряд объёма: уровень «будний день сейчас» × годовой тренд × сезон × будни/выходные × шум */
function pjSeries(key, base){
  const r = pjRng(hashStr(key)), growth = (r()-.3)*.5, wkend = .6 + r()*.12;
  let walk = 0;
  return PJ_DATES.map((d,i)=>{
    walk = walk*.92 + (r()-.5)*.06;
    const t = (i-(PJ_DAYS-1))/365, dow = d.getDay(), we = (dow===0||dow===6) ? wkend : 1;
    const doy = (d - new Date(d.getFullYear(),0,0))/864e5, s = 1 + .08*Math.sin(2*Math.PI*(doy-100)/365);
    return Math.max(0, base*(1+growth*t)*s*we*(1+walk+(r()-.5)*.14));
  });
}
/* дневной ряд уровня (доля, CTR, позиция, отказы): медленный дрейф вокруг mid */
function pjLevel(key, mid, spread){
  const r = pjRng(hashStr(key)); let w = 0;
  return PJ_DATES.map(()=>{ w = Math.max(-spread, Math.min(spread, w*.95 + (r()-.5)*spread*.22)); return mid*(1 + w + (r()-.5)*spread*.35); });
}
/* ступенчатый ряд (ИКС, страниц в поиске): обновления раз в every дней, в прошлом — ниже */
function pjSteps(key, now, every, step, round){
  const r = pjRng(hashStr(key)), out = new Array(PJ_DAYS);
  let v = now, k = every[0] + Math.floor(r()*(every[1]-every[0]));
  for(let i=PJ_DAYS-1;i>=0;i--){
    out[i] = v;
    if(--k <= 0){ k = every[0] + Math.floor(r()*(every[1]-every[0])); v = Math.max(round, Math.round((v - (r()-.3)*step)/round)*round); }
  }
  return out;
}
/* окно периода: текущее и предыдущее такой же длины (lag — задержка данных источника) */
function pjWin(arr, lag=0){ const P = PJ.period, end = PJ_DAYS - lag; return {cur: arr.slice(end-P, end), prev: arr.slice(end-2*P, end-P)}; }
/* точки графика: до 90 дней — по дням, 12 месяцев — по неделям (sum / avg с весами / last) */
function pjPts(arr, lag, agg, w){
  const P = PJ.period, end = PJ_DAYS - lag;
  const ds = PJ_DATES.slice(end-P, end), vs = arr.slice(end-P, end), ws = w ? w.slice(end-P, end) : null;
  if(P <= 90) return {x: ds.map(d=>({d0:d, d1:d})), v: vs};
  const x = [], v = [];
  for(let i=0;i<P;i+=7){
    const dd = ds.slice(i,i+7), vv = vs.slice(i,i+7);
    x.push({d0:dd[0], d1:dd[dd.length-1]});
    v.push(agg==='sum' ? sumA(vv) : agg==='last' ? vv[vv.length-1] : ws ? wAvg(vv, ws.slice(i,i+7)) : sumA(vv)/vv.length);
  }
  return {x, v};
}

/* дельта к предыдущему периоду: стрелка — направление, цвет — хорошо/плохо (invert: меньше = лучше) */
function pjDelta(cur, prev, o={}){
  if(prev==null || !isFinite(prev) || (prev===0 && !o.abs && !o.pp)) return `<span class="k-d flat">нет данных за прошлый период</span>`;
  let d, txt;
  if(o.pp){ d = (cur-prev)*100; txt = fD(Math.abs(d))+' п.п.'; }
  else if(o.abs){ d = cur-prev; txt = o.dec ? fD(Math.abs(d), o.dec) : fN(Math.abs(d)); }
  else { d = (cur-prev)/prev*100; txt = fD(Math.abs(d))+' %'; }
  if(Math.abs(d) < (o.abs && !o.dec ? .5 : .05)) return `<span class="k-d flat">без изменений</span>`;
  const good = o.invert ? d<0 : d>0;

/* ---------- модуль «Мониторинги» ---------- */
const MT_SEG = [['1–3','--t3-heat'],['4–10','--t10-heat'],['11–20','--t20-heat'],['21–50','--t50-heat'],['51–100','--t100-heat'],['вне ТОП-100','--border-strong']];
const MT_ST = {done:'Снят сегодня', idle:'Ждёт среза', queue:'В очереди', error:'Ошибка'};
/* bands главной: [ТОП 1–3, 1–10 (включая 1–3), 11–20, 21–50, 51–100] → непересекающиеся сегменты + вне ТОП-100 */
function mtSegs(m){ const b = m.bands; return [b[0], Math.max(0, b[1]-b[0]), b[2], b[3], b[4], Math.max(0, m.keys-(b[1]+b[2]+b[3]+b[4]))]; }
function mtVis(m){ /* видимость (доля ТОП-10) за 8 срезов: два последних — из данных, раньше — демо */
  const r = pjRng(hashStr('vis|'+m.id));
  const now = m.keys ? m.bands[1]/m.keys*100 : 0, prev = m.keys ? (m.bands[1]-m.deltas[1])/m.keys*100 : 0;
  const out = [now, prev]; let v = prev;
  for(let i=0;i<6;i++){ v = Math.max(0, v + (r()-.5)*Math.max(1.2, now*.12)); out.push(v); }
  return out.reverse();
}
function mtSpark(vals){
  const w = 64, h = 20, mn = Math.min(...vals), mx = Math.max(...vals), rg = (mx-mn) || 1;
  const pts = vals.map((v,i)=>[2 + i/(vals.length-1)*(w-6), h-3-(v-mn)/rg*(h-6)]);
  const L = pts[pts.length-1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="var(--ch-1)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${L[0].toFixed(1)}" cy="${L[1].toFixed(1)}" r="2.5" fill="var(--ch-1)"/></svg>`;
}
const mtNum = (n, d) => `<span class="mt-v ${n?'':'z'}">${fN(n)}</span>${d ? `<span class="mt-d ${d>0?'up':'down'}">${d>0?'+':'−'}${Math.abs(d)}</span>` : ''}`;
function pjMonsHtml(M){
  const p = M.p, kw = n => aiPl(n, ['ключ','ключа','ключей']);
  const rows = p.mons.map(m=>{
    const seg = mtSegs(m), tot = Math.max(1, sumA(seg));
    const dist = seg.map((n,i)=> n ? `<i style="--c:var(${MT_SEG[i][1]});flex:${n}" data-ptip="${MT_SEG[i][0]}: ${fN(n)} ${kw(n)} · ${fD(n/tot*100, n/tot<.1?1:0)} %"></i>` : '').join('');
    const vis = mtVis(m), vN = vis[vis.length-1], vD = vN - vis[vis.length-2];
    const vDh = Math.abs(vD) >= .05 ? `<span class="mt-d ${vD>0?'up':'down'}" title="п.п. к прошлому срезу">${vD>0?'+':'−'}${fD(Math.abs(vD))}</span>` : '';
    return `<tr tabindex="0" data-pid="${p.id}" data-mid="${m.id}" aria-label="Открыть мониторинг ${aiA(m.name)}">
      <td><div class="mt-name"><span class="eng ${m.eng}" title="${m.eng==='ya'?'Яндекс':'Google'}">${m.eng==='ya'?I.ya:I.go}</span><span class="flag-ico" title="Регион мониторинга">${I.flags[m.flag]||''}</span><span class="mt-tx"><span class="mt-n">${esc(m.name)}</span><span class="mt-s">${m.sched} · следующий ${m.next}</span></span></div></td>
      <td><span class="mt-st" title="${ST_TIP[m.st]}"><span class="hdot ${m.st}"></span>${MT_ST[m.st]}</span></td>
      <td class="num"><span class="mt-v ${m.keys?'':'z'}">${fN(m.keys)}</span></td>
      <td><div class="mt-dist" role="img" aria-label="${aiA(seg.map((n,i)=>`${MT_SEG[i][0]}: ${n}`).join(', '))}">${dist || '<i style="--c:var(--border-strong);flex:1"></i>'}</div></td>
      <td class="num">${mtNum(m.bands[0], m.deltas[0])}</td>
      <td class="num">${mtNum(m.bands[1], m.deltas[1])}</td>
      <td><span class="mt-vis" title="Видимость: доля ключей в ТОП-10, последние 8 срезов"><span class="mt-v ${vN?'':'z'}">${fD(vN, vN>0 && vN<10 ? 1 : 0)} %</span>${vDh}${mtSpark(vis)}</span></td>
      <td class="mt-go" aria-hidden="true">›</td>
    </tr>`;
  }).join('');
  return `<section class="pj-card" id="pjm-mons">
    <header class="pj-ch"><div class="pj-ct"><div class="pj-tl"><h2>Мониторинги</h2><span class="pj-cnt">${p.mons.length}</span></div><span class="pj-sub">Последний срез каждого мониторинга · изменения — к предыдущему срезу</span></div>
      <div class="mt-legend" aria-label="Цвета распределения позиций">${MT_SEG.map(([l,c])=>`<span><i style="--c:var(${c})"></i>${l}</span>`).join('')}</div>
    </header>
    <div class="mt-wrap"><table class="pj-mt">
      <thead><tr><th>Мониторинг</th><th>Статус</th><th class="num">Ключей</th><th style="width:24%">Распределение позиций</th><th class="num">ТОП-3</th><th class="num">ТОП-10</th><th>Видимость</th><th aria-hidden="true"></th></tr></thead>
      <tbody>${rows}</tbody></table></div>
  </section>`;
}

/* ---------- таблица запросов / страниц (GSC и Вебмастер) ---------- */
function pjQRows(M, mod){
  const S = M[mod], tab = PJ.qtab[mod], tot = sumA(pjWin(S.clicks, S.lag).cur);
  const r = pjRng(hashStr(mod+tab+'|'+M.p.dom));
  const items = tab==='q' ? M.queries : M.pages.map((u,i)=>({q:u, pos:2 + i*1.7 + r()*3}));
  return items.slice(0,5).map((it,i)=>{
    const pos = Math.max(1, it.pos*(mod==='gsc' ? 1.15 : 1) + (r()-.5)*.8);
    const clicks = tot*(tab==='q' ? .2 : .3)/Math.pow(i+1, .85);
    return {q:it.q, clicks, impr: clicks/Math.min(.42, .32/Math.pow(pos, .95)), pos};
  });
}

/* ---------- график: SVG по фактической ширине, перекрестие + тултип, клавиатура ---------- */
function pjNice(lo, hi, n){
  if(hi<=lo) hi = lo + 1;
  const raw = (hi-lo)/n, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw/mag;
  const step = (f<=1 ? 1 : f<=2 ? 2 : f<=2.5 ? 2.5 : f<=5 ? 5 : 10)*mag;
  return {min: Math.floor(lo/step)*step, max: Math.ceil(hi/step)*step, step};
}
function pjXLabels(x, pw){
  const n = x.length, out = [];
  if(x[0].d0 !== x[0].d1){ /* по неделям — подпись месяца на первой неделе месяца */
    let lastM = x[0].d1.getMonth(), lastX = -1e9;
    x.forEach((b,i)=>{ const m = b.d1.getMonth(); if(m!==lastM){ lastM = m; const px = i/(n-1)*pw; if(px-lastX >= 34){ out.push({i, t:MON_N[m]}); lastX = px; } } });
    return out;
  }
  const step = Math.max(1, Math.ceil(n/Math.max(2, Math.floor(pw/(n<=7 ? 52 : 60)))));
  for(let i=n-1;i>=0;i-=step){ const d = x[i].d0; out.push({i, t: n<=7 ? `${WD_S[d.getDay()]}, ${d.getDate()}` : `${d.getDate()} ${MON_S[d.getMonth()]}`}); }
  return out;
}
function pjXTip(b){
  const a = b.d0, z = b.d1;
  if(a===z) return `${WD_S[a.getDay()]}, ${pjDM(a)} ${a.getFullYear()}`;
  return a.getMonth()===z.getMonth() ? `${a.getDate()}–${z.getDate()} ${MON_G[z.getMonth()]}` : `${pjDM(a)} – ${pjDM(z)}`;
}
function pjDraw(el){
  const C = PJ_CH[el.dataset.ch]; if(!C) return;
  const W = el.clientWidth, H = el.clientHeight; if(!W || !H) return;
  el.__w = W;
  const off = C.mod ? PJ.off[C.mod] : null;
  const S = C.series.filter(s=>!off || !off.has(s.key)), n = C.x.length;
  const all = S.flatMap(s=>s.v);
  let lo = C.fit ? Math.min(...all) : 0, hi = Math.max(...all, 0);
  if(C.fit){ const pad = (hi-lo)*.15 || Math.max(1, hi*.05); lo = Math.max(0, lo-pad); hi += pad; }
  const tk = pjNice(lo, hi, 4), ticks = [];
  for(let v=tk.min; v<=tk.max + tk.step/2; v+=tk.step) ticks.push(v);
  const labels = ticks.map(C.ax);
  const L = 12 + Math.max(...labels.map(s=>s.length))*6.4, R = 8, T = 8, B = 22, pw = W-L-R, ph = H-T-B;
  const X = i => L + (n<2 ? pw/2 : i*pw/(n-1));
  const Y = v => { const k = (v-tk.min)/(tk.max-tk.min); return C.inv ? T + k*ph : T + ph - k*ph; };
  let g = '';
  ticks.forEach((v,j)=>{ const y = Y(v).toFixed(1);
    g += `<line class="gl${!C.fit && j===0 ? ' base' : ''}" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="tl" x="${(L-8).toFixed(1)}" y="${(+y+3.8).toFixed(1)}" text-anchor="end">${labels[j]}</text>`; });
  pjXLabels(C.x, pw).forEach(o=>{ g += `<text class="tl" x="${X(o.i).toFixed(1)}" y="${H-5}" text-anchor="${o.i===n-1 ? 'end' : o.i===0 ? 'start' : 'middle'}">${o.t}</text>`; });
  S.forEach(s=>{
    const pts = s.v.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' L');
    if(s.area && !C.inv) g += `<path class="ar" style="fill:var(${s.c})" d="M${X(0).toFixed(1)},${Y(tk.min).toFixed(1)} L${pts} L${X(n-1).toFixed(1)},${Y(tk.min).toFixed(1)} Z"/>`;
    g += `<path class="ln" style="stroke:var(${s.c})" d="M${pts}"/>`;
  });
  g += `<g class="hv" style="display:none"><line class="xh" y1="${T}" y2="${T+ph}"/>${S.map(s=>`<circle class="pt" r="4" style="fill:var(${s.c})"/>`).join('')}</g><rect class="hit" x="${L}" y="0" width="${pw}" height="${T+ph}"/>`;
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">${g}</svg><div class="pj-tip"></div>`;
  const hv = el.querySelector('.hv'), tip = el.querySelector('.pj-tip'), xh = hv.querySelector('.xh'), dots = hv.querySelectorAll('.pt');
  const showI = i=>{
    i = Math.max(0, Math.min(n-1, i)); el.__i = i;
    const x = X(i).toFixed(1);
    hv.style.display = ''; xh.setAttribute('x1', x); xh.setAttribute('x2', x);
    S.forEach((s,j)=>{ dots[j].setAttribute('cx', x); dots[j].setAttribute('cy', Y(s.v[i]).toFixed(1)); });
    tip.innerHTML = `<div class="tt-d">${pjXTip(C.x[i])}</div>` + S.map(s=>`<div class="tt-r"><span class="sw" style="--c:var(${s.c})"></span>${s.name}<b>${C.fmt(s.v[i])}</b></div>`).join('');
    tip.classList.add('on');
    const tw = tip.offsetWidth; let tx = +x + 14; if(tx + tw > W) tx = +x - 14 - tw;
    tip.style.left = Math.max(0, tx)+'px';
  };
  const hide = ()=>{ hv.style.display = 'none'; tip.classList.remove('on'); };
  const hit = el.querySelector('.hit');
  hit.addEventListener('pointermove', e=>{ const rc = el.getBoundingClientRect(); showI(Math.round((e.clientX - rc.left - L)/pw*(n-1))); });
  hit.addEventListener('pointerleave', ()=>{ if(document.activeElement!==el) hide(); });
  el.onfocus = ()=> showI(el.__i!=null ? el.__i : n-1);
  el.onblur = hide;
  el.onkeydown = e=>{
    if(e.key==='ArrowLeft' || e.key==='ArrowRight'){ e.preventDefault(); showI((el.__i!=null ? el.__i : n-1) + (e.key==='ArrowRight' ? 1 : -1)); }
    else if(e.key==='Home' || e.key==='End'){ e.preventDefault(); showI(e.key==='Home' ? 0 : n-1); }
  };
}
function pjObserve(){
  if(!('ResizeObserver' in window)) return;
  if(!PJ_RO) PJ_RO = new ResizeObserver(es=> es.forEach(e=>{ const el = e.target; if(el.isConnected && Math.abs(el.clientWidth - (el.__w||0)) > 1) pjDraw(el); }));
  app.querySelectorAll('.pj-chart').forEach(el=>{ if(!el.__obs){ el.__obs = 1; PJ_RO.observe(el); } });
}

  app.querySelectorAll('.nav-item[data-nav="home"], .crumb-proj').forEach(b=> b.onclick = toProj);
  /* collapse groups */
  app.querySelectorAll('.group-row').forEach(gr=>{
    gr.style.cursor='pointer';
    gr.onclick = e=>{
      if(e.target.closest('.gurl')||e.target.closest('.gact')) return;
      gr.classList.toggle('collapsed');
      const gi = gr.dataset.group;
      const on = gr.classList.contains('collapsed');
      app.querySelectorAll(`tr.kw-row[data-parent="${gi}"]`).forEach(r=>r.classList.toggle('g-hide',on));
    };
  });
  /* collapse supergroups */
  app.querySelectorAll('.super-row').forEach(sr=>{
    sr.style.cursor='pointer';
    sr.onclick = ()=>{
      sr.classList.toggle('collapsed');
      const si = sr.dataset.sid;
      const on = sr.classList.contains('collapsed');
      app.querySelectorAll(`tr[data-super="${si}"]`).forEach(r=>r.classList.toggle('s-hide',on));
    };
  });
  /* дропдауны тулбара: подсветка, срезы, период */
  app.querySelectorAll('.dd-wrap > .f-select, .dd-wrap > .period').forEach(btn=>{
    btn.onclick = e=>{
      e.stopPropagation();
      const w = btn.parentElement;
      const was = w.classList.contains('open');
      document.querySelectorAll('.dd-wrap.open, .toc-wrap.open').forEach(x=>x.classList.remove('open'));
      if(!was){ w.classList.add('open'); if(w.id==='calWrap'){ openCal(); placeCalPop(w); } }
    };
  });
  app.querySelectorAll('#hlWrap .dd-item').forEach(b=> b.onclick = ()=>{
    const p = HL_PRESETS.find(x=>x.label===b.dataset.hl);
    HL = p.arr; HL_LABEL = p.label;
    show(cur);
  });
  app.querySelectorAll('#slWrap .dd-item').forEach(b=> b.onclick = ()=>{ SLICES_N = +b.dataset.n; show(cur); });
  /* оглавление групп */
  const tocWrap = app.querySelector('.toc-wrap');
  if(tocWrap){
    const searchEl = tocWrap.querySelector('#tocSearch');
    const filterToc = q=>{ tocWrap.querySelectorAll('.toc-item').forEach(it=>{
      it.style.display = it.textContent.toLowerCase().includes(q)?'':'none'; }); };
    tocWrap.querySelector('#tocBtn').onclick = e=>{
      e.stopPropagation();
      tocWrap.classList.toggle('open');
      if(tocWrap.classList.contains('open')){ searchEl.value=''; filterToc(''); searchEl.focus(); }
    };
    searchEl.oninput = e=> filterToc(e.target.value.toLowerCase());
    tocWrap.querySelectorAll('.toc-item').forEach(it=>{
      it.onclick = ()=>{
        const gr = app.querySelector(`tr.group-row[data-group="${it.dataset.goto}"]`);
        if(!gr) return;
        const srow = app.querySelector(`tr.super-row[data-sid="${gr.dataset.super}"]`);
        if(srow && srow.classList.contains('collapsed')) srow.click();
        if(gr.classList.contains('collapsed')) gr.click();
        tocWrap.classList.remove('open');
        gr.scrollIntoView({behavior:'smooth', block:'center'});
        gr.classList.remove('flash'); void gr.offsetWidth; gr.classList.add('flash');
      };
    });
  }
  /* вкладки видов: фильтрация ключей, пустые группы/супергруппы скрываются */
  const applyView = view=>{
    app.querySelectorAll('.vt[data-view]').forEach(t=>t.classList.toggle('active', t.dataset.view===view));
    app.querySelectorAll('tr.kw-row').forEach(r=>{
      const ok = view==='all' || (r.dataset.cats||'').split(' ').includes(view);
      r.classList.toggle('v-hide', !ok);
    });
    app.querySelectorAll('tr.group-row').forEach(gr=>{
      const any = [...app.querySelectorAll(`tr.kw-row[data-parent="${gr.dataset.group}"]`)].some(r=>!r.classList.contains('v-hide'));
      gr.classList.toggle('v-hide', !any);
      const gap = gr.previousElementSibling;
      if(gap && gap.classList.contains('group-gap')) gap.classList.toggle('v-hide', !any);
    });
    app.querySelectorAll('tr.super-row').forEach(sr=>{
      const any = [...app.querySelectorAll(`tr.group-row[data-super="${sr.dataset.sid}"]`)].some(r=>!r.classList.contains('v-hide'));
      sr.classList.toggle('v-hide', !any);
    });
  };
  app.querySelectorAll('.vt[data-view]').forEach(t=> t.onclick = ()=> applyView(t.dataset.view));
  /* правка URL группы по карандашу */
  app.querySelectorAll('.gedit').forEach(b=>{
    b.onclick = e=>{
      e.stopPropagation();
      const t = b.closest('.group-head').querySelector('.gurl-t');
      t.contentEditable = 'true';
      t.focus();
      const sel = getSelection(), r = document.createRange();
      r.selectNodeContents(t); sel.removeAllRanges(); sel.addRange(r);
      t.onblur = ()=>{ t.contentEditable = 'false'; };
      t.onkeydown = ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); t.blur(); } };
    };
  });
  /* тумблеры: свернуть/развернуть все группы и все супергруппы */
  const gBtn = app.querySelector('#foldGroupsBtn'), sBtn = app.querySelector('#foldSupersBtn');
  if(gBtn) gBtn.onclick = ()=>{
    const collapse = !!app.querySelector('tr.group-row:not(.collapsed)');
    app.querySelectorAll('tr.group-row').forEach(gr=>gr.classList.toggle('collapsed', collapse));
    app.querySelectorAll('tr.kw-row').forEach(r=>r.classList.toggle('g-hide', collapse));
  };
  if(sBtn) sBtn.onclick = ()=>{
    const collapse = !!app.querySelector('tr.super-row:not(.collapsed)');
    app.querySelectorAll('tr.super-row').forEach(sr=>sr.classList.toggle('collapsed', collapse));
    app.querySelectorAll('tr[data-super]').forEach(r=>r.classList.toggle('s-hide', collapse));
  };
  /* collapse modules (Zoho-вариант) */
  app.querySelectorAll('.module-head').forEach(mh=>{
    mh.onclick = e=>{
      if(e.target.closest('.gact')) return;
      mh.parentElement.classList.toggle('collapsed');
    };
  });
  /* serp cells: в варианте с панелью — обновляем панель, иначе открываем drawer */
  app.querySelectorAll('.cell[data-serp]').forEach(c=>{
    c.onclick = ()=>{
      const [gi,ki,di] = c.dataset.serp.split(':').map(Number);
      if(v.detail) renderDetail(gi,ki,di); else openSerp(gi,ki,di);
    };
  });
  /* ключ: клик по тексту или иконке копирования — в буфер; иконка ПС — ссылка на поиск */
  app.querySelectorAll('.kw-cell').forEach(cell=>{
    const kw = cell.dataset.kw, btn = cell.querySelector('.kw-copy');
    if(!btn) return;
    const doCopy = e=>{
      e.stopPropagation();
      copyText(kw);
      btn.classList.add('copied'); btn.innerHTML = I.check;
      clearTimeout(btn.__t);
      btn.__t = setTimeout(()=>{ btn.classList.remove('copied'); btn.innerHTML = I.copy; }, 1200);
    };
    cell.querySelector('.txt').onclick = doCopy;
    btn.onclick = doCopy;
  });
  /* ассистент: «Спросить о ключе» в строке и правый клик по ячейке позиции */
  app.querySelectorAll('.kw-ask').forEach(b=> b.onclick = e=>{
    e.stopPropagation();
    const [gi,ki] = b.dataset.ask.split(':').map(Number);
    aiAskAbout(gi, ki, null);
  });
  app.querySelectorAll('.cell[data-serp]').forEach(c=> c.oncontextmenu = e=>{
    e.preventDefault();
    const [gi,ki,di] = c.dataset.serp.split(':').map(Number);
    aiShowCellMenu(gi, ki, di, e.clientX, e.clientY);
  });
  /* «Позиции конкурента» — модалка с адресом сайта */
  const cb = app.querySelector('#compBtn');
  if(cb) cb.onclick = openComp;
  /* переключатель вида частотности в шапке колонки */
  app.querySelectorAll('.ws-seg button').forEach(b=> b.onclick = e=>{
    e.stopPropagation();
    if(WS_MODE!==b.dataset.m){ WS_MODE = b.dataset.m; show(cur); }
  });
  /* чип «N URL» у релевантного URL: попап со всеми URL и актуальными позициями */
  app.querySelectorAll('.ku-btn').forEach(b=> b.onclick = e=>{
    e.stopPropagation();
    const [gi,ki] = b.dataset.ku.split(':').map(Number);
    const was = kuPop && kuPop.classList.contains('open');
    closeKuPop();
    if(!was || kuPop.__src!==b){ showKuPop(gi, ki, b.getBoundingClientRect()); kuPop.__src = b; }
  });
  /* иконка ⇅ смены релевантной страницы: попап было/стало */
  app.querySelectorAll('.swap[data-swap]').forEach(s=> s.onclick = e=>{
    e.stopPropagation();
    const [gi,ki,di] = s.dataset.swap.split(':').map(Number);
    showSwapPop(gi, ki, di, s.getBoundingClientRect());
  });
  /* панель деталей: выбор ключа кликом по строке */
  if(v.detail){
    app.querySelectorAll('.kw-row').forEach(r=>{
      r.style.cursor='pointer';
      r.onclick = e=>{
        if(e.target.closest('.cell')||e.target.closest('.rel-url')) return;
        const [g,k] = r.dataset.key.split(':').map(Number);
        renderDetail(g,k,DATES.length-1);
      };
    });
    renderDetail(0,0,DATES.length-1);
  }
  closeSerp();
}

/* ---------- утилиты ---------- */
const aiA = s => esc(String(s)).replace(/"/g,'&quot;');
const aiIsN = v => typeof v==='number';
const aiPl = (n, f) => { const a = Math.abs(n)%100, b = a%10; return f[(a>10&&a<20) ? 2 : b===1 ? 0 : (b>=2&&b<=4) ? 1 : 2]; };
const aiModel = id => AI_MODELS.find(m=>m.id===id) || AI_MODELS[0];
const aiEng = e => `<span class="eng">${e==='go'?I.go:I.ya}</span>`;

const aiSleep = ms => new Promise(r=>setTimeout(r, ms));
function aiMonOf(p, m){ return {pid:p.id, mid:m.id, name:m.name, dom:p.dom, eng:m.eng}; }
/* демо-мониторинг страницы без роутинга (file://) — тот же, что «Блог DL» на главной */

})();
function aiPageMon(){

}
const aiSameMon = (a, b) => !!(a && b) && a.dom===b.dom && String(a.mid)===String(b.mid);

/* ---------- данные для ответов (в продакшене — функции бэкенда) ---------- */
function aiVis(){ return [...VIS].sort((a,b)=>a-b); }
/* строки таблицы (считаем как вкладки «Все ключи / Упавшие / ТОП-10» — цифры сходятся с интерфейсом) */
function aiRows(){ const out = []; GROUPS.forEach((g,gi)=>g.keys.forEach((k,ki)=>out.push({k, g, gi, ki}))); return out; }
/* в списках — без повторов: дубли групп делят одни объекты ключей */
const aiUniq = list => { const s = new Set(); return list.filter(r=>{ const k = (r.x||r).k; if(s.has(k)) return false; s.add(k); return true; }); };
function aiKeys(){ return aiUniq(aiRows()); }
/* предыдущий показанный срез с числовой позицией — как posDelta в таблице */
function aiPrevNum(k, i){ for(let j=i-1;j>=0;j--){ if(VIS.has(j) && aiIsN(k.pos[j])) return j; } return -1; }
function aiKw(x){ return `<button class="ai-kw" data-key="${x.gi}:${x.ki}" title="Показать ключ в таблице"><span>${esc(x.k.kw)}</span>${AI_I.target}</button>`; }
function aiGrp(g, gi){ return `<button class="ai-grp" data-group="${gi}" title="Показать группу в таблице"><span>${esc(g.name)}</span></button>`; }
function aiPosB(p, gi, ki, di){
  if(!aiIsN(p)) return `<span class="ai-pos none" title="${p==null?'Вне ТОП-100':'Позиция не снята'}">${p==null?'—':'н/д'}</span>`;
  return `<button class="ai-pos ${band(p)||''}" data-serp="${gi}:${ki}:${di}" title="${DATES[di].d}: позиция ${p} — открыть ТОП выдачи">${p}</button>`;
}
function aiDl(a, b){ /* изменение позиции: меньше — лучше */
  if(!aiIsN(a) || !aiIsN(b) || a===b) return '';
  const d = a-b;
  return `<span class="ai-d ${d>0?'up':'down'}">${d>0?'+':'−'}${Math.abs(d)}</span>`;
}
function aiDc(prev, cur){ /* изменение количества: больше — лучше */
  const d = cur-prev;
  return d ? `<span class="ai-d ${d>0?'up':'down'}">${d>0?'+':'−'}${Math.abs(d)}</span>` : '';
}
const aiTbl = (head, rows) => `<table class="ai-tbl"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`;
const aiIsugs = (list, ctx) => `<div class="ai-isugs">${list.map(q=>`<button class="ai-q" data-q="${aiA(q)}"${ctx?` data-ctx="${aiA(JSON.stringify(ctx))}"`:''}>${esc(q)}</button>`).join('')}</div>`;
function aiFindKey(t){ return aiKeys().filter(x=>t.includes(x.k.kw.toLowerCase())).sort((a,b)=>b.k.kw.length-a.k.kw.length)[0] || null; }

function aiAnsLast(mon){
  const i = LASTV, j = prevVis(i);
  if(j<0) return {steps:[`Сводка мониторинга «${mon.name}»`], html:`<p>В показанном периоде один срез — сравнивать не с чем. Увеличьте число срезов в тулбаре.</p>`};
  const rows = aiRows().map(x=>{ const pj = aiPrevNum(x.k, i); return {x, pj, a:pj>=0?x.k.pos[pj]:null, b:x.k.pos[i], s:x.k.pos[j]}; });
  const both = rows.filter(r=>aiIsN(r.a) && aiIsN(r.b));
  const up = both.filter(r=>r.b<r.a).sort((p,q)=>(q.a-q.b)-(p.a-p.b));
  const dn = both.filter(r=>r.b>r.a).sort((p,q)=>(q.b-q.a)-(p.b-p.a));
  const in10 = p => aiIsN(p) && p<=10;
  const into = rows.filter(r=>!in10(r.s) && in10(r.b)).length, out = rows.filter(r=>in10(r.s) && !in10(r.b)).length;
  const sw = aiUniq(rows.filter(r=>(r.x.k.swap||[]).includes(i)));

  if(!key && /(этому|этот|этого|нему|него)\s+ключ|по нему|кто в топ|как вырасти/.test(t)) key = aiLastKey(c, u);
  let a;
  if(key) a = aiAnsKey(key, t, mon || AI_DEMO_MON);
  else if(!mon) a = aiAnsHome(t);
  else if(/выпал|вылет|топ.?10|ушл/.test(t)) a = aiAnsDrop(mon);
  else if(/релевант|страниц/.test(t)) a = aiAnsSwap(mon);
  else if(/групп/.test(t)) a = aiAnsGroups(mon);
  else if(/изменил|последн|срез|нового|просел|упал|вырос/.test(t)) a = aiAnsLast(mon);
  else { const kx = aiFindKey(t); a = kx ? aiAnsKey({type:'key', gi:kx.gi, ki:kx.ki, di:null}, t, mon) : aiAnsOverview(mon, true); }
  if(ctx.some(x=>x.type==='img')) a.html = '<p class="ai-proto">Прототип: скриншот приложен к вопросу, но в демо не разбирается — ответ построен по данным мониторинга.</p>' + a.html;
  return a;
}

/* ---------- чаты ---------- */
function aiNewChat(mons){
  AI.chats = AI.chats.filter(x=>x.msgs.length); /* пустые черновики не копятся в истории */
  const c = {id:++aiSeq, title:'', mons:(mons||[]).slice(), msgs:[], pend:[], draft:'', at:Date.now()};
  AI.chats.unshift(c); AI.cur = c;
  return c;
}
function aiEnsureChat(){
  if(!AI.cur){ const pm = aiPageMon(); aiNewChat(pm ? [pm] : []); }
  return AI.cur;
}
const aiFindMsg = id => (AI.cur && AI.cur.msgs.find(m=>m.id===id)) || null;
function aiSeed(){ /* демо-история: ответы считаются лениво, по данным на момент открытия */
  const mon = AI_DEMO_MON, now = Date.now(), H = 3600e3, D = 24*H;
  let kw = null;
  GROUPS.some((g,gi)=>{ const ki = g.keys.findIndex(k=>k.kw==='списки минус слов adwords'); if(ki>=0){ kw = {type:'key', gi, ki, di:null}; return true; } return false; });
  const mk = (title, mons, at, pairs) => {
    const c = {id:++aiSeq, title, mons, msgs:[], pend:[], draft:'', at};
    pairs.forEach(([text, ctx, state])=>{
      const u = {id:++aiSeq, role:'user', text, ctx:ctx||[]};
      const m = {id:++aiSeq, role:'ai', state:state||'done', steps:[], html:'', model:AI_MODELS[0].id, q:u, credits:state==='error'?null:.17};
      if(!state) m.lazy = ()=>aiCompose(c, u);
      c.msgs.push(u, m);
    });
    return c;
  };
  AI.chats = [
    mk('Что изменилось в последнем срезе?', [mon], now - 2*H, [['Что изменилось в последнем срезе?']]),
    mk('Почему просел «списки минус слов adwords»?', [mon], now - D - 3*H, [['Почему просел этот ключ?', kw?[kw]:[]], ['Кто в ТОП-10 по этому ключу?']]),
    mk('Где сменилась релевантная страница?', [mon], now - 3*D, [['Где сменилась релевантная страница?']]),
    mk('Где просели позиции в последнем срезе?', [], now - 9*D, [['Где просели позиции в последнем срезе?']]),
    mk('Сравни мои позиции с ppc.world', [mon], now - 12*D, [['Сравни мои позиции с ppc.world', null, 'error']])
  ];
}

/* ---------- генерация (демо: шаги → стриминг по словам) ---------- */
function aiTokens(html){ return html.match(/<(button|tr|svg)\b[\s\S]*?<\/\1>|<[^>]+>|[^<\s]+\s*|\s+/g) || []; }
async function aiGenerate(c, m){
  const tok = {cancel:false};
  AI.run = {c, m, tok};
  const ans = aiCompose(c, m.q);
  Object.assign(m, {state: AI.demo.queue ? 'queue' : 'steps', steps:[], html:'', model:AI.model, credits:null, fb:0, open:false});
  aiRefreshMsg(m); aiRenderComp();
  const stopped = ()=>{ if(!tok.cancel) return false; m.state = 'stopped'; aiEndRun(m); return true; };
  if(m.state==='queue'){ await aiSleep(1800); if(stopped()) return; m.state = 'steps'; }
  for(const s of ans.steps){
    m.steps.push({t:s, done:false}); aiRefreshMsg(m);
    await aiSleep(420 + Math.random()*360); if(stopped()) return;
    m.steps[m.steps.length-1].done = true;
  }
  if(AI.demo.error){ m.state = 'error'; aiEndRun(m); return; }
  m.state = 'stream'; aiRefreshMsg(m);
  const tk = aiTokens(ans.html);
  for(let n=0; n<tk.length; ){
    n = Math.min(tk.length, n+3);
    m.html = tk.slice(0, n).join('');
    aiRefreshMsg(m, true);
    await aiSleep(22); if(stopped()) return;
  }
  m.html = ans.html; m.state = 'done';
  aiEndRun(m);
}
function aiEndRun(m){
  AI.run = null;
  if(m.state==='done' || (m.state==='stopped' && m.html)) m.credits = +(aiModel(m.model).cr * (.7 + .15*m.steps.length) * (m.state==='stopped'?.5:1)).toFixed(2);
  if(!AI.open){ AI.hasNew = true; aiSyncBtn(); }
  aiRefreshMsg(m); aiRenderComp();
}
function aiSend(text, extra){
  text = (text||'').trim();
  if(!text || AI.run || AI.demo.credits) return;
  const c = aiEnsureChat();
  const ctx = c.pend.slice();
  (extra||[]).forEach(x=>{ if(!ctx.some(y=>y.type===x.type && y.gi===x.gi && y.ki===x.ki)) ctx.push(x); });
  const u = {id:++aiSeq, role:'user', text, ctx};
  c.pend = []; c.draft = '';
  const ta = document.getElementById('aiTa'); ta.value = ''; aiAutosize();
  if(!c.title) c.title = aiShort(text, 52);
  c.at = Date.now();
  AI.chats = [c, ...AI.chats.filter(x=>x!==c)];
  const m = {id:++aiSeq, role:'ai', state:'steps', steps:[], html:'', model:AI.model, q:u};
  c.msgs.push(u, m);
  AI.view = 'chat';
  aiRender();
  aiGenerate(c, m);
}
function aiRetry(id){
  const m = aiFindMsg(id);
  if(!m || AI.run) return;
  aiGenerate(AI.cur, m);
}

function aiCtxChipHtml(x, i){
  const rm = i!=null ? `<button class="x" data-rm="p:${i}" title="Убрать" aria-label="Убрать из контекста">${AI_I.close}</button>` : '';
  if(x.type==='img') return `<span class="ai-chip"><img src="${x.url}" alt=""><span class="lb">${esc(x.name)}</span>${rm}</span>`;
  const k = GROUPS[x.gi].keys[x.ki];
  const p = x.di!=null ? k.pos[x.di] : null;
  const tail = x.di!=null ? ` · ${DATES[x.di].d} · поз. ${aiIsN(p)?p:(p==null?'—':'н/д')}` : '';
  return `<span class="ai-chip" title="${aiA(k.kw+tail)}"><span class="lb"><span class="k">Ключ:</span> ${esc(k.kw)}${tail}</span>${rm}</span>`;
}
function aiMsgHtml(m, isLast){
  if(m.role==='user'){
    const chips = (m.ctx||[]).filter(x=>x.type!=='img').map(x=>aiCtxChipHtml(x)).join('');
    const imgs = (m.ctx||[]).filter(x=>x.type==='img').map(x=>`<img class="ai-mimg" src="${x.url}" alt="${aiA(x.name)}">`).join('');
    return `<div class="ai-msg user" id="aim${m.id}">${chips?`<div class="ai-mctx">${chips}</div>`:''}${imgs}<div class="ai-bubble">${esc(m.text)}</div></div>`;
  }
  if(m.lazy){ const a = m.lazy(); m.html = a.html; m.steps = a.steps.map(t=>({t, done:true})); m.lazy = null; }
  const live = m.state==='steps' || m.state==='queue';
  const st = m.steps.length ? `<div class="ai-steps ${live?'live':''} ${m.open?'open':''}">${live ? '' :
      `<button class="ai-steps-t" data-act="steps" aria-expanded="${!!m.open}"><span class="chv">${AI_I.chevR}</span>Посмотрел данные · ${m.steps.length} ${aiPl(m.steps.length,['шаг','шага','шагов'])}</button>`}
      <ul class="ai-steps-l">${m.steps.map(s=>`<li class="ai-step"><span class="ic">${s.done?AI_I.ok:'<span class="ai-spin"></span>'}</span>${esc(s.t)}</li>`).join('')}</ul></div>` : '';
  const q = m.state==='queue' ? '<div class="ai-state"><span class="ai-spin"></span>В очереди — ответ начнётся через пару секунд</div>' : '';
  const body = (m.html || m.state==='stream') ? `<div class="ai-md ${m.state==='stream'?'streaming':''}">${m.html}</div>` : '';
  const stop = m.state==='stopped' ? '<div class="ai-stopped">Ответ остановлен</div>' : '';
  const err = m.state==='error' ? `<div class="ai-err"><b>Не удалось получить ответ</b>Модель ${esc(aiModel(m.model).name)} не ответила. Повторите запрос или выберите другую модель.<div class="ai-err-a"><button class="ai-btn" data-act="retry" data-m="${m.id}">${I.refresh} Повторить</button><button class="ai-btn" data-act="pickmodel">Сменить модель</button></div></div>` : '';
  const meta = (m.state==='done' || m.state==='stopped') ? `<div class="ai-meta">
      <button class="ai-ib" data-act="copy" data-m="${m.id}" title="Скопировать ответ" aria-label="Скопировать ответ">${I.copy}</button>
      ${isLast?`<button class="ai-ib" data-act="retry" data-m="${m.id}" title="Ответить заново" aria-label="Ответить заново">${I.refresh}</button>`:''}
      <button class="ai-ib ${m.fb===1?'on':''}" data-act="fb" data-v="1" data-m="${m.id}" title="Хороший ответ" aria-label="Хороший ответ" aria-pressed="${m.fb===1}">${AI_I.like}</button>
      <button class="ai-ib ${m.fb===-1?'on':''}" data-act="fb" data-v="-1" data-m="${m.id}" title="Плохой ответ" aria-label="Плохой ответ" aria-pressed="${m.fb===-1}"><span style="display:inline-flex;transform:rotate(180deg)">${AI_I.like}</span></button>
      <span class="sp"></span><span class="mdl" title="Модель и списанные кредиты kie.ai за ответ">${esc(aiModel(m.model).name)}${m.credits!=null?` · ${String(m.credits).replace('.',',')} кр.`:''}</span></div>` : '';
  return `<div class="ai-msg ai" id="aim${m.id}">${st}${q}${body}${stop}${err}${meta}</div>`;
}
function aiEmptyHtml(c){

}

function aiRenderFeed(){

  feed.innerHTML = c.msgs.length ? c.msgs.map((m,n)=>aiMsgHtml(m, n===c.msgs.length-1)).join('') : aiEmptyHtml(c);
  feed.scrollTop = feed.scrollHeight;
}
function aiRefreshMsg(m, streamOnly){
  const feed = document.getElementById('aiFeed');
  const el = feed && document.getElementById('aim'+m.id);
  if(!el || !AI.open || AI.view!=='chat') return;
  const stick = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 80;
  if(streamOnly){ const md = el.querySelector('.ai-md'); if(md){ md.innerHTML = m.html; } }
  else el.outerHTML = aiMsgHtml(m, AI.cur && AI.cur.msgs[AI.cur.msgs.length-1]===m);
  if(stick) feed.scrollTop = feed.scrollHeight;
}
function aiWhen(at){
  const d = new Date(at), n = new Date(), same = (a,b)=>a.toDateString()===b.toDateString();
  if(same(d,n)) return d.toLocaleTimeString('ru-RU',{hour:'2-digit', minute:'2-digit'});
  const y = new Date(n); y.setDate(n.getDate()-1);
  return same(d,y) ? 'вчера' : d.toLocaleDateString('ru-RU',{day:'numeric', month:'short'});
}
function aiBucket(at){
  const n = new Date(); n.setHours(0,0,0,0);
  const d = new Date(at); d.setHours(0,0,0,0);
  const diff = Math.round((n-d)/864e5);
  return diff<=0 ? 'Сегодня' : diff===1 ? 'Вчера' : diff<7 ? 'На этой неделе' : 'Ранее';
}

function aiRenderHistList(){

  if(!list.length){ el.innerHTML = `<div class="ai-hempty">${q?'Ничего не найдено':'Здесь появятся ваши чаты'}</div>`; return; }

  el.innerHTML = out;

    + '<div class="ai-menu-f">Модели, проверенные на данных CRAB. Работают через kie.ai, расход — в кредитах.</div>';

  aiHomeOverflow();
}
/* главная: таблица шире контейнера (узкое окно или открыта панель) — включаем горизонтальный скролл вместо обрезки */
function aiHomeOverflow(){
  if(PAGE!=='home') return;
  app.querySelectorAll('.home-page .table-wrap').forEach(w=>{
    w.classList.remove('ai-ovf');
    w.classList.toggle('ai-ovf', w.scrollWidth > w.clientWidth + 1);
  });
}
let __aiHoT;
window.addEventListener('resize', ()=>{ clearTimeout(__aiHoT); __aiHoT = setTimeout(aiHomeOverflow, 120); });
function aiToggle(on){
  AI.open = on==null ? !AI.open : !!on;
  if(AI.open){ AI.hasNew = false; aiRender(); aiFocusInput(); }
  else { const w = document.getElementById('aiModelW'); if(w) w.classList.remove('open'); }
  aiApplyLayout(); aiSyncBtn(); aiSaveUi();
}
function aiStartNew(mon){
  const pm = mon!==undefined ? mon : aiPageMon();
  const c = AI.cur;
  if(c && !c.msgs.length){ c.mons = pm ? [pm] : []; c.pend = []; }
  else aiNewChat(pm ? [pm] : []);
  AI.view = 'chat'; aiRender(); aiFocusInput();
}
function aiOpenChat(id){
  const c = AI.chats.find(x=>x.id===id); if(!c) return;
  AI.chats = AI.chats.filter(x=>x.msgs.length || x===c);
  AI.cur = c; AI.view = 'chat'; aiRender();
}
function aiOnPage(){ /* сменилась страница: пустой черновик чата подхватывает текущий мониторинг */
  const c = AI.cur, pm = aiPageMon();
  if(c && !c.msgs.length){ c.mons = pm ? [pm] : []; c.pend = c.pend.filter(x=>x.type==='img'); }
  if(AI.open) aiRender();
  aiHomeOverflow();
}
function aiBindChrome(){
  aiMount();
  const b = document.getElementById('aiBtn');
  if(b) b.onclick = ()=> aiToggle();
  aiSyncBtn();
  aiOnPage();
}
function aiAskAbout(gi, ki, di){
  aiCloseCellMenu();
  const pm = aiPageMon();
  let c = AI.cur;
  if(!c || (c.msgs.length && !c.mons.some(x=>aiSameMon(x, pm)))) c = aiNewChat(pm ? [pm] : []);
  else if(!c.msgs.length) c.mons = pm ? [pm] : [];
  c.pend = c.pend.filter(x=>x.type!=='key');
  c.pend.push({type:'key', gi, ki, di});
  AI.view = 'chat';
  if(!AI.open) aiToggle(true); else { aiRender(); aiFocusInput(); }
}
/* переходы из ответа в данные: при необходимости сначала открываем мониторинг чата */
function aiEnsureMonPage(){
  const mon = AI.cur && AI.cur.mons[0];
  if(PAGE==='mon' && (!mon || aiSameMon(aiPageMon(), mon))) return;
  if(mon && mon.pid!=null) goMon(mon.pid, mon.mid); else goMon(null);
}
function aiFlash(r){
  r.scrollIntoView({behavior:'smooth', block:'center'});
  r.classList.remove('flash'); void r.offsetWidth; r.classList.add('flash');
  if(innerWidth < 900) aiToggle(false); /* на телефоне панель закрывает таблицу */
}
function aiGoKey(gi, ki){
  aiEnsureMonPage();
  const r = app.querySelector(`tr.kw-row[data-key="${gi}:${ki}"]`); if(!r) return;
  const sr = app.querySelector(`tr.super-row[data-sid="${r.dataset.super}"]`);
  if(sr && sr.classList.contains('collapsed')) sr.click();
  const gr = app.querySelector(`tr.group-row[data-group="${r.dataset.parent}"]`);
  if(gr && gr.classList.contains('collapsed')) gr.click();
  if(r.classList.contains('v-hide')){ const all = app.querySelector('.vt[data-view="all"]'); if(all) all.click(); }
  aiFlash(r);
}
function aiGoGroup(gi){
  aiEnsureMonPage();
  const gr = app.querySelector(`tr.group-row[data-group="${gi}"]`); if(!gr) return;
  const sr = app.querySelector(`tr.super-row[data-sid="${gr.dataset.super}"]`);
  if(sr && sr.classList.contains('collapsed')) sr.click();
  if(gr.classList.contains('v-hide')){ const all = app.querySelector('.vt[data-view="all"]'); if(all) all.click(); }
  aiFlash(gr);
}
function aiGoSerp(gi, ki, di){ aiEnsureMonPage(); openSerp(gi, ki, di); }

/* контекстное меню ячейки позиции */
function aiShowCellMenu(gi, ki, di, x, y){
  closeTypMenu(); closeSwapPop(); closeKuPop();
  const cm = document.getElementById('aiCellMenu'); if(!cm) return;
  const k = GROUPS[gi].keys[ki];
  cm.innerHTML = `<div class="tm-title"><b>${esc(aiShort(k.kw, 34))}</b> · ${DATES[di].d}</div>
    <button class="tm-item" data-cm="serp" role="menuitem">${AI_I.serp}Открыть ТОП выдачи</button>
    <button class="tm-item" data-cm="ask" role="menuitem">${AI_I.spark}Спросить ассистента о позиции</button>`;
  cm.classList.add('open');
  const w = cm.offsetWidth, h = cm.offsetHeight;
  cm.style.left = Math.max(8, Math.min(x, innerWidth - w - 8)) + 'px';
  cm.style.top = (y + h > innerHeight - 8 ? Math.max(8, y - h) : y) + 'px';
  cm.onclick = e=>{
    const b = e.target.closest('[data-cm]'); if(!b) return;
    aiCloseCellMenu();
    if(b.dataset.cm==='serp') openSerp(gi, ki, di); else aiAskAbout(gi, ki, di);
  };
}
function aiCloseCellMenu(){ const cm = document.getElementById('aiCellMenu'); if(cm) cm.classList.remove('open'); }

function aiMount(){
  if(document.getElementById('aiPanel')) return;
  const el = document.createElement('aside');
  el.className = 'ai-panel'; el.id = 'aiPanel'; el.setAttribute('aria-label', 'Ассистент');
  el.innerHTML = `<header class="ai-head" id="aiHead"></header>
    <div class="ai-feed" id="aiFeed"></div>
    <div class="ai-hist" id="aiHist" hidden></div>
    <div class="ai-comp" id="aiComp">
      <div id="aiCompTop"></div>
      <div class="ai-box">
        <div class="ai-pend" id="aiPend"></div>
        <textarea class="ai-ta" id="aiTa" rows="2" aria-label="Вопрос ассистенту"></textarea>
        <div class="ai-bar">
          <button class="ai-ib" id="aiClip" aria-label="Приложить скриншот">${AI_I.clip}</button>
          <input type="file" id="aiFile" accept="image/*" hidden>
          <span class="ai-model-w" id="aiModelW"><button class="ai-model" id="aiModelBtn" aria-haspopup="menu" title="Модель для ответа"></button><div class="ai-menu" id="aiMenu" role="menu"></div></span>
          <button class="ai-send" id="aiSend"></button>
        </div>
      </div>
      <div class="ai-note">Ассистент может ошибаться — проверяйте цифры по ссылкам в ответе.</div>
    </div>`;
  document.body.appendChild(el);
  const cm = document.createElement('div'); cm.id = 'aiCellMenu'; cm.setAttribute('role', 'menu');
  document.body.appendChild(cm);
  const mw = el.querySelector('#aiModelW'), ta = el.querySelector('#aiTa');

  el.addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b || !el.contains(b) || b.disabled) return;
    const act = b.dataset.act;
    if(b.id==='aiModelBtn'){ mw.classList.toggle('open'); return; }
    if(b.id==='aiSend'){ if(AI.run && AI.run.c===AI.cur) AI.run.tok.cancel = true; else aiSend(ta.value); return; }
    if(b.id==='aiClip'){ el.querySelector('#aiFile').click(); return; }
    if(b.dataset.model){ AI.model = b.dataset.model; aiSaveUi(); mw.classList.remove('open'); aiRenderComp(); return; }
    if(act==='close'){ aiToggle(false); const t = document.getElementById('aiBtn'); if(t) t.focus(); return; }
    if(act==='hist'){ AI.view = AI.view==='hist' ? 'chat' : 'hist'; aiRender(); if(AI.view==='chat') aiFocusInput(); return; }
    if(act==='new'){ aiStartNew(); return; }
    if(act==='wide'){ AI.wide = !AI.wide; aiApplyLayout(); aiRenderHead(); aiSaveUi(); return; }
    if(act==='newfor'){ aiStartNew(aiPageMon()); return; }
    if(act==='addmon'){ const pm = aiPageMon(), c = aiEnsureChat(); if(pm && !c.mons.some(x=>aiSameMon(x, pm))) c.mons.push(pm); aiRenderHead(); aiRenderComp(); return; }
    if(act==='pickmodel'){ e.stopPropagation(); mw.classList.add('open'); return; }
    if(act==='retry'){ aiRetry(+b.dataset.m); return; }
    if(act==='steps'){ const m = aiFindMsg(+b.closest('.ai-msg').id.slice(3)); if(m){ m.open = !m.open; aiRefreshMsg(m); } return; }
    if(act==='fb'){ const m = aiFindMsg(+b.dataset.m); if(m){ const v = +b.dataset.v; m.fb = m.fb===v ? 0 : v; aiRefreshMsg(m); } return; }
    if(act==='copy'){
      const m = aiFindMsg(+b.dataset.m); if(!m) return;
      const d = document.createElement('div'); d.innerHTML = m.html;
      copyText(d.innerText || d.textContent);
      b.innerHTML = I.check; setTimeout(()=>{ b.innerHTML = I.copy; }, 1200);
      return;
    }
    if(b.dataset.q){ aiSend(b.dataset.q, b.dataset.ctx ? [JSON.parse(b.dataset.ctx)] : null); return; }
    if(b.dataset.rm){
      const [t, i] = b.dataset.rm.split(':'), c = aiEnsureChat();
      if(t==='mon') c.mons.splice(+i, 1); else c.pend.splice(+i, 1);
      aiRenderHead(); aiRenderComp(); if(!c.msgs.length) aiRenderFeed();
      return;
    }
    if(b.dataset.key){ const [gi, ki] = b.dataset.key.split(':').map(Number); aiGoKey(gi, ki); return; }
    if(b.dataset.serp){ const [gi, ki, di] = b.dataset.serp.split(':').map(Number); aiGoSerp(gi, ki, di); return; }
    if(b.dataset.group){ aiGoGroup(+b.dataset.group); return; }
    if(b.dataset.mon){ const [pid, mid] = b.dataset.mon.split(':'); if(innerWidth < 900) aiToggle(false); goMon(pid, mid); return; }
    if(b.dataset.chat){ aiOpenChat(+b.dataset.chat); return; }
  });
  ta.addEventListener('input', ()=>{ const c = aiEnsureChat(); c.draft = ta.value; aiAutosize(); aiUpdSend(); });
  ta.addEventListener('keydown', e=>{
    if(e.key==='Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); aiSend(ta.value); }
  });
  el.querySelector('#aiFile').addEventListener('change', e=>{
    const f = e.target.files[0]; if(!f) return;
    const c = aiEnsureChat();
    c.pend = c.pend.filter(x=>x.type!=='img');
    c.pend.push({type:'img', name:f.name, url:URL.createObjectURL(f)});
    e.target.value = '';
    aiRenderComp();
  });
  el.addEventListener('input', e=>{ if(e.target.id==='aiHistQ'){ AI.histQ = e.target.value; aiRenderHistList(); } });
  el.addEventListener('change', e=>{ const d = e.target.dataset.demo; if(d){ AI.demo[d] = e.target.checked; aiRenderComp(); } });
  el.addEventListener('keydown', e=>{
    if(e.key!=='Escape') return;
    if(mw.classList.contains('open')){ mw.classList.remove('open'); return; }
    /* Esc закрывает панель, только если поверх нет модалки/попапа — их закрывает общий обработчик */
    if(document.querySelector('.serp-modal.open, .comp-modal.open, #typMenu.open, #aiCellMenu.open')) return;
    aiToggle(false); const t = document.getElementById('aiBtn'); if(t) t.focus();
  });
}
document.addEventListener('click', e=>{
  const mw = document.getElementById('aiModelW');
  if(mw && mw.classList.contains('open') && !mw.contains(e.target)) mw.classList.remove('open');
  const cm = document.getElementById('aiCellMenu');
  if(cm && cm.classList.contains('open') && !cm.contains(e.target)) aiCloseCellMenu();
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') aiCloseCellMenu();
  if((e.metaKey || e.ctrlKey) && !e.shiftKey && e.key.toLowerCase()==='j'){ e.preventDefault(); aiToggle(); }
});
window.addEventListener('scroll', aiCloseCellMenu, {passive:true});
{ /* восстановить открытие/ширину/модель ДО первого рендера — чтобы первая раскладка таблицы считалась уже с панелью */
  const ui = aiLoadUi();
  AI.open = !!ui.open; AI.wide = !!ui.wide;
  if(ui.model && AI_MODELS.some(m=>m.id===ui.model)) AI.model = ui.model;
  document.body.classList.toggle('ai-open', AI.open);
  document.body.classList.toggle('ai-wide', AI.wide);
  aiSeed();
}

route(); /* стартовый экран по URL: главная или страница позиций мониторинга */
</script>
